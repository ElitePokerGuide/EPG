- id: c-cash-6max-gp32-checked-down-range-is-high-cards-001
  format: cash-6max
  topic: river-play
  concepts: [range-composition, river-stab, checked-down]
  level: intermediate
  street: river
  pot_type: srp
  position: ip
  title: After checking flop and turn in position, your river range is mostly unpaired high cards
  claim: When the hand checks through to the river in a single-raised pot, the in-position player holds very few pairs and a lot of king-high and ace-high hands. Build your river strategy around that fact rather than around the strong hands you would have bet earlier.
  why: "Pairs and better bet the flop or turn most of the time, so they rarely reach a checked-down river. What arrives is the hands that had nothing to bet with: unpaired Broadway cards, some weak pairs that checked once, and air. On low boards that means your value comes from a king or ace that is now the best hand far more often than it looks, and your bluffs come from the weakest unpaired hands. Thinking about which hands actually survive the line is what makes the river thresholds make sense."
  common_mistake: Checking king-high on a low river out of habit, when it is near the top of the range that takes this line.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/032-training-river-value-and-bluff-thresholds
      chunk: rio-game-plan/032-training-river-value-and-bluff-thresholds#01
      stance: supports
      note: Coach reasons that after checking a low board twice IP you lack pairs and have a ton of kings, which anchor the strategy.
  consensus_score: 0.5
  hook_ideas:
    - "King-high on the river is often your value hand."
    - "You checked twice. Now what's actually in your range?"
    - "Why ace-high bets rivers more than you think."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp32-half-pot-dominant-thin-value-002
  format: cash-6max
  topic: value-betting
  concepts: [thin-value, river-sizing, half-pot]
  level: intermediate
  street: river
  pot_type: srp
  position: ip
  title: Half pot is the main river size after a checked-down hand, and it goes thin
  claim: On most textures where the hand checks to the river, the solver's most common in-position bet is around half pot, and it uses that size with second pair, weak top pair and even small pocket pairs. Pot-size bets are reserved for the top of the range on textures where the opponent holds a lot of calling hands.
  why: The opponent who checked three times is capped and holds many weak pairs and unpaired hands. A half-pot bet gets called by enough of those hands to make value bets with medium strength profitable, while keeping the loss small when you run into something better. Going big with everything folds out exactly the hands you want to be called by. Players who default to pot leave a layer of thin value unbet, which quietly lowers their river betting frequency.
  common_mistake: Checking middle pair or a low pocket pair on the river because it does not feel strong enough for a pot-size bet, instead of sizing down.
  numbers:
    - "Example texture: top pair ~23% of river range; another ~11% of second pair and low pocket pairs value bet at half pot"
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/032-training-river-value-and-bluff-thresholds
      chunk: rio-game-plan/032-training-river-value-and-bluff-thresholds#02
      stance: supports
      note: Coach surprised that half pot is "way more common" with pocket nines, Tx and Jx; "a lot more thin value betting than anticipated".
  consensus_score: 0.5
  hook_ideas:
    - "Second pair on the river. Bet half pot, don't check."
    - "The river size most players never use enough."
    - "Pocket deuces can value bet this river. Really."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp32-big-size-vs-low-check-raisers-003
  format: cash-6max
  topic: exploits
  concepts: [river-sizing, check-raise-frequency, population-exploit]
  level: intermediate
  street: river
  pot_type: srp
  position: ip
  title: Against opponents who rarely check-raise rivers, keep going big with your value
  claim: Solvers mix half-pot bets into strong hands partly to protect against river check-raises. Against the typical opponent who almost never check-raises the river, that protection is unnecessary, so betting the largest size your hand can support remains the better play.
  why: The reason a solver spreads strong hands across sizes is that a pure big-betting range would be easy to attack with raises. Real players at most stakes raise rivers far less than equilibrium, so the big bet faces calls or folds, not pressure. Against them, maximizing the amount called with each value hand matters more than balance. Learn the equilibrium sizes in the trainer, but do not let a check-raise-heavy solver talk you out of a habit that profits against your actual pool.
  common_mistake: Copying the solver's half-pot frequency against players who will never punish the bigger size.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/032-training-river-value-and-bluff-thresholds
      chunk: rio-game-plan/032-training-river-value-and-bluff-thresholds#02
      stance: supports
      note: Coach attributes his biggest-size habit to opponents who don't check-raise enough and says not to be scared away from it; against most opponents it is not his top concern.
  consensus_score: 0.5
  contradictions:
    - "Some coaches teach copying solver river sizing mixes regardless of opponent; this source says go big against passive pools."
  hook_ideas:
    - "The solver bets half pot. You should bet more."
    - "Most regs never check-raise rivers. Punish that."
    - "Why your river bets should be bigger than GTO."
  status: draft
