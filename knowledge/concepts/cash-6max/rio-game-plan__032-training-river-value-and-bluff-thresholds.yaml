- id: c-cash-6max-gp32-distribution-before-sizing-008
  format: cash-6max
  topic: study-methods
  concepts: [trainer-drills, river-thresholds, prioritization]
  level: intermediate
  street: river
  pot_type: srp
  position: ip
  title: Drill river thresholds first; sizing and blocker details come later
  claim: "When training river stabs, aim first at getting the bet-or-check decision right across hand classes: not value betting too thin, not missing value, not bluffing with showdown value, not missing bluffs. Treat exact size choices and blocker nuance as a second pass."
  why: The largest river mistakes are frequency mistakes, like checking a whole class of thin value or bluffs. A sizing mix that is slightly off costs a fraction of a blind; a hand class that never bets costs far more. Running a fast drill with the single question "does this hand bet?" also lets you cover many textures in one session and reveals your thresholds quickly. Once the distribution is right, come back to size selection with a clear picture of which hands are betting.
  common_mistake: Agonizing over half pot versus pot in the drill while whole hand classes are still being checked that should bet.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/032-training-river-value-and-bluff-thresholds
      chunk: rio-game-plan/032-training-river-value-and-bluff-thresholds#01
      stance: supports
      note: Coach plays fast, ignores sizing and blocker usage, and tests only the gist of the bet distribution.
  consensus_score: 0.5
  hook_ideas:
    - "Stop fussing over river sizing. Fix this first."
    - "Bet or check? Answer that before anything else."
    - "The fast river drill that finds your thresholds."
  status: draft
