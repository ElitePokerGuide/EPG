      stance: supports
      note: "Coach: on a four-straight an ace is still strong and can pot; this is a bet he did not used to make."
  consensus_score: 0.5
  hook_ideas:
    - "Four to a straight. Ace-high. Bet pot."
    - "The scary river you should be betting big on."
