- id: c-cash-6max-gp32-dont-study-unreachable-spots-010
  format: cash-6max
  topic: study-methods
  concepts: [training-priority, paired-boards, game-tree]
  level: intermediate
  street: river
  pot_type: srp
  position: ip
  title: Skip drilling spots your strategy almost never reaches
  claim: Before studying a surprising river result, check how often your strategy actually gets there. A checked-down river on a paired board, for instance, barely exists because the in-position player bets most pairs on the flop or turn, so a strange value bet there is not worth your time.
  why: Trainer drills deal every possible path, including lines that are a small fraction of a small fraction of hands. Results in those lines are both rare in practice and less reliable, because solver accuracy degrades with every low-frequency branch. Spending study time on them teaches you something you will almost never use. Verify the path frequency, note it, and move on to spots that occur every session.
  common_mistake: Deep-diving a bizarre solver play without noticing the line is taken a fraction of a percent of the time.
  numbers:
    - "Example: low pocket pairs bet ~74% on a paired flop, so they rarely reach a checked-down river"
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/032-training-river-value-and-bluff-thresholds
      chunk: rio-game-plan/032-training-river-value-and-bluff-thresholds#02
      stance: supports
      note: Coach dismisses paired-board checked-down results as a spot "almost never going to play"; flop bet 74% with those pairs.
  consensus_score: 0.5
  hook_ideas:
    - "That weird solver play? You'll never be in that spot."
    - "Study what happens, not what could happen."
    - "One question before you analyze any hand."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp32-size-for-what-they-hold-011
  format: cash-6max
  topic: bet-sizing
  concepts: [target-hands, river-sizing, blockers]
  level: advanced
  street: river
  pot_type: srp
  position: ip
  title: Size the river bet for the hands your opponent actually holds
  claim: Choose the value size by asking which hands in the opponent's range will call. If the natural target is rare, say a jack on a low board after three checks, size to get called by what is actually there, like ace-high. If your hand blocks the main calling hands, size down.
  why: A value bet is only as good as the calling range it targets. After a checked-down hand, the opponent's medium pairs may be nearly absent, so a pot-size bet aimed at them is aimed at nothing; a size that ace-high or king-high calls does better. Likewise, holding one of the cards the opponent needs to call with cuts the calling range, so the same hand should bet smaller than its naked version. The solver's sizing choices in these spots mostly reflect this logic rather than hand strength alone.
  common_mistake: Sizing by absolute hand strength ("top pair bets pot") without checking what remains in the opponent's range.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/032-training-river-value-and-bluff-thresholds
      chunk: rio-game-plan/032-training-river-value-and-bluff-thresholds#02
      stance: supports
      note: Coach reasons a jack is so rare that pot targets ace-high; earlier notes blocking the queen makes a king go half pot.
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/032-training-river-value-and-bluff-thresholds
      chunk: rio-game-plan/032-training-river-value-and-bluff-thresholds#01
      stance: supports
      note: "\"I guess blocking the queen\" leads to half pot with a hand that otherwise pots."
  consensus_score: 0.5
  hook_ideas:
    - "Who is calling your river bet? Size for them."
    - "Top pair doesn't decide the size. Their range does."
    - "Blocking their calls? Bet smaller."
  status: draft
  created: "2026-10-04"
