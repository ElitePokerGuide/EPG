- id: c-cash-6max-x-ace-high-flop-cbet-001
  kind: consensus
  format: cash-6max
  topic: cbet-strategy
  concepts: [ace-high-flops, cbet-frequency, small-bet, protection]
  level: intermediate
  street: flop
  pot_type: srp
  position: ip
  title: "Ace-high flops in position: bet small, but how often is disputed"
  claim: "On an ace-high flop the raiser's c-bet is small, about a quarter to a third of the pot, because an ace on board lets any random ace beat your overpairs. Whether you fire that small bet with your whole range or check back a third of the time or more is where the schools split."
  why: "Everyone agrees on why the size is small: the ace erases the nut advantage your overpairs gave you, and the caller holds plenty of weak aces that will not fold. The frequency argument runs two ways. One camp reads aggregate solver output as a near range-bet: the raiser has the clear range edge, the caller has few hands that can raise, and a quarter-pot bet taxes all the junk cheaply. The other camp points out that top pair and second pair on AQ2 need little protection, since a king or jack turn rarely lets a folded hand overtake you, and that two-tone ace-high flops give the caller many draws, so the solver lands near 33% c-bet on boards like AQ2 or A32 two-tone. Our read: rainbow ace-high with disconnected low cards is close to a range bet; add a flush draw or Broadway connectivity and the checks come back."
  common_mistake: "Auto-betting every ace-high flop 'because I have the ace in my range', or sizing up with top pair on A72 and splitting your range."
  numbers:
    - "Small c-bet on ace-high flops: ~25-33% pot"
  merged_from:
    - c-cash-6max-gp23-small-bet-paired-ace-high-002
    - c-cash-6max-gp30-two-broadway-keep-both-sizes-003
    - c-cash-6max-tc14-low-frequency-flop-types-002
    - c-cash-6max-tc15-ace-high-flops-less-protection-007
    - c-cash-6max-tc13-overbet-high-card-flops-001
    - c-cash-6max-cc06-textures-that-remove-nut-advantage-020
  source_refs:
    - school: rio
      course: "The Game Plan"
      lesson: rio-game-plan/023-building-flop-strategies
      chunk: "rio-game-plan/023-building-flop-strategies#01"
      stance: supports
      note: "Paired and most ace-high flops are a ~25% c-bet at very high frequency, rainbow or two-tone; an ace added to a two-Broadway board collapses to a range bet."
    - school: 2cc
      course: "Mini-Course: Flop Exploits"
      lesson: 2cc-flop-exploits/015-simple-gto-frequency-pt-2
      chunk: "2cc-flop-exploits/015-simple-gto-frequency-pt-2#02"
      stance: contradicts
      note: "Ace-high two-tone flops (AQ2, A32) sit near 33% c-bet because top/second pair need no protection; yet rainbow AK7/AQ4 are overbet boards in the 33/116 system."
    - school: cc
      course: "Carrot Poker School Grade 0"
      lesson: cc-grade-0/007-grade-0-july-lecture-6-c-bet-grequency-and-sizing-range-and-
      chunk: "cc-grade-0/007-grade-0-july-lecture-6-c-bet-grequency-and-sizing-range-and-#05"
      stance: nuances
      note: "Only addresses size: an ace on board strips the raiser's overpair nut advantage, so c-bet small; no frequency claim."
  consensus_score: 0.5
  contradictions:
    - "Some coaches treat ace-high flops as a quarter-pot range bet at a very high frequency, while others show solver c-bet frequencies near 33% on ace-high two-tone flops and check back many top and second pairs."
    - "Some coaches even overbet rainbow ace-high flops with two Broadway cards such as AK7 or AQ4, while others put every ace-high flop in the small-bet group."
  hook_ideas:
    - "Two solver-based courses, same flop, opposite answers."
    - "Top pair on an ace-high flop doesn't need protection. So why bet?"
    - "Everyone bets small on ace-high flops. Nobody agrees how often."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-x-range-bet-high-paired-flops-001
  kind: consensus
  format: cash-6max
  topic: cbet-strategy
  concepts: [paired-boards, range-bet, small-bet, trips]
  level: beginner
  street: flop
  pot_type: srp
  position: ip
  title: "Range-bet high paired flops small; low paired flops are the exception"
  claim: "On AAx, KKx and QQx flops the preflop raiser can bet the whole range for a small size, about a quarter to a third of the pot. The caller flat-called with a range whose strong aces and kings mostly 3-bet preflop, so the trips belong to you and they mostly hold air. Lower paired boards, around TTx and below, need a different plan."
  why: "A paired flop is hard to hit: only two cards in the deck make trips, and the caller's strong Ax and Kx mostly 3-bet preflop instead of calling. So on a high paired board one player owns the trips and the other has small pairs and nothing. Every reason to bet improves at once, which is why solvers bet close to 100%. The size stays small because the caller does hold some trips and few hands can raise you, so a quarter-pot bet taxes the junk without exposing your medium hands. As the pair rank drops, the caller holds the paired card more often, the correct defense (pairs, straight draws, suited cards) becomes obvious, and check-raises rise, so the solver mixes in checks and the schools stop agreeing on what to do."
  common_mistake: "Slowing down on KK4 because 'nobody has anything', and checking back a range that would print money betting."
  numbers:
    - "High paired flops (AAx/KKx/QQx): c-bet close to 100% at ~25-33% pot"
  merged_from:
