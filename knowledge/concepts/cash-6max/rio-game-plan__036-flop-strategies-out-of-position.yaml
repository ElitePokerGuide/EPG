- id: c-cash-6max-gp36-wide-3bet-ranges-check-more-001
  format: cash-6max
  topic: cbet-strategy
  concepts:
  - 3bet-pots
  - range-advantage
  - checking-frequency
  - polarization
  - wide-ranges
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Wide 3-bet ranges mean the 3-bettor checks far more often out of position
  claim: In 3-bet pots where both ranges are wide, the out-of-position 3-bettor should check the flop
    much more than in tighter-range formats, and when betting, lean toward polarized large bets rather
    than frequent small ones.
  why: The small range bet works when the aggressor's range is clearly stronger on most flops. A wide
    3-bet range against a wide calling range loses that edge, and many textures quietly favour the in-position
    caller. With less range advantage, betting the whole range small bleeds value, so the solution is
    to check often and bet big with a polarized range on the textures where betting is still good. A player
    can still build a profitable plan with more c-betting than theory, but they should know they are paying
    for it in EV.
  common_mistake: Carrying the six-handed habit of range-betting small as the 3-bettor into wide-range
    blind-vs-blind or button-vs-blind 3-bet pots.
  hook_ideas:
  - The 3-bettor checks here. Most players can't believe it.
  - Range betting small in 3-bet pots has a hidden cost.
  - Checking makes you more money in these 3-bet pots.
  source_refs:
