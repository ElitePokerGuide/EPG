    lesson: rio-game-plan/036-flop-strategies-out-of-position
    chunk: rio-game-plan/036-flop-strategies-out-of-position#04
    stance: supports
    note: Coach wants one or two options at the first decision point for visibility of later branches.
  consensus_score: 0.5
  status: draft
