- id: c-cash-6max-gp36-high-low-low-range-check-010
  format: cash-6max
  topic: cbet-strategy
  concepts:
  - high-low-low
  - range-check
  - small-bet-fails
  - fold-frequency
  - 3bet-pots
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Range-check jack-to-king-high dry flops as the 3-bettor in wide-range pots
  claim: On flops headed by a jack, queen or king with two low disconnected cards (not ace high), the
    out-of-position 3-bettor can check the entire range. Removing checks is the most expensive mistake
    on these boards and a small range bet gets almost no folds.
  why: The 3-bettor's range is full of broadway cards that miss a board like Q-7-3 or J-6-2, while the
    caller's suited connectors, small pairs and low suited hands connect or hold backdoors. A quarter-pot
    stab makes the caller fold only around 13%, so it buys nothing. Checking the whole range costs almost
    no EV against a correct opponent, whose checking frequency rises only about 3% in response, and it
    funnels the pot into check-raise and delayed lines where the 3-bettor's value hands do better. This
    texture category excludes ace-high boards and boards where the middle card makes high-end straight
    draws.
  numbers:
  - Caller folds ~13% to a 25% pot c-bet on high-low-low flops
  - In-position checking frequency rises only ~3% when the 3-bettor range-checks
  common_mistake: Auto c-betting Q-7-3 as the 3-bettor because "I have the range advantage", then facing
    a raise or a call with no plan.
  hook_ideas:
  - 3-bet, flop Q-7-3, and the right play is check. Always.
  - A c-bet that gets 13% folds is not a c-bet.
  - The dry flop where the 3-bettor should stop betting.
  source_refs:
  - school: rio
    course: The Game Plan
    lesson: rio-game-plan/036-flop-strategies-out-of-position
    chunk: rio-game-plan/036-flop-strategies-out-of-position#04
    stance: supports
    note: Coach shows the simplifier result and adopts range check for the category; HU framing.
  consensus_score: 0.5
  status: needs-review
  created: '2026-10-04'
  review_note: Source framed for heads-up 100-120bb; say so in why or re-tag format.
- id: c-cash-6max-gp36-check-raise-the-float-on-dry-high-boards-011
  format: cash-6max
  topic: check-raising
  concepts:
  - float-bet
  - check-raise-value
  - overfloating
  - pocket-pairs
  - 3bet-pots
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: After range-checking a dry high flop, check-raise aggressively into the stab
  claim: When the 3-bettor checks a jack-to-king-high dry flop, the in-position caller is supposed to
    bet about half the time and in practice often bets more. A high check-raise frequency, including value
    hands, attacks that line and gets more money in than c-betting would.
  why: The caller's natural stabs on these boards are hands with a small pair, a low connector or a wheel
    draw, plus broadway hands that connect with the king or queen. Those are easy bluffs to find, so real
    players stab at least as often as theory. Against a large check-raise the caller must fold medium
    and low pocket pairs that bet the flop and fold the overcards that lack a backdoor flush draw, and
    most players under-fold here. Value hands in the 3-bettor's range therefore collect extra bets and
    fewer folds by check-raising than by leading, which is a core reason to prefer the range check on
    this texture.
  common_mistake: Checking the flop as the 3-bettor with a strong hand and then only calling the stab,
    giving up the raise that the texture is built for.
  hook_ideas:
  - Let them stab, then raise. The dry-flop trap for 3-bettors.
  - Why your top pair wants to check-raise, not c-bet, here.
  - They bet half the time into your check. Punish it.
  source_refs:
  - school: rio
    course: The Game Plan
    lesson: rio-game-plan/036-flop-strategies-out-of-position
    chunk: rio-game-plan/036-flop-strategies-out-of-position#04
    stance: supports
    note: IP float frequency ~50%; coach expects more in practice and leans into check-raising value.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-gp36-checking-opens-delayed-lines-012
  format: cash-6max
  topic: turn-play
  concepts:
  - delayed-cbet
  - check-check-lines
  - range-check
  - strategy-design
  - 3bet-pots
  level: advanced
  street: multi-street
  pot_type: 3bet-pot
  position: oop
  title: Build more flop checks into your plan to reach profitable delayed lines
  claim: A strategy that checks the flop more often as the 3-bettor reaches delayed c-bet and check-check-check
    lines more often, and those lines hold extra EV against most opponents. Choose flop simplifications
    partly for how often they get you there.
  why: Players defend flop c-bets reasonably well because they face them constantly, but turn probes,
    delayed bets after a flop check-through and river decisions after two checks are studied far less
    and played worse. The only way to get to those nodes is to check the flop. If the flop check costs
    almost nothing in theory on a texture, the practical upside of the later streets makes range-checking
    there a clear choice rather than a toss-up.
  common_mistake: Judging a flop check only by the flop EV and ignoring the easier turn and river spots
    it leads into.
  hook_ideas:
  - The best spots in 3-bet pots start with a flop check.
  - Check now, collect on the turn. The delayed-line edge.
  - Why checking the flop is an investment, not a surrender.
  source_refs:
