- id: c-cash-6max-gp36-pick-size-that-fits-most-textures-005
  format: cash-6max
  topic: bet-sizing
  concepts:
  - simplification
  - single-size
  - texture-grouping
  - small-bet
  - 3bet-pots
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: When a category mixes sizes, keep the one that works on the most textures
  claim: If a board class shows a mix of small, medium and large bets, simplify to the size that stays
    useful across the widest set of boards in the group, then check the few textures that preferred another
    size to confirm the loss is small.
  why: Low paired boards in 3-bet pots mix three sizes, but adding a high card to the texture removes
    the large bet entirely while the small bet survives, and a related high-paired board uses only the
    small bet. A size that keeps showing up across variations is the safe default for the whole category.
    Before committing, look at the boards where the bigger size was preferred and check the opponent's
    response to the small bet there. If they must still defend a wide, awkward set of hands, the small
    size is good enough and the strategy stays simple.
  common_mistake: Choosing the size that looks best on one representative flop and applying it to the
    whole category without checking the neighbours.
  hook_ideas:
  - Three solver sizes, one table decision. Pick like this.
  - The bet size that survives every version of the board.
  - Simplify sizing without giving away the pot.
  source_refs:
