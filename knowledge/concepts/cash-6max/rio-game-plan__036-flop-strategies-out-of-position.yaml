- id: c-cash-6max-gp36-disconnected-ak-high-range-bet-002
  format: cash-6max
  topic: board-textures
  concepts:
  - ace-high-boards
  - king-high-boards
  - broadway-connectivity
  - range-bet
  - 3bet-pots
  level: intermediate
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Ace or king high with no Broadway connection is still a range-bet for the 3-bettor
  claim: Flops like A-8-x or K-7-x, where the middle card does not connect to Broadway, remain high-frequency
    small-bet textures for the 3-bettor even in wide-range 3-bet pots. Paired boards behave the same way.
  why: The 3-bettor's range is heavy in big aces and big kings and light in middling connectors, so a
    single high card with disconnected low cards gives them a large share of top pairs while the caller's
    suited connectors and small pairs miss. Once the other two cards start connecting to Broadway (K-Q-x,
    A-J-T), the caller's broadway hands make pairs, draws and two-pair combos that erase the 3-bettor's
    edge, so those boards shift toward checking and polarized sizing. Lack of connectivity is the feature
    that makes the texture good for the aggressor.
  common_mistake: Treating every ace-high board the same way instead of separating A-8-3 from A-J-T.
  hook_ideas:
  - A-8-3 and A-J-T are not the same flop for a 3-bettor.
  - The flop feature that decides whether you range bet.
  - Why disconnected high cards are the 3-bettor's best friend.
  source_refs:
  - school: rio
    course: The Game Plan
    lesson: rio-game-plan/036-flop-strategies-out-of-position
    chunk: rio-game-plan/036-flop-strategies-out-of-position#01
    stance: supports
    note: Aggregate report shows small range bets on paired and disconnected A/K-high boards.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-gp36-geometric-two-street-sizing-003
  format: cash-6max
  topic: bet-sizing
  concepts:
  - geometric-sizing
  - two-broadway-boards
  - polarization
  - large-bets
  - 3bet-pots
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Two-Broadway flops in 3-bet pots want a geometric two-street size or a check
  claim: On flops with two Broadway cards, the 3-bettor's strategy is mostly checking with a low frequency
    of large bets sized so that two equal bets get all the money in by the turn. Expect to bet roughly
    a fifth to a quarter of the time and check the rest.
  why: Geometric sizing splits the remaining stack into equal bets across the streets you plan to bet,
    so a two-street version is a big flop bet followed by a turn shove. On two-Broadway boards the caller's
    range connects well, so the 3-bettor has little reason to bet medium hands and instead bets a polarized
    range of strong value and strong draws for a size that sets up stacks. A three-street version uses
    three equal bets to be all in by the river and shows up as an in-between flop size. This is a harder
    strategy to execute than range betting and deserves dedicated study.
  numbers:
  - 'Two-Broadway textures: ~20-25% large-bet frequency, otherwise check'
  common_mistake: Betting one-third pot on K-Q-x or A-K-x as the 3-bettor because it is a "high board",
    then having no plan when called.
  hook_ideas:
  - 'K-Q-x in a 3-bet pot: mostly check, sometimes bet huge.'
  - The flop size that sets up a turn shove.
  - Why the 3-bettor goes big or goes quiet on Broadway flops.
  source_refs:
  - school: rio
    course: The Game Plan
    lesson: rio-game-plan/036-flop-strategies-out-of-position
    chunk: rio-game-plan/036-flop-strategies-out-of-position#01
    stance: supports
    note: Coach explains 2E / 3E notation and groups two-Broadway boards into the polar large-bet category.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-gp36-low-paired-defined-by-offsuit-trips-004
  format: cash-6max
  topic: board-textures
  concepts:
  - paired-boards
  - board-categories
  - offsuit-combos
  - range-interaction
  - 3bet-pots
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Define a "low paired" board by where offsuit hands stop making trips
  claim: In 3-bet pots, treat paired boards of 9-9-x and lower as one category and T-T-x and higher as
    another. The dividing line is the rank at which the caller's range stops playing the offsuit versions
    of that card at full frequency.
  why: Board categories should follow how the opponent's range interacts with the texture, and offsuit
    combos are what decide whether an interaction is a big part of a range or a sliver. A caller against
    a 3-bet continues almost all offsuit tens and up, so on T-T-x or higher they hold many trips combos
    and the 3-bettor must respect that. On 9-9-x and below the caller mostly needs suited hands to hold
    trips, which is a much smaller slice, so the 3-bettor can bet the whole range. This principle, counting
    where offsuit combos hit, is the general tool for drawing lines between board classes.
  common_mistake: Lumping all paired boards together, or splitting them by gut feel rather than by what
    the calling range actually holds.
  hook_ideas:
  - 9-9-x and T-T-x are different flops. Here's the line.
  - 'One question defines every board category: do offsuit hands hit?'
  - Why trips are rarer than you think on low paired boards.
  source_refs:
  - school: rio
    course: The Game Plan
    lesson: rio-game-plan/036-flop-strategies-out-of-position
    chunk: rio-game-plan/036-flop-strategies-out-of-position#01
    stance: supports
    note: Low paired defined as 99 and under because 9x is where IP stops calling offsuit combos fully.
  - school: rio
    course: The Game Plan
    lesson: rio-game-plan/036-flop-strategies-out-of-position
    chunk: rio-game-plan/036-flop-strategies-out-of-position#02
    stance: supports
