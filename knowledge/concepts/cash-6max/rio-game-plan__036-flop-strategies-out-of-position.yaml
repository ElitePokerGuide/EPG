- id: c-cash-6max-gp36-frequency-vs-selection-mistakes-006
  format: cash-6max
  topic: exploits
  concepts:
  - frequency-mistakes
  - hand-selection
  - overfolding
  - node-locking
  - small-bet
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Only frequency mistakes make a bet size profitable, not hand-selection mistakes
  claim: When judging whether opponents will misplay a bet size, ask whether they will fold or raise the
    wrong amount overall. Defending with the wrong hands at the right frequency barely changes your EV;
    folding noticeably too often does.
  why: A solver response to a small bet contains hands that look impossible to find, such as raising an
    offsuit ten-nine with no pair, while also folding some offsuit broadways. Real players will swap one
    for the other, but that is a hand-selection error and roughly a wash. If instead their total fold
    frequency climbs from about 17% to about 28% against a small bet, your whole betting range gains automatic
    profit and the small size becomes clearly right. Focus on aggregate fold and raise frequencies when
    choosing a size, and use node-locking only if that specific question is the deciding factor.
  numbers:
  - 'Example: fold vs 30% pot moving from ~17% to ~28% turns the small bet into a clear win'
  common_mistake: Picking a bet size because one branch of the solver response looks hard to play, without
    checking whether opponents actually fold or raise too much overall.
  hook_ideas:
  - They defend the wrong hands. That makes you nothing.
  - The only opponent mistake that pays your bet size.
  - Stop chasing solver lines nobody could find anyway.
  source_refs:
  - school: rio
    course: The Game Plan
    lesson: rio-game-plan/036-flop-strategies-out-of-position
    chunk: rio-game-plan/036-flop-strategies-out-of-position#02
    stance: supports
    note: Coach distinguishes frequency mistakes from hand-selection mistakes when evaluating the 30%
      size.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-gp36-low-boards-overbet-or-check-007
  format: cash-6max
  topic: bet-sizing
  concepts:
  - low-boards
  - overbet
  - range-bet
  - simplifier
  - 3bet-pots
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: On low-low-low flops in 3-bet pots the big bet is the essential size
  claim: On three-low-card flops, removing the small bet from the 3-bettor's strategy costs nothing, while
    removing the large bet or the check costs EV. Overbet-or-check and a single-size range bet are both
    near-zero-loss simplifications.
  why: 'The 3-bettor''s range on a low board is mostly overcards with a few overpairs and sets, so the
    strategy wants to polarize: bet big with hands that can set up stacks and check the rest. A simplifier
    shows the small bet is redundant, that a pure overbet-or-check plan loses no EV while checking about
    82% of the time, and that a full-range bet at one medium size loses only around 0.01 big blinds. Both
    are far easier to execute than the solver mix. Adding a wheel draw shifts preference toward a three-quarter
    pot size, which is why a single geometric three-street size is a robust catch-all for the category.'
  numbers:
  - 'Overbet-or-check on a low rainbow board: ~18% bet, ~82% check, 0 EV loss vs full mix'
  - 'Removing checks on the same board: ~0.01bb loss'
  - 'Range bet one medium size: ~0.01-0.02bb loss'
  common_mistake: Firing one-third pot on 7-5-2 as the 3-bettor because low boards "look good for the
    raiser", when that size is the one the solver throws away first.
  hook_ideas:
  - On low flops the small c-bet is the size you can delete.
  - Check 82% of the time and lose nothing. Here's where.
  - Two simple plans for 7-5-2 that match the solver.
  source_refs:
