- id: c-cash-6max-gp36-stress-test-board-categories-013
  format: cash-6max
  topic: board-textures
  concepts:
  - board-categories
  - texture-variation
  - wheel-draws
  - flush-draws
  - category-splitting
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Stress-test a board category by changing one feature at a time
  claim: Before trusting a board category, vary a single property (add a flush draw, a wheel draw, a second
    straight, a high card) and compare the strategies. Split the category only when the EV difference
    between the variants is material, not when the solver's preferred size merely shifts.
  why: Categories exist to make the game playable, so they should be as broad as the strategy allows.
    On low three-card boards, adding a wheel draw moves the preferred size from an overbet toward three-quarter
    pot, but the EV gap between the two is around a hundredth of a big blind and both range-bet and range-check
    remain cheap. That is a change in flavour, not a new category. A category should be broken off only
    when one variant genuinely demands a different plan, otherwise you end up with texture descriptions
    so fine-grained that you cannot recall them under pressure.
  common_mistake: Creating a new board category every time a sim shows a different size, until the plan
    has more textures than anyone can remember.
  hook_ideas:
  - Your board categories are probably too many.
  - One cheap test tells you whether a flop needs its own rule.
  - When does a wheel draw change the plan? Usually never.
  source_refs:
  - school: rio
    course: The Game Plan
    lesson: rio-game-plan/036-flop-strategies-out-of-position
    chunk: rio-game-plan/036-flop-strategies-out-of-position#03
    stance: supports
    note: Coach challenges the low-low-low category with dynamic and wheel variants and keeps it whole.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
