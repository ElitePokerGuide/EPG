- id: c-cash-6max-gp36-few-options-at-early-nodes-009
  format: cash-6max
  topic: study-methods
  concepts:
  - game-tree
  - early-decisions
  - branching
  - simplification
  level: intermediate
  street: multi-street
  pot_type: 3bet-pot
  position: any
  title: Keep the first decision point to one or two options so later streets stay learnable
  claim: Limit preflop and flop decisions to at most two options per spot. Every extra branch at an early
    node multiplies the number of turn and river strategies you have to know.
  why: A game tree fans out from each decision. If you use three flop sizes plus a check, you need four
    different turn plans and many more river plans, and your study time gets spread so thin that none
    of them is played well. One or two early options let you see every branch that follows and go deep
    on them. The later parts of a game plan become dramatically simpler when the early nodes were kept
    narrow. Running sims with only one size allowed, then two, then all, and comparing total EV is the
    manual way to confirm the cheap simplification.
  common_mistake: Using four flop sizes "like the solver" and then improvising every turn because no one
    can study that many branches.
  hook_ideas:
  - Every extra flop size doubles your turn homework.
  - Why the pros use fewer bet sizes than the solver.
  - Narrow the flop, master the river.
  source_refs:
