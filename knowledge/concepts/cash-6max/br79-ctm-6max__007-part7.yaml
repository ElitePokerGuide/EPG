- id: c-cash-6max-br7-isolate-wide-in-position-keep-standards-oop-009
  format: cash-6max
  topic: preflop-ranges
  concepts:
  - isolation
  - limpers
  - out-of-position
  - hand-standards
  - suited-aces
  level: beginner
  street: preflop
  pot_type: limped
  position: oop
  title: Isolate limpers very wide in position, but keep real standards out of position
  claim: Raising limpers is one of the best plays at micro stakes, but tighten up when the limper will
    have position on you. In position almost any suited ace or two broadway cards is a raise; from the
    blinds a hand like ace-three offsuit is the bottom of the range or a fold, and king-eight is a check.
    Pots are simply harder to win when you act first on every street.
  why: 'Isolating a limper works because you win the pot preflop or with one c-bet most of the time, and
    position makes both easier: you see whether they continue before you commit more. Out of position
    you have to bet blind into their range on every street and cannot take free cards, so marginal hands
    turn into expensive guesses. Having higher standards out of position keeps your isolation plays profitable
    instead of just frequent.'
  common_mistake: Raising every limper with any ace from the small blind, then facing three streets of
    decisions out of position with a hand that only makes weak pairs.
  source_refs:
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/007-part7
    chunk: br79-ctm-6max/007-part7#03
    stance: supports
    note: Would isolate with the hand in position but not OOP; 'want to have some standards out of position'.
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/007-part7
    chunk: br79-ctm-6max/007-part7#05
    stance: supports
    note: Ace-three offsuit is bottom end OOP vs a limper; easy raise in position.
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/007-part7
    chunk: br79-ctm-6max/007-part7#04
    stance: supports
    note: Checks ace-three off through from the blind vs limper; suited ace is fine to isolate.
  consensus_score: 0.5
  hook_ideas:
  - Isolate every limper? Not from the blinds.
  - 'Ace-three offsuit: raise in position, check out of position.'
  - Position decides how wide you can punish limpers.
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-br7-regs-are-tame-steal-wide-but-respect-the-3bettor-010
  format: cash-6max
  topic: preflop-ranges
  concepts:
  - stealing
  - button-range
  - cutoff
  - 3-bet-awareness
  - population-reads
  level: beginner
  street: preflop
  position: btn
  title: Micro regs rarely 3-bet, so steal wide from the cutoff and button; back off when one does
  claim: 'Most regulars at NL10 are tame: they 3-bet far below 8% and seldom play back. Against tight
    blinds open very wide from the cutoff and especially the button, including any two suited cards. When
    you spot one of the rare players with real 3-bet numbers on your left, drop the marginal steals like
    jack-eight offsuit against them.'
  why: 'Stealing profits from blinds that fold, and the typical micro regular folds the blinds far more
    often than theory would allow. Super-tight players, at 8% VPIP for example, fold so much that nearly
    any two cards show a profit from the button. The exception is the uncommon competent regular with
    20/18-type stats and a healthy 3-bet percentage: against them a marginal steal faces a 3-bet often
    enough that the hand becomes a fold. Adjust by seat, not by a fixed range.'
  common_mistake: Opening a tight textbook button range against blinds that fold everything, or stubbornly
    opening jack-eight into the one player who 3-bets properly.
  numbers:
  - few micro regs 3-bet as much as ~8%
  - lay off marginal steals vs a 21/18 player with an ~8% 3-bet on your left
  - an 8% VPIP player at 6-max should be stolen from with almost any two
  source_refs:
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/007-part7
    chunk: br79-ctm-6max/007-part7#04
    stance: supports
    note: '''Real wide on cutoff and button, any two suited''; regs don''t play back, few 3-bet 8%.'
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/007-part7
    chunk: br79-ctm-6max/007-part7#05
