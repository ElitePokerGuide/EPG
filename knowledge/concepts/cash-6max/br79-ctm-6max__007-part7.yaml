- id: c-cash-6max-br7-bluff-raise-donk-bets-but-always-with-outs-011
  format: cash-6max
  topic: bluffing
  concepts:
  - donk-bets
  - bluff-raise
  - paired-boards
  - outs
  - semi-bluff
  level: beginner
  street: flop
  pot_type: srp
  position: ip
  title: Bluff-raise weak donk bets on dry paired boards, but never bluff with zero outs
  claim: 'When a wide-range player leads into you on a dry paired flop such as eight-four-four, raise
    rather than call or fold: it is very hard for them to have anything, and players who donk often fold
    to a raise even if they ignore 3-bets preflop. Do it with at least a gutshot, though. A bluff with
    no way to improve has only one way to win, and that is not enough.'
  why: 'Donk bets from loose players are usually weak pairs, draws or probes, and a dry paired board gives
    them almost no strong holdings. A raise makes them fold most of that range immediately. Insisting
    on some outs is cheap insurance: when the bluff gets called you still have a chance to win, which
    turns a pure gamble into a semi-bluff. Players who 3-bet-proof their preflop game often still fold
    to flop raises because the stakes feel bigger, so this is a reliable spot against them.'
  common_mistake: Calling a small donk bet with nothing to "see what happens", or bluff-raising with a
    hand that cannot improve on any turn card.
  numbers:
  - a donk-bet stat of ~33% over 6 opportunities already flags a frequent leader
  source_refs:
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/007-part7
    chunk: br79-ctm-6max/007-part7#06
    stance: supports
    note: Raises a donk bet on 8-4-4 with a gutshot; 'never really a reason to bluff with no outs'.
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/007-part7
    chunk: br79-ctm-6max/007-part7#02
    stance: supports
    note: Raises a 'ridiculous lead' from a 55/32 player who does not fold to 3-bets but folds here.
  consensus_score: 0.5
  hook_ideas:
  - He leads into you on a paired board. Raise.
  - The one rule we never break when bluffing.
  - Why a gutshot is the minimum for any bluff.
  status: draft
