- id: c-cash-6max-br7-tight-early-unless-a-fish-is-in-the-blinds-013
  format: cash-6max
  topic: preflop-ranges
  concepts:
  - early-position
  - opening-range
  - weak-player-in-blinds
  - table-count
  level: beginner
  street: preflop
  position: utg
  title: Open tight from early position, and loosen only when a weak player sits in the blinds
  claim: Hands like six-seven suited or ten-three suited are folds from under the gun in a normal 6-max
    game. They become opens when a loose passive player is in the blinds and likely to call, because the
    hand is now a vehicle for playing a pot against them in position. Playing fewer tables also justifies
    a few more opens, since you can give each spot more attention.
  why: Early-position opens face the most players behind, so the base range must be tight. The value of
    a speculative hand comes almost entirely from who calls it; against regulars who 3-bet or fold, ten-three
    suited has nothing going for it, but against a weak player who will call and pay off two pair, the
    same hand is a profitable open. Fewer tables means more focus and more ability to extract from those
    spots, which shifts the marginal hands from fold to raise.
  common_mistake: Opening speculative hands from under the gun regardless of who is in the blinds, or
    folding them when the loosest player at the table is about to call.
  source_refs:
