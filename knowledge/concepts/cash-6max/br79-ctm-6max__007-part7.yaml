- id: c-cash-6max-br7-3bet-big-for-value-vs-players-who-give-no-credit-012
  format: cash-6max
  topic: preflop-ranges
  concepts:
  - value-3bet
  - 3-bet-sizing
  - light-3bets
  - fickle-opponents
  level: beginner
  street: preflop
  pot_type: 3bet-pot
  position: any
  title: Against players who never give you credit, 3-bet big for value and skip light 3-bets
  claim: Many micro players call 3-bets with any two after you have shown aggression once, because they
    do not believe you. Against them, a light 3-bet is a bad bluff, so fold the marginal hands instead.
    When you do have a big hand, 3-bet, and 3-bet larger than normal; they will call anyway.
  why: 'A 3-bet bluff needs folds; a 3-bet for value needs calls. The fickle, stubborn opponent gives
    you the second and not the first, so your 3-betting range against them should be nearly all value,
    sized to extract. Bluffing them preflop just builds a pot out of position with a weak hand against
    someone who will not fold on later streets either. The adjustment is simple and highly profitable:
    polarize towards value, size up, and let their disbelief pay you.'
  common_mistake: 3-betting queen-jack as a bluff against a player who has just called two 3-bets with
    junk, then giving up on the flop.
  source_refs:
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/007-part7
    chunk: br79-ctm-6max/007-part7#01
