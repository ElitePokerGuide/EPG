- id: c-cash-6max-br7-delayed-cbet-vs-players-who-play-back-014
  format: cash-6max
  topic: turn-play
  concepts:
  - delayed-cbet
  - fickle-opponents
  - recent-history
  - check-back
  level: beginner
  street: flop
  pot_type: srp
  position: ip
  title: After winning a pot off an active player, consider a delayed c-bet instead of firing again
  claim: When an aggressive or stubborn micro player has just lost a pot to you, expect them to play back
    at your next c-bet regardless of their hand. Against that player checking the flop in position and
    betting the turn, or letting them bluff into you, often beats the automatic c-bet.
  why: Players at these limits are fickle; losing a pot makes them want to punish you on the next one,
    often with a raise or a float they would not normally make. A flop c-bet into that mood invites a
    raise you cannot continue against. Checking back removes the trigger, lets them take the lead with
    air, and gives you a cheaper look at the turn where your bet is more credible. It is a timing adjustment,
    not a change of strategy.
  common_mistake: C-betting into a player who just lost a pot to you and then folding to the inevitable
    raise, repeating the pattern every orbit.
  source_refs:
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/007-part7
    chunk: br79-ctm-6max/007-part7#03
    stance: supports
    note: Gets raised on a c-bet by an active player right after winning a pot; says a delayed c-bet would
      have been a good alternative.
  consensus_score: 0.5
  hook_ideas:
  - Just won a pot off him? Skip the next c-bet.
  - The delayed c-bet is built for stubborn opponents.
  - Fickle players tell you when they will play back.
  status: draft
  created: '2026-10-04'
