    note: Lays off a light 3-bet because the player will call any two; 'if I had a big hand I would 3-bet,
      maybe big'.
  consensus_score: 0.5
  hook_ideas:
  - He will not fold to your 3-bet. Good. Make it bigger.
  - Light 3-bets are wasted on this player type.
  - When disbelief becomes your profit source.
