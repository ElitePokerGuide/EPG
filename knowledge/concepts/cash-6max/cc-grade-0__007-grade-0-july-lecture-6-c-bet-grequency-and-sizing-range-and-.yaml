- id: c-cash-6max-cc06-range-disadvantage-still-bet-strong-hands-008
  format: cash-6max
  topic: turn-play
  concepts: [range-disadvantage, polarization, thin-value, bluff-selection]
  level: intermediate
  street: turn
  pot_type: srp
  position: ip
  title: A range disadvantage makes you selective, not passive
  claim: When your range is behind on the turn you still bet your strong hands. The disadvantage shows up as a more polarized betting range - fewer thin value bets and bluffs chosen for blockers or equity - not as checking everything.
  why: If nine out of ten cookies are ruined, the tenth is not inedible; it is the only one worth eating. A set when your range is weak is exactly that cookie. The opponent's range is strong, they will invest, and your hand is happy to build a pot. What changes is the margin. Second pair that would be a fine value bet against a weak range becomes a never-bet, because the caller's range is now dense with hands that beat it. Random no-equity bluffs become too expensive, so bluffs need a flush blocker, a draw, or a card that removes the opponent's continues. Range disadvantage trims the edges of your betting range; it does not remove the middle of it.
  common_mistake: Learning about range disadvantage and then checking a set or betting second pair for thin value in the same spot, in both cases ignoring the specific hand.
  example_hand:
    positions: CO vs BB
    hero: 4h4d
    board: "Jc Th 4s Td"
    action: "CO c-bets 75% on the flop, BB calls. Turn T: BB checks."
    decision: CO's range is behind now that the ten paired. Bet or check with the set?
    answer: Bet. The set wants a big pot and villain's range is strong enough to pay. J9 in the same spot never bets - too thin against a range full of Tx and Jx.
  hook_ideas:
    - "Range behind? Bet your set anyway. Here's what changes."
    - "Range disadvantage means fewer bets, not zero bets."
    - "The one hand you must never barrel on this turn"
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/007-grade-0-july-lecture-6-c-bet-grequency-and-sizing-range-and-
      chunk: cc-grade-0/007-grade-0-july-lecture-6-c-bet-grequency-and-sizing-range-and-#05
      stance: supports
      note: Set of fours on JT4-T; J9 "never betting" there. Example generalized.
  consensus_score: 0.5
  status: draft
