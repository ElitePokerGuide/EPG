- id: c-cash-6max-cc06-range-advantage-does-not-make-every-hand-bet-006
  format: cash-6max
  topic: turn-play
  concepts: [range-advantage, showdown-value, delayed-cbet, hand-purpose]
  level: beginner
  street: turn
  pot_type: srp
  position: ip
  title: Range advantage raises your betting frequency, it does not license betting every hand
  claim: A big range advantage means more of your hands want to bet. It never overrides what your specific hand wants. A medium-strength hand with showdown value still checks even when your range is far ahead.
  why: The reasons for betting have not changed - value, bluffing, and a little equity denial. Range advantage makes those reasons apply to more hands, but a hand that is too weak to be called by worse and too strong to turn into a bluff gains nothing from betting. Betting it might even be profitable in isolation, yet checking is worth more, and the goal is the best line, not a line that happens to be above zero. Your opponent still defends sensibly, continuing with the better part of their range and folding the worst, so a bet with a middling hand buys nothing it did not already have.
  common_mistake: Checking back a middle pair on the flop, then firing a large turn bet with it after a blank because "I have the range advantage here".
  example_hand:
    positions: CO vs BB
    hero: 8c8d
    board: "Th6s2c Qd"
    action: "CO opens, BB calls. Flop checks through. Turn Q: BB checks, CO bets 75% pot."
    decision: Is a 75% turn bet with 88 correct given CO's range advantage on this runout?
    answer: No. 88 has showdown value and beats most of what folds while losing to most of what calls. Check and often win at showdown. Range advantage guides range strategy, not this hand's choice.
  hook_ideas:
    - "Your range is ahead. Your hand still should not bet."
    - "The turn bet that is +EV and still a blunder"
    - "Range advantage is not a free pass to bet anything"
  source_refs:
