- id: c-cash-6max-cc06-nut-advantage-is-not-range-advantage-004
  format: cash-6max
  topic: fundamentals
  concepts: [nut-advantage, range-advantage, fallacy, sets]
  level: intermediate
  street: flop
  position: any
  title: Having more sets or more nutted combos does not give you range advantage
  claim: Nut advantage is a component of range advantage, not a substitute for it. A range can hold more of the very best hands and still have less total equity than the opponent's range.
  why: Think of two sets of numbers. One contains a 12, a 10 and an 8 and sums to 10 because the rest are tiny; the other has nothing above 8 but sums to 15. The second set is "stronger" even though the first has all the best individual pieces. Ranges behave identically. Humans remember the dramatic hands - the set that stacked someone, the flush that got there - so we overweight them when we size up a spot. The best hands matter, but they are only a few combos inside a range of two hundred. Assess the whole distribution first, then look separately at the top end when you decide how big to bet.
  common_mistake: Saying "we have more sets here, so we have range advantage" and betting as if the whole range were ahead.
  hook_ideas:
    - "More sets than villain? Still doesn't mean you're ahead."
    - "The nut advantage trap that fools most regs"
    - "Your brain is magnetized to the nuts. Fix that."
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/007-grade-0-july-lecture-6-c-bet-grequency-and-sizing-range-and-
      chunk: cc-grade-0/007-grade-0-july-lecture-6-c-bet-grequency-and-sizing-range-and-#02
      stance: supports
      note: First of three fallacies about detecting range advantage; numbers exercise.
  consensus_score: 0.5
