- id: c-cash-6max-gp34-study-both-sides-of-node-001
  format: cash-6max
  topic: study-methods
  concepts: [game-tree, counter-strategy, study-process, 3bet-pots]
  level: intermediate
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Study the counter-strategy at the same time as your own line
  claim: Whenever you build a strategy for one decision point, study the opponent's best response to it in the same session. Understanding how they should react explains why your line works and exposes problems before they show up at the table.
  why: A flop c-bet strategy is only half of the node. The other half is what happens when you check and the opponent bets, and what the opponent should do against your bet. Looking at both sides together links the mechanics of your strategy to the reasons it is built that way, and it keeps the next street in view while you are still deciding the current one. Out of position this matters more than in position, because your checking range has to react to a bet immediately rather than at leisure on the turn.
  common_mistake: Memorizing c-bet frequencies for one side of the tree while having no plan for the check-call range that strategy creates.
  hook_ideas:
    - Studying your c-bets without studying the response is half a lesson.
    - Why solver c-bet charts fail you the moment someone bets back.
    - The study habit that stops surprises on the turn.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/034-checking-as-the-preflop-raiser
      chunk: rio-game-plan/034-checking-as-the-preflop-raiser#01
      stance: supports
      note: Coach opens by explaining he studies both sides of each node together.
  consensus_score: 0.5
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp34-range-bet-removes-float-branch-002
  format: cash-6max
  topic: cbet-strategy
  concepts: [range-bet, range-check, simplification, float-bet, 3bet-pots]
  level: intermediate
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Range-betting a texture deletes the whole facing-a-float branch for you
  claim: As the out-of-position 3-bettor, every flop texture you decide to range-bet is a texture where you will never face an in-position stab after checking. Only study the check-then-face-a-bet node on textures where your plan actually includes checks.
  why: A simplified flop plan sorts boards into range-bet, range-check and a few mixed textures. If you never check a board class, the in-position player never gets to bet into your check there, so planning your response on that class is wasted effort. The reverse is also true. Range-check textures (high-low-low and monotone) and the mixed middle textures are exactly where you will face the most bets after checking, so those are the high-priority spots for building a check-call and check-raise plan. Simplifying the first decision point is what makes the later streets manageable.
  common_mistake: Spending study time on how to defend a check on boards where your own game plan says you always bet.
  hook_ideas:
    - Half the flop spots you study will never happen to you.
    - Range-bet here and one awkward spot disappears forever.
    - Where does checking as the 3-bettor actually get tested?
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/034-checking-as-the-preflop-raiser
      chunk: rio-game-plan/034-checking-as-the-preflop-raiser#01
      stance: supports
      note: Priority ratings for OOP vs flop float derived from where the plan checks.
  consensus_score: 0.5
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp34-study-priority-order-003
  format: cash-6max
  topic: study-methods
  concepts: [prioritization, game-plan, frequency-of-spots]
  level: intermediate
  street: multi-street
  pot_type: 3bet-pot
  position: any
  title: Work down the most frequent lines first and defer rare nodes
  claim: Rank every decision point by how often your own strategy reaches it, study the high-frequency ones to completion, and only then return to nuances and rare branches. Nodes your plan never reaches get zero time until everything important is done.
  why: Study time is finite and the game tree is not. If your flop plan removes checks on a board class, every node below that check is dead for you and learning it is pure cost. The same logic applies to rare sizings and unusual runouts. A deliberately simple first decision point trims huge parts of the tree, which lets you go deep on the spots that come up every session instead of skimming everything equally.
  common_mistake: Studying every node of a solver output with equal care, including lines the player's own strategy never takes.
  hook_ideas:
    - Stop studying spots your own strategy never reaches.
    - The order you study poker spots in matters more than you think.
    - A simple flop plan is also a shorter study list.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/034-checking-as-the-preflop-raiser
      chunk: rio-game-plan/034-checking-as-the-preflop-raiser#01
      stance: supports
      note: Low-priority nodes deferred until all high-priority work is finished.
  consensus_score: 0.5
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp34-benchmarks-vs-float-004
  format: cash-6max
  topic: defending
  concepts: [float-bet, check-raise-frequency, fold-frequency, database-stats, 3bet-pots]
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Aggregate benchmarks for the 3-bettor who checks and faces a flop bet
  claim: Across all flop textures, the out-of-position 3-bettor who checks and faces an in-position bet check-raises roughly 11% of the time and folds roughly 35%. Use these as rough anchors for your database, not as targets to hit exactly.
  why: Aggregate solver reports blend every texture and assume equilibrium bet sizes from the opponent. If your own plan converts some mixed-check textures into pure checks, your check-raise frequency should sit above the aggregate, because value hands that would have bet now check-raise instead. If your fold number is lower than the benchmark, the cause may be that opponents bet small more often than equilibrium suggests, and small bets should be folded to less. A deviation from the benchmark is a prompt to investigate, not proof of a leak.
  numbers:
    - "Aggregate check-raise vs flop float as OOP 3-bettor: ~11%"
    - "Aggregate fold vs flop float as OOP 3-bettor: ~35%"
  common_mistake: Seeing a stat in red against the solver benchmark and immediately forcing the number back toward it without asking why it differs.
  hook_ideas:
    - Your stat is above the solver's. That might be correct.
    - One fold number that tells you how sticky you really are.
    - Check-raising more than theory can be by design.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/034-checking-as-the-preflop-raiser
      chunk: rio-game-plan/034-checking-as-the-preflop-raiser#01
      stance: supports
      note: Coach's own stats were more aggressive and stickier than the aggregate; he treats the first as intended.
  consensus_score: 0.5
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp34-diagnose-before-fixing-005
  format: cash-6max
  topic: study-methods
  concepts: [database-review, tracker-filters, leak-finding, hand-tagging]
  level: intermediate
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Find the cause of a stat deviation before you try to fix it
  claim: When a tracker stat disagrees with a solver benchmark, filter your database to that exact line, scan the hands by action, tag the ones that look off, then compare them to the closest sims you already own. Only run a custom sim when no existing one fits.
  why: "A stat can be off for three different reasons: your strategy is deliberately different, your opponents are using sizes the aggregate did not assume, or you are misranking hands. Each has a different fix, and guessing wastes study time. Filtering to the line (3-bet preflop, check the flop, face a bet, any reaction) and sorting by what you did lets you check each bucket quickly. A rare spot with a small sample is where hand-by-hand review beats trainer drills, because you cannot trust the frequency and you need to see the individual decisions."
  common_mistake: Reading one frequency, deciding it is a leak, and drilling the spot without ever looking at the hands that produced the number.
  hook_ideas:
    - Your tracker says you're too loose. Prove it first.
    - Five tagged hands beat five hundred trainer reps for rare spots.
    - A study workflow for leaks with tiny samples.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/034-checking-as-the-preflop-raiser
      chunk: rio-game-plan/034-checking-as-the-preflop-raiser#01
      stance: supports
      note: Sample of ~6000 hands, 35 instances of the line; coach reviews rather than guesses.
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/034-checking-as-the-preflop-raiser
      chunk: rio-game-plan/034-checking-as-the-preflop-raiser#03
      stance: supports
      note: Workflow walked through end to end; custom sim only for half-pot on an unsolved texture.
  consensus_score: 0.5
