- id: c-cash-6max-gp34-sizing-changes-float-defense-008
  format: cash-6max
  topic: defending
  concepts: [bet-size-response, backdoor-flush-draw, ace-high, float-bet, 3bet-pots]
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Your continue threshold vs a float moves a lot between 30% and 60% pot
  claim: On a high-low-low two-tone board where the 3-bettor checks, ace-jack high continues against a 30% pot stab almost regardless of suits, but against a 60-65% pot stab it continues only with the backdoor flush draw and folds without it. Half pot sits in between and is roughly a fold without the suit.
  why: A small bet offers a cheap price, so marginal overcards with no draw still have enough equity and playability to peel. A bet of two-thirds pot roughly doubles what you risk and demands more raw equity, and the backdoor suit is what pushes an ace-high hand over the line. If you run a high-checking plan as the 3-bettor, you will face more stabs than most players, so you need the thresholds for the sizes your opponents actually use, not only the size you prepared for your own bets.
  numbers:
    - "AJ no backdoor suit on T54 two-tone: pure continue vs ~30% pot, pure fold vs ~60-65% pot"
    - "AJ with backdoor suit: pure continue vs both sizes"
  common_mistake: Learning the defence against one small stab size and applying the same calling range when the opponent bets half pot or more.
  hook_ideas:
    - Ace-jack high, flop stab. Half pot changes the answer.
    - The size you studied is not the size they use.
    - One suit decides whether this ace-high calls or folds.
  example_hand:
    positions: BB vs BTN
    hero: AhJc
    board: Td5s4s
    action: "BTN opens, BB 3-bets, BTN calls. Flop: BB checks, BTN bets."
    decision: Call or fold vs 30% pot; vs 65% pot?
    answer: Vs 30% pot call; vs 65% pot fold without a spade, call with the spade backdoor.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/034-checking-as-the-preflop-raiser
      chunk: rio-game-plan/034-checking-as-the-preflop-raiser#03
      stance: supports
      note: Coach checks both bet sizes in his sims to judge a half-pot fold.
  consensus_score: 0.5
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp34-one-straight-rainbow-fold-weak-aces-009
  format: cash-6max
  topic: defending
  concepts: [rainbow-boards, half-pot, weak-aces, float-bet, 3bet-pots]
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: On a rainbow one-straight low board, weak aces and small pairs fold to half pot
  claim: When the 3-bettor checks a rainbow low board with a single straight and faces a half-pot bet, ace-five suited with no backdoor flush draw is a clear fold, and even a small pocket pair below the board folds. Continue with straight draws and clean broadway overcards.
  why: "Without a flush draw possible, the only improving cards for a weak ace are the three remaining aces, and the board's straight already dominates its low-card outs. Against half pot that is not enough, and the sim shows calling loses around one big blind. A small pair below the board faces the same problem: it has no overcard and few outs. The hands worth defending are the ones that can make the straight or make top pair with a strong kicker."
  numbers:
    - "A5s no backdoor flush vs half pot on rainbow one-straight low board: fold, calling loses ~1bb"
  common_mistake: Peeling any ace-high or any pocket pair against a stab because the bet "isn't that big".
  hook_ideas:
    - Pocket fives on a low board. Facing half pot. Fold.
    - This ace-high call costs a full big blind every time.
    - Rainbow boards punish weak floats harder than you think.
  example_hand:
    positions: BB vs BTN
    hero: Ad5d
    board: 9c7h3s
    action: "BTN opens, BB 3-bets, BTN calls. Flop: BB checks, BTN bets 50% pot."
    decision: Call or fold?
    answer: Fold. No flush draw possible, the straight cards are not yours, and the call loses about a big blind.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/034-checking-as-the-preflop-raiser
      chunk: rio-game-plan/034-checking-as-the-preflop-raiser#03
      stance: supports
      note: Custom sim run with IP given the half-pot size only; A5s and 55 fold.
  consensus_score: 0.5
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp34-one-size-is-their-size-010
  format: cash-6max
  topic: exploits
  concepts: [opponent-sizing, node-locking, custom-sims, reads]
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Treat a regular's single flop size on a texture as their whole strategy there
  claim: When a thinking opponent uses one bet size on a flop texture, assume that is their simplified size for that spot and run your sim with only that size available to them. One observation is enough for an opponent known to simplify early streets.
  why: Strong players build their flop plans around one or two sizes per texture, so a single sighting usually reveals the whole strategy for that board class. Solving with the opponent restricted to that size gives you hand rankings for the spot you will actually face, rather than for a mix of sizes the opponent never uses. Solving to around 2% accuracy is plenty for hand-ranking questions, because the frequencies and relative hand values converge long before suit-level details do.
  common_mistake: Studying against the solver's default mix of bet sizes when the opponent in front of you has shown they only use one.
  hook_ideas:
    - One bet from a reg tells you their whole flop plan.
    - Stop solving against sizes your opponent never uses.
    - You don't need a perfect sim to rank hands.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/034-checking-as-the-preflop-raiser
      chunk: rio-game-plan/034-checking-as-the-preflop-raiser#03
      stance: supports
      note: Coach gives IP credit for half pot exclusively after seeing it once from a simplifying player.
  consensus_score: 0.5
