- id: c-cash-6max-gp34-check-raise-bluffs-need-suit-006
  format: cash-6max
  topic: check-raising
  concepts: [bluff-selection, backdoor-flush-draw, blockers, float-bet, 3bet-pots]
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Check-raise bluff with the live backdoor suit, flat or fold without it
  claim: When the 3-bettor checks and faces a flop bet, bluff check-raises should come from hands holding a backdoor flush draw plus some straight or overcard interaction. The same hand without the suit should call if it has showdown or draw equity, and fold if it does not.
  why: "The intuitive logic of \"too weak to call, so raise\" is backwards. Raising builds a pot you want to continue in, so the raising hand should be the one that improves most often and blocks the opponent's strongest continuing combos on common runouts. A backdoor flush draw does both: it adds turn cards that let you barrel and it removes suited combos from the opponent's range. Solvers consistently raise the suited version and flat or fold the unsuited version of the same hand class. Weak backdoor gutshots without the suit are mostly folds, not raises."
  common_mistake: Check-raising ace-high or king-high hands with no backdoor suit because they feel too weak to call, while flatting the same hands when they do have the suit.
  hook_ideas:
    - Too weak to call, so you raise? That's backwards.
    - The one card that turns a fold into a check-raise.
    - Why your check-raise bluffs keep running into it.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/034-checking-as-the-preflop-raiser
      chunk: rio-game-plan/034-checking-as-the-preflop-raiser#02
      stance: supports
      note: Coach reviews own check-raises made without a backdoor suit and calls the old logic backwards.
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/034-checking-as-the-preflop-raiser
      chunk: rio-game-plan/034-checking-as-the-preflop-raiser#03
      stance: supports
      note: Sims confirm raising wants quality draws with the blocker suit; offsuit overcards call.
  consensus_score: 0.5
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp34-rank-floats-by-live-outs-007
  format: cash-6max
  topic: defending
  concepts: [hand-ranking, backdoor-draws, overcards, float-bet, 3bet-pots]
  level: advanced
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: Facing a small stab after checking, rank weak hands by how live their outs are
  claim: Among hands with no pair, continue with the ones whose draws can actually arrive and whose overcards are clean. A backdoor straight draw that uses cards already on the board, or that cannot turn an open-ender, is close to dead and should fold even to a small bet.
  why: Low-equity floats survive on the turn cards that improve them. One clean overcard plus some straight interaction is a better hand than a junky backdoor gutshot because it has more ways to make a pair that is good and more turns to barrel. On a king-queen-high board, interaction with the low card can matter more than interaction with the top cards, but a two-gapper that cannot pick up an open-ended draw still folds. On a paired board or a board with no overcard for you, having an overcard plus a combo backdoor is what keeps a seven-high suited connector in the hand.
  common_mistake: Calling any suited connector with three-to-a-straight because it looks connected, without checking whether the straight cards are already dominated by the board.
  hook_ideas:
    - Three to a straight can be a dead hand. Here's when.
    - Not all backdoor draws deserve a call.
    - The float you make every day that loses a blind.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/034-checking-as-the-preflop-raiser
      chunk: rio-game-plan/034-checking-as-the-preflop-raiser#02
      stance: supports
      note: Coach flags a wrap-style backdoor on a board where the straight cards are dominated as a flop fold.
    - school: rio
