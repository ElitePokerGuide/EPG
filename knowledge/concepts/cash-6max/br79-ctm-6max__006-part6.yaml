- id: c-cash-6max-br6-check-river-to-let-ace-high-bluff-014
  format: cash-6max
  topic: river-play
  concepts:
  - inducing-bluffs
  - river-check
  - medium-strength
  - calling-down
  level: beginner
  street: river
  pot_type: srp
  position: oop
  title: On the river, if worse hands will not call but ace-high might bluff, check and call
  claim: Holding a medium-strength hand on the river out of position, ask what calls a bet. If the answer
    is almost nothing you beat, but the opponent is the type to bet ace-high or a missed draw when checked
    to, check with the intention of calling. You win the same pot plus their bluff.
  why: 'A river bet with a medium hand only profits when worse hands call. Against many micro players,
    worse hands fold and better hands call, so betting is zero or negative value. Checking turns their
    aggression into your profit: they bluff with the hands that would have folded, and you call. If they
    check back, you lose nothing compared to the bet that would not have been called anyway. The key is
    a read that this player does fire at checked rivers.'
  common_mistake: Betting the river with second pair "for value", getting called only by better, and never
    giving the opponent the chance to bluff.
  source_refs:
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/006-part6
