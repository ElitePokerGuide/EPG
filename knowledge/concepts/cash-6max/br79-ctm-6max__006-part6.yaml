- id: c-cash-6max-br6-big-hand-big-pot-vs-fish-015
  format: cash-6max
  topic: value-betting
  concepts:
  - big-hand-big-pot
  - pot-sizing
  - weak-players
  - top-pair-good-kicker
  level: beginner
  street: multi-street
  pot_type: srp
  position: any
  title: 'Against weak players: big hand, big pot; medium hand, small pot'
  claim: Versus a loose passive opponent the plan is simple. With top pair and a strong kicker, two pair
    or better, bet big on every street and aim to get stacks in. With medium hands, keep the pot small,
    check back the awkward turns and take the cheap showdown. Do not get fancy in either direction.
  why: Weak players pay off big hands because they call with a wide range of worse pairs and draws, so
    slow-playing or small-betting a strong hand against them leaves money on the table. The flip side
    is that they are unpredictable with medium hands and will sometimes show up with the one holding that
    beats you, so bloating a pot with a marginal hand buys variance without extra value. Match pot size
    to hand strength and let their calling habit do the rest.
  common_mistake: Betting small with a monster to keep the fish in, or betting big with a medium hand
    to "find out where you are".
  source_refs:
