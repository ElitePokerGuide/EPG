- id: c-cash-6max-br6-weekends-are-softer-012
  format: cash-6max
  topic: table-selection
  concepts:
  - game-timing
  - weekend-games
  - player-pool
  level: beginner
  position: any
  title: Weekend games are considerably softer than weekday afternoons, even at micro stakes
  claim: If your schedule allows, play on weekends and evenings rather than weekday afternoons. The games
    have always been softer then and still are, at every stake including NL2-NL10.
  why: Weekday afternoons are when the regulars grind and the recreational players are at work. Weekends
    bring in players who treat poker as entertainment, often with a drink in hand, who play more hands
    and call more bets. Your strategy does not change, but the number of profitable spots per hour does,
    and that is what drives win rate.
  common_mistake: Grinding Tuesday afternoons out of habit and concluding the games are tough.
  source_refs:
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/006-part6
    chunk: br79-ctm-6max/006-part6#05
    stance: supports
    note: '''The games really are considerably better on the weekend. Always have been and always will
      be.'''
  consensus_score: 0.5
  hook_ideas:
  - When you play matters almost as much as how.
  - The softest games of the week are not when you think.
  - 'A free win rate boost: change your session time.'
  status: needs-review
  created: '2026-10-04'
