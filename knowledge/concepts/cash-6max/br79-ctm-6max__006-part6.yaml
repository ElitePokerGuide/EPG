- id: c-cash-6max-br6-do-not-copy-loose-video-stats-013
  format: cash-6max
  topic: preflop-ranges
  concepts:
  - vpip-pfr-targets
  - 3-bet-frequency
  - short-handed-inflation
  - study-methods
  level: beginner
  street: preflop
  position: any
  title: Stats from short-handed play run loose; a normal 6-max game should be tighter than 30/28
  claim: Numbers like 30/28 or 27/24 come from sessions with a lot of heads-up and three-handed play,
    which inflates VPIP, PFR, steal and 3-bet percentages. In a normal six-handed game play tighter, and
    keep your 3-bet around 4% rather than 5% or more.
  why: 'Short-handed hands force you into the blinds and the button far more often, so the same strategy
    produces much looser aggregate stats. Copying those numbers at a full 6-max table would mean opening
    and 3-betting hands that lose money against five opponents. Compare your stats with the game type
    you actually played, and when in doubt err towards tight: the micro-stakes edge comes from value and
    discipline, not from frequency.'
  common_mistake: Seeing a coach or winning player at 30/28 and forcing those numbers at a six-handed
    table full of regulars.
  numbers:
  - normal 6-max 3-bet frequency ~4%; 5% shown was inflated by short-handed play
  - 30/28 and 27/24 session stats were skewed by heads-up and 3-handed hands
  source_refs:
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/006-part6
    chunk: br79-ctm-6max/006-part6#05
    stance: supports
    note: '''I think you should be tighter than that overall''; normal 3-bet 4%; stats inflated by short-handed
      play.'
  - school: br79
    course: Crushing the Micros 6-max
    lesson: br79-ctm-6max/006-part6
    chunk: br79-ctm-6max/006-part6#01
    stance: supports
    note: 27/24 'is not how I typically play 6-max'.
  consensus_score: 0.5
  hook_ideas:
  - Do not copy a coach's video stats. Here is why.
