    stance: supports
    note: '''Not a spot where I''m going to bet; he''ll bluff at it; I''d rather give him the rope'';
      opponent had ace-high.'
  consensus_score: 0.5
  hook_ideas:
  - Checking this river wins more than betting it.
  - 'Give him the rope: a river line most NL5 players never use.'
  - Nothing worse calls. So why are you betting?
