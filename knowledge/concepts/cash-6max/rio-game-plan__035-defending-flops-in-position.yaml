- id: c-cash-6max-gp35-check-looking-hand-still-bets-010
  format: cash-6max
  topic: cbet-strategy
  concepts: [baseline-frequency, mixed-strategy, facing-check]
  level: intermediate
  street: flop
  pot_type: 3bet-pot
  position: ip
  title: On a high-frequency betting board, a hand that looks like a check still bets often
  claim: When the baseline betting frequency on a texture is high, a hand that seems weaker than average does not become a pure check. It becomes a lower-frequency bet, for example 40% instead of 60%.
  why: Your betting frequency on a board is a property of the whole range, not of each hand. If the range bets most of the time, then even the below-average hands need to bet some of the time or the frequency collapses and your checks become too weak. Players who judge hand by hand tend to bet only the obvious candidates and end up far below the frequency the board calls for. Anchor on the baseline first, then move individual hands up or down from there.
  common_mistake: Checking every hand that is not an obvious bet, which drops a 60% board to a 30% board without noticing.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/035-defending-flops-in-position
      chunk: rio-game-plan/035-defending-flops-in-position#03
      stance: supports
      note: Coach reminds himself and students that a hand "more of a check than average" might be a 40% bet rather than 60%, not 0%.
  consensus_score: 0.5
  hook_ideas:
    - "'This hand is a check' is usually wrong. It's a 40% bet."
    - "You bet hands. Solvers bet ranges."
    - "Why your c-bet frequency is quietly too low."
