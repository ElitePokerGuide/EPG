- id: c-cash-6max-gp35-fold-marginal-vs-rare-check-raise-016
  format: cash-6max
  topic: exploits
  concepts: [rare-spots, check-raise, population-reads]
  level: intermediate
  street: flop
  pot_type: 3bet-pot
  position: ip
  title: When a 3-bettor checks a flop they normally bet and then raises, fold your marginal hands
  claim: If the out-of-position player checks a flop that the population almost always c-bets, treat the check itself as suspicious. When they then check-raise your bet, fold marginal hands even if the solver shows a close call.
  why: "A spot that is near-indifferent in theory becomes a clear fold when the opponent's line is far more weighted to strength than equilibrium assumes. Most players only check these flops with hands they are trapping with or giving up on, and only raise with the former. There is also very little to gain: these spots are rare, the sim is less accurate deep in the tree, and sticking around with a weak pair wins almost nothing even when correct. Reserve your tough calls for the common spots where the opponent's range is actually balanced."
  common_mistake: Hero-calling a check-raise in a line nobody takes as a bluff because the trainer showed a mixed strategy.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/035-defending-flops-in-position
      chunk: rio-game-plan/035-defending-flops-in-position#05
      stance: supports
      note: "Coach: realistically not a spot where people check-raise aggressively; be suspicious of the check and fold marginal hands in rare spots."
  consensus_score: 0.5
  hook_ideas:
    - "They checked a flop they always bet. Be suspicious."
    - "A close call in theory is a fold in practice here."
    - "Rare spot, marginal hand, big raise. Just fold."
  status: draft
