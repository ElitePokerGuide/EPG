- id: c-cash-6max-gp35-underpair-bets-are-bluffs-017
  format: cash-6max
  topic: defending
  concepts: [facing-raise, underpairs, board-pairs]
  level: intermediate
  street: flop
  pot_type: 3bet-pot
  position: ip
  title: "Underpair bets into a check, gets raised: fold it; pairs of the board continue"
  claim: When you bet a small pocket pair below the board into the 3-bettor's check and get raised, fold. A pair that matches one of the board cards, by contrast, is a clear continue against the same raise.
  why: Betting a pocket pair that is under the board is essentially a bluff with a little showdown value; against a check-raise its equity is poor and it is often drawing to two outs. A pair of the board card has more outs to improve, blocks the opponent's value and holds up against bluffs. Weak hands that bet for thin reasons should be ready to let go when the opponent pushes back, rather than calling because they were "already in the pot".
  common_mistake: Calling a check-raise with pocket fives on a 9-7-6 board because the hand was good enough to bet.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/035-defending-flops-in-position
      chunk: rio-game-plan/035-defending-flops-in-position#05
      stance: supports
      note: "Coach: pair to the board definitely continues; under-pairs that bet are basically bluffs when they start betting, so fold facing the raise."
  consensus_score: 0.5
  hook_ideas:
    - "You bet pocket fives and got raised. Let it go."
    - "Underpair vs check-raise: it was a bluff, fold it."
    - "Which pairs continue against a flop raise? Not the low ones."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp35-declare-pure-or-mix-018
  format: cash-6max
  topic: study-methods
  concepts: [trainer-drills, calibration, feedback]
  level: intermediate
  street: flop
  pot_type: 3bet-pot
  position: any
  title: Before acting in a drill, say whether you think the hand is a pure action or a mix
  claim: Commit out loud to "clear bet", "clear check" or "mixed" before the trainer shows the distribution. Being told a hand you called pure is actually 50-50 is the useful feedback; without the declaration you will just nod and believe you had it right.
  why: Trainers show frequencies, not just correct or incorrect. That extra information only improves your model of the spot if you had a prediction to compare it to. Declaring pure versus mix opens you up to being challenged on hands where your action matched the solver but your certainty did not. Over a session, this reveals whether you systematically see mixes as pures (too rigid) or pures as mixes (too random), which is a leak you cannot find from a score alone.
  common_mistake: Looking at the solver grid afterward and concluding "I had the right idea" when you never committed to an idea.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/035-defending-flops-in-position
      chunk: rio-game-plan/035-defending-flops-in-position#03
      stance: supports
      note: "Coach: verbalize clear bet, clear check or mix so the solver's distribution can challenge you; \"maybe I thought it was pure and it's only 50-50\"."
  consensus_score: 0.5
  hook_ideas:
    - "Pure or mix? Say it before you click."
    - "Right action, wrong certainty. Still a leak."
    - "How to get twice the feedback from every drill hand."
  status: draft
  created: "2026-10-04"
