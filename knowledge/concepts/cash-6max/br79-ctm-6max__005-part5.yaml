- id: c-cash-6max-br5-never-fold-to-a-min-bet-014
  format: cash-6max
  topic: defending
  concepts: [pot-odds, min-bets, small-bets, calling-ranges]
  level: beginner
  street: multi-street
  pot_type: srp
  position: any
  title: "Do not fold to a min-bet; the price is almost always right"
  claim: >-
    Facing a bet of one big blind or a tiny fraction of the pot, call with nearly
    anything that has outs or showdown potential. The pot odds justify it almost every
    time, and the small bets of wide-range players carry little information. Fold later
    if the price goes up.
  why: >-
    A min-bet lays you enormous odds, so even a gutshot or bottom pair is a
    profitable call. Weak players use small bets both with monsters and
    with nothing, so the bet does not narrow their range much either. Folding gives up
    equity you were offered almost for free. The danger is only on later streets if the
    sizing jumps, and you can reassess then.
  common_mistake: >-
    Folding a gutshot or weak pair to a one-blind bet because the hand feels too weak,
    ignoring the price on offer.
