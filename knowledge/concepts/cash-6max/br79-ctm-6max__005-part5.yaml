- id: c-cash-6max-br5-cbet-most-flops-ip-heads-up-009
  format: cash-6max
  topic: cbet-strategy
  concepts: [cbet-frequency, initiative, in-position, micro-population]
  level: beginner
  street: flop
  pot_type: srp
  position: ip
  title: "C-bet the large majority of flops heads-up in position; micro players give up easily"
  claim: >-
    Heads-up and in position after raising preflop, continuation bet most flops no
    matter what you hold, around 80% or more, with a stab of roughly 60% pot. When a
    player checks to you, bet. The strength of your own hand matters much less than
    the fact that the population plays very straightforwardly and folds too much.
  why: >-
    Players at these stakes mostly continue only when they connect, and they rarely
    float or check-raise light. That means a single bet wins the pot often enough that
    hand strength becomes almost secondary when you are in position against one
    opponent. The betting lead you bought preflop is only worth something if you use
    it. Reserve the checks for the small set of flops where you have no equity and
    expect few folds (see the card on middling two-tone boards), and against players
    who have shown they never fold.
  common_mistake: >-
    Only c-betting when you hit, which lets straightforward opponents play perfectly
    against you and wastes the initiative you paid for preflop.
  numbers:
    - "c-bet roughly 80%+ heads-up in position"
    - "standard stab ~60% pot"
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#03
      stance: supports
      note: "'My c-bet in position against one player is probably at least 80%'; normal ~60% stab."
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#04
      stance: supports
      note: "Players give up easily, so bet when checked to most of the time."
  consensus_score: 0.5
  contradictions:
    - "Solver-based c-bet frequencies vary heavily by texture and are often well below 80%; the coach argues the micro population over-folds enough to justify a near-always c-bet in position."
  hook_ideas:
    - "Checked to you in position? Bet. Here is the number."
    - "Your hand barely matters on this flop."
    - "Most NL5 players c-bet far too little heads-up."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br5-call-dont-3bet-light-vs-fish-010
  format: cash-6max
  topic: preflop-ranges
  concepts: [3-betting, isolation, weak-players, postflop-edge, value-3bet]
  level: beginner
  street: preflop
  position: ip
  title: "Call rather than 3-bet light against weak players; keep them in the pot"
  claim: >-
    Against a typical loose passive player, do not 3-bet marginal hands like queen-jack
    suited in position; call. Your edge after the flop is huge, especially in position,
    and a 3-bet often folds out the very player you wanted to play against. The
    exception is a loose player who raises 30% of hands: 3-bet medium pairs such as
    eights and nines and good broadways for pure value.
  why: >-
    A light 3-bet works by winning the pot preflop or by playing a bloated pot with
    initiative. Against a weak player neither matters much: you would rather see a flop
    with them cheaply and let them make postflop mistakes across three streets, which
    they will. Folding them out with queen-jack is throwing away the most profitable
    situation in the game. Against a player who raises very wide, though, your medium
    hands are far ahead of their range, so 3-betting becomes a value play rather than
    a bluff and you want the call.
  common_mistake: >-
    Treating every weak-player open as a 3-bet-for-isolation spot and watching them fold
    hands that would have paid you off postflop.
  numbers:
    - "vs a player raising ~30% of hands, 3-bet 88 and 99 for value"
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#03
      stance: supports
      note: "Coach says many players 3-bet fish lighter than he does; prefers calling IP; 3-bets 8s/9s for value vs 30% raiser."
  consensus_score: 0.5
  contradictions:
    - "Many modern coaches recommend 3-betting weak players wide for value and isolation; this coach prefers flatting to keep the weak player in, reserving 3-bets for clear value."
  hook_ideas:
    - "Stop 3-betting the fish. Seriously."
    - "Queen-jack suited versus the table fish: call, do not raise."
    - "We studied how coaches treat weak players preflop. They disagree."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br5-raise-draws-two-ways-to-win-011
  format: cash-6max
  topic: bluffing
  concepts: [semi-bluff, fold-equity, flush-draw, initiative]
  level: beginner
  street: flop
  pot_type: srp
  position: any
  title: "Raise your draws when a fold is likely: two ways to win beat one"
  claim: >-
    Facing a bet with a flush draw and nothing else, on a board where the bettor often
    gives up, raise instead of calling. You can win right now when they fold, and you
    still have the draw as a backup if they continue. The same logic is why you raise
    rather than limp preflop.
  why: >-
    Calling with a draw has exactly one way to win: hitting. Raising adds fold equity
    on top of that, and at micro stakes opponents give up a lot after a single raise.
    When the raise fails you are not dead; you still have outs, and sometimes a free
    river card after your show of strength. Giving yourself the maximum number of paths
    to the pot is the core reason aggression wins in this game, before and after the
    flop.
  common_mistake: >-
    Calling every draw passively and only winning the pots where the card arrives.
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#04
      stance: supports
      note: "Raises seven-high with a flush draw; 'give yourself as many ways to win the pot as possible'."
  consensus_score: 0.5
  hook_ideas:
    - "Calling a flush draw wins one way. Raising wins two."
    - "Seven-high, flush draw, facing a bet. Raise."
    - "The real reason aggression wins at micro stakes."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br5-check-turn-with-strong-non-nut-hand-012
  format: cash-6max
  topic: turn-play
  concepts: [bet-fold, pot-control, inducing, deception, barreling]
  level: intermediate
  street: turn
  pot_type: srp
  position: any
  title: "Do not auto-barrel the turn with strong non-nut hands when a bet only folds out worse"
  claim: >-
    When your hand is well ahead of an opponent's medium holdings, such as trips versus
    a top-pair type, but a turn barrel would fold out everything you beat and get called
    only by hands that beat you, check. You keep the weaker hands in for a river bet or
    call, and you avoid bet-folding a strong hand.
  why: >-
    Micro-stakes players call one bet with a mediocre hand far more readily than two.
    If you bet the turn, ace-high or a weak pair folds and you win a small pot; if you
    check, that same hand often bets the river or calls your river bet. The check also
    adds deception, and when the opponent does hold the nuts, their river bet is often
    sized so small that you can call profitably with outs to improve. Checking is not
    giving up: with trips you still call any turn bet, and you let them put in dead
    money.
  common_mistake: >-
    Barrelling every turn out of habit, then folding trips to a raise or winning only
    the small pot that a bet-fold line allows.
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#05
      stance: supports
      note: "Trips on a flush-completing turn; checks, opponent bets river with A-T and pays. Coach bet-folds turns less than most."
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#04
      stance: supports
      note: "'I really hate bet-folding trips in this spot'."
  consensus_score: 0.5
  contradictions:
    - "Solver-informed play barrels strong hands on most turns for value and protection; the coach argues the micro population over-folds medium hands to a second barrel, so checking earns more."
  hook_ideas:
    - "Checking the turn here makes you more money. Here is why."
    - "Trips on the turn. Most players bet. We check."
    - "Bet-folding a strong hand is a leak. Fix it."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br5-loose-players-hold-more-aces-013
  format: cash-6max
  topic: hand-reading
  concepts: [range-construction, ace-high-boards, loose-players, donk-betting]
  level: beginner
  street: flop
  pot_type: srp
  position: oop
  title: "Loose players have an ace far more often than a normal range does"
  claim: >-
    A player who enters the pot with every ace holds an ace on an ace-high flop much
    more often than a tight raiser would. So out of position with a medium pair on an
    ace-high board against a loose player, do not lead into them; check and call or
    fold, because they are sticky and have the ace a lot of the time.
  why: >-
    Range construction is about what a player actually enters pots with, not what a
    textbook range says. Loose players treat any ace as playable, so their range is
    weighted heavily towards ace-x. Leading out with a medium pair only creates
    headaches: they will not fold the ace, they call with worse and then stay sticky,
    and you end up guessing on later streets out of position. Give an unknown early
    position raiser some credit, keep the pot small, and let them tell you where they
    stand.
  common_mistake: >-
    Donk-betting middle pair into a loose player on an ace-high flop and then facing
    a raise or two more streets of pressure with no plan.
  source_refs:
