- id: c-cash-6max-br5-tag-players-fast-001
  format: cash-6max
  topic: tools-software
  concepts: [hud-stats, vpip-pfr, player-tagging, sample-size]
  level: beginner
  street: preflop
  position: any
  title: "Tag opponents after about a dozen hands using VPIP and PFR"
  claim: >-
    You do not need a big sample to label a player. VPIP and PFR settle quickly:
    after roughly ten to twelve hands (two orbits at 6-max) a 60%+ VPIP with a tiny
    PFR is a weak player, and someone who has played every hand for seven hands and
    min-raised from early position can already be tagged.
  why: >-
    Most HUD numbers need hundreds of hands, but VPIP and PFR are measured on every
    single hand dealt, so they converge far faster than any postflop stat. Weak players
    also leak information through single actions: an open-limp with junk, a min-raise
    from early position, posting in from a new seat. Tagging early matters because your
    whole table plan depends on knowing where the weak players sit, and you want them
    colour-coded before they bust or leave. Give the read some slack under ten hands,
    but do not wait for a large sample before acting on it.
  common_mistake: >-
    Waiting for a statistically clean sample before adjusting, by which time the weak
    player has left the table or you have already passed on ten profitable spots.
  numbers:
    - "tag by ~10-12 hands (about two orbits at 6-max)"
    - "100% VPIP over 7 hands plus a min-raise is already enough to label a weak player"
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#01
      stance: supports
      note: "Coach tags a 100/17 player after 6-7 hands; says he usually tags by about a dozen hands."
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#03
      stance: supports
      note: "VPIP and PFR need only a small sample to be close to true values."
  consensus_score: 0.5
  hook_ideas:
    - "Seven hands is enough to spot the weak player. Here is how."
    - "You are waiting too long to tag the fish."
    - "Two orbits. That is all the sample you need."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br5-prioritize-highest-vpip-002
  format: cash-6max
  topic: exploits
  concepts: [player-selection, vpip, weak-player-types]
  level: beginner
  position: any
  title: "Moderate stats can hide big leaks, but chase the highest VPIP first"
  claim: >-
    A player with ordinary-looking numbers (around 33/25) can still cold-call a 3-bet
    with king-nine and stack off, so never rule someone out on stats alone. But when
    deciding whom to isolate and whom to sit next to, prioritize the biggest VPIPs
    (60% and up), because they put the most money in with the worst hands.
  why: >-
    Stats describe how often a player enters pots, not how badly they play them. Some
    players with tame preflop numbers make huge postflop errors, and you should take
    the money when they offer it. Over a session, though, the player who sees 60% of
    flops gives you far more opportunities than the one who sees 30%, so your seat
    choice and isolation range should be built around the loosest player at the table.
  common_mistake: >-
    Ignoring a player because their VPIP looks reasonable, or spending the whole
    session trying to outplay a 33/25 instead of the 62/5 two seats over.
  numbers:
    - "prioritize players with ~60%+ VPIP; a 33/25 can still make huge mistakes"
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#03
      stance: supports
      note: "33/25 player cold-calls 3-bet with K9 and stacks off; coach still prefers targeting the 62% VPIP."
  consensus_score: 0.5
  hook_ideas:
    - "His stats looked fine. He stacked off with king-nine anyway."
    - "Not every bad player has bad stats."
    - "Which seat makes you the most money? Check one number."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br5-size-up-premiums-vs-loose-callers-003
  format: cash-6max
  topic: bet-sizing
  concepts: [open-raise-sizing, isolation-raise, premium-hands, out-of-position]
  level: beginner
  street: preflop
  position: any
  title: "Raise premiums bigger when a loose player is behind or you are out of position"
  claim: >-
    A standard open is about 3x from every seat, but with a premium hand and a weak
    player left to act, go 4x: if they call 4x as readily as 3x, you simply earn more.
    The same logic applies to isolating limpers: around 4x in position, a bit more when
    you will be out of position so they cannot limp and peel cheaply.
  why: >-
    Weak players at NL2-NL10 decide whether to play a hand, not whether the price is
    right, so their calling frequency barely changes between 3x and 4x. Charging more
    with your strongest hands against those players is free money, and it also builds
    a bigger pot for the streets where you have the equity edge. Out of position you
    want fewer multiway, cheap-peel situations, so a bigger raise narrows the field and
    puts the limper to a real decision. Micro-managing sizes like this is fine at these
    stakes because nobody is tracking your sizing tells.
  common_mistake: >-
    Opening kings for the same 3x against a 100% VPIP player who would have paid 4x or
    5x without blinking.
  numbers:
    - "standard open ~3x from every position"
    - "~4x with premiums when a loose player is behind"
    - "isolate limpers ~4x in position, a little more out of position"
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#02
      stance: supports
      note: "Kings raised bigger than usual 3x with a bad player behind and OOP; 'if they call more, put in more'."
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#04
      stance: supports
      note: "Iso-raise normally 4x, adds a couple more blinds OOP to deny cheap peels."
  consensus_score: 0.5
  hook_ideas:
    - "If he calls 4x as often as 3x, why raise 3x?"
    - "Your kings deserve a bigger raise against this player."
    - "One sizing tweak that prints against loose callers."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br5-dont-fight-small-pots-vs-fish-004
  format: cash-6max
  topic: exploits
  concepts: [pot-selection, image, weak-players, discipline]
  level: beginner
  street: multi-street
  position: any
  title: "Let weak players have the small pots; you do not need an image against them"
  claim: >-
    When a bad player makes a strange play against you, such as min-raising the turn
    with a medium pair, there is no need to raise back to show who is boss. Pass on
    thin spots against them. If you ever want to establish an image, do it against a
    regular who will actually notice.
  why: >-
    Weak players give their stacks away over time regardless of how you play the small
    pots, so fighting for them adds variance without adding much profit. Image plays are
    wasted on opponents who are not paying attention: they already think you are a
    maniac after you win a single pot, and they will not adjust in any coherent way.
    Your edge against them comes from big pots with big hands, not from winning every
    skirmish. Save the creative plays for regulars, where they can actually change
    future behaviour.
  common_mistake: >-
    Raising a weak player's silly turn bet with air out of pride, then having to barrel
    the river into a player who never folds.
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#01
      stance: supports
      note: "Coach lets a fish take a small pot after a weird turn raise; 'you don't have to fight for those little pots'."
  consensus_score: 0.5
  hook_ideas:
    - "Stop fighting weak players for small pots."
    - "He min-raised you with tens. The correct response is boring."
    - "Image plays are wasted on players who are not watching."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br5-river-raises-are-the-nuts-005
  format: cash-6max
  topic: river-play
  concepts: [thin-value, river-raise, fold-discipline, micro-population]
  level: beginner
  street: river
  pot_type: srp
  position: any
  title: "At micro stakes a river raise is almost always the nuts, so value bet without fear"
  claim: >-
    Players at NL2-NL10 almost never raise the river light. That cuts both ways: when
    you bet for thin value and get raised, fold easily; and stop skipping thin river
    value bets because you are afraid of being raised. Bet around half pot against a
    player who will call with any pair.
  why: >-
    Fear of a river raise is the most common reason weaker players leave value on the
    table. But the population at these stakes raises rivers with strong hands only, so
    the raise carries very little risk: you simply fold and lose nothing more than the
    bet. Meanwhile loose players call river bets with second pair, third pair and
    middling pocket pairs all day. The combination of easy folds versus raises and
    frequent calls from worse hands makes the thin river bet clearly profitable.
  common_mistake: >-
    Checking back a medium-strength hand on the river to avoid being raised, then
    paying off a raise when it does come.
  numbers:
    - "~half pot for thin river value against a sticky player"
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#02
      stance: supports
      note: "Forum players afraid to bet rivers; at this limit river raises are 'pretty much always the nuts'."
  consensus_score: 0.5
  hook_ideas:
    - "Scared to bet the river? That fear costs you money."
    - "A river raise at NL5 means one thing."
    - "The simplest river rule for micro stakes."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br5-flat-more-deep-ip-with-fish-behind-006
  format: cash-6max
  topic: preflop-ranges
  concepts: [cold-calling, implied-odds, position, deep-stacks, weak-player-in-blinds]
  level: beginner
  street: preflop
  pot_type: srp
  position: ip
  title: "Cold-call more preflop when deep, in position, with a weak player in the blinds"
  claim: >-
    The default versus an open is 3-bet or fold, with pocket pairs as the main calling
    hands. Widen that calling range considerably when three things line up: stacks are
    deep, you have position on the raiser, and a weak player sits in the blinds who will
    come along. In that spot 3-betting with suited broadways mostly folds out the player
    you want in the pot.
  why: >-
    Cold-calling is weak in general because you play a capped range without initiative.
    But deep stacks raise the value of implied odds, position lets you realize equity
    with hands like ten-nine suited, and a loose player behind you adds dead money and a
    target for every street. Those factors swing marginal hands from fold to call. A
    3-bet would get called by the raiser's pairs and draws while blowing the weak player
    out, which is the opposite of what you want.
  common_mistake: >-
    Mechanically 3-betting or folding every hand without noticing the 100% VPIP player
    sitting in the big blind with 150bb.
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#02
      stance: supports
      note: "Coach, who normally 3-bets or folds, calls with a suited hand because it is deep and the fish is in the BB."
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/005-part5
      chunk: br79-ctm-6max/005-part5#04
      stance: supports
      note: "Declines to 3-bet a decent hand because the point is to get in a pot with the fish in position."
  consensus_score: 0.5
  hook_ideas:
    - "3-bet or fold? Not when the fish is in the blinds."
    - "Three conditions that turn a fold into a call preflop."
    - "Why we stopped 3-betting here and started calling."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br5-leave-tables-without-a-fish-007
  format: cash-6max
  topic: table-selection
  concepts: [table-hopping, leaving-tables, reg-tables, ego]
  level: beginner
  position: any
  title: "Leave the moment the weak player leaves, especially when playing four tables or fewer"
  claim: >-
    If a table has no clear weak player, only 15/15 and 16/11 types, leave and find
    another one, even mid-session. Leave too if the only weak player sits on your left.
    Grinding a table of regulars to prove you can steal their blinds is an ego boost,
    not a win rate.
  why: >-
    You can beat tight regulars slightly by stealing blinds, but they do not give away
    stacks; loose passive players do. With four tables or fewer, swapping tables costs
    almost nothing and a table with a 75% VPIP player or open-limpers can be found in
    minutes. Position matters as much as presence: a weak player on your left acts
    after you and limits how often you can isolate them. Treat every table as a
    temporary seat and keep moving towards the money.
  common_mistake: >-
    Staying at a reg-filled table because leaving feels like admitting defeat, or
    because you have a few big blinds of history with someone.
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
