- id: c-cash-6max-br5-set-mine-needs-stack-depth-008
  format: cash-6max
  topic: preflop-ranges
  concepts: [set-mining, implied-odds, stack-depth, small-pairs]
  level: beginner
  street: preflop
  pot_type: srp
  position: any
  title: "Set-mine only when the raiser has enough stack to pay you off"
  claim: >-
    Calling a raise with a small pocket pair is a bet on flopping a set, so the raiser
    needs a deep enough stack to make the rare hit worth it. A 100bb raiser is plenty.
    Around 60-65bb it is marginal; continue only if a weak player is also in the pot or
    you have position. Against a min-raise the call is easy regardless.
  why: >-
    Small pairs rarely improve, so almost all their value comes from winning a big pot
    when they do. If the raiser has a short stack there is no big pot to win, and the
    call is just a slow leak. Extra factors can rescue a borderline spot: a loose
    player already in the hand adds implied odds from a second source, and position
    helps you extract when you hit. Check stack sizes before every set-mining call,
    not after.
  common_mistake: >-
    Auto-calling raises with pocket deuces against a 40bb stack and wondering why
    set-mining never seems to pay.
  numbers:
    - "100bb starting stack is plenty for set-mining"
    - "~60-65bb is marginal; needs a weak player in the pot or position to continue"
  source_refs:
