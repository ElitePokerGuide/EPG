- id: c-cash-6max-gp23-aggregate-reports-flop-only-017
  format: cash-6max
  topic: study-methods
  concepts: [aggregate-reports, solver-workflow, turn-study]
  level: advanced
  street: multi-street
  pot_type: srp
  title: Aggregate solver reports work for the flop c-bet node but break down from the turn on
  claim: >-
    Use aggregate multi-board reports to build flop c-bet and facing-c-bet categories, but switch to
    individual sims once you move to turn decisions. One node deeper the branches multiply and the
    report averages over bet-size sequences that would not actually happen on many of the boards.
  why: >-
    An aggregate report answers one question across hundreds of flops at once, which is exactly what
    you need to find texture groups. But it only works when the preceding action is identical, and
    each bet size you face needs its own report. By the turn the sequence depends on which flop size
    was used, which on a given texture may be rare or never chosen, so the averaged numbers describe
    lines that do not occur. At that depth, a few representative single-board sims per category
    teach more than a report that blends unrealistic lines.
  common_mistake: >-
    Drawing turn barrel frequencies from an aggregate report that lumps together flop sizes the
    solver would never pick on that board.
  hook_ideas:
    - "Aggregate reports lie about the turn. Here is why."
    - "Works on the flop, fails on the turn: aggregate reports."
    - "Why your turn frequencies from reports are wrong."
  source_refs:
    - school: rio
