- id: c-cash-6max-gp23-ace-high-check-raise-by-size-016
  format: cash-6max
  topic: check-raising
  concepts: [ace-high-boards, low-boards, bet-size-adjustment, two-broadway]
  level: advanced
  street: flop
  pot_type: srp
  position: oop
  title: "Ace-high flops: check-raise average vs small bets, low vs big; low flops stay high"
  claim: >-
    As the caller on ace-low-low or ace-mid-low flops, check-raise at about an average rate against a
    small c-bet. When the bet is large, which usually happens on two-Broadway ace boards like A98-type
    textures, drop to a low check-raise frequency. On all-low flops keep a high check-raise frequency
    even against big bets, and on two-Broadway boards stay low even against a quarter pot.
  why: >-
    Bet size and texture interact. A small bet on a dry ace board is often a range bet, so there is
    plenty of weak stuff to attack and your sets, two pairs and backdoor draws can raise at a normal
    clip. A large bet on an ace board with two Broadways comes from a strong, polarized range that
    will not fold much, so raising mostly isolates you against the top of it. On low boards your
    range advantage is large enough that even a big bet should still face frequent raises. Two-Broadway
    boards without an ace are the raiser's territory regardless of size.
  common_mistake: >-
    Using one check-raise frequency for "ace-high boards" without noticing that the bet size tells you
    which kind of ace-high board you are on.
  hook_ideas:
    - "Same ace-high flop, two bet sizes, two different plans."
    - "Big bet on a low board? Raise anyway."
    - "The bet size tells you how often to check-raise."
  source_refs:
