- id: c-cash-6max-gp23-no-check-raise-broadway-big-bet-015
  format: cash-6max
  topic: check-raising
  concepts: [broadway-boards, facing-large-cbet, simplification, exploit]
  level: advanced
  street: flop
  pot_type: srp
  position: oop
  title: Facing a 75%+ c-bet on a Broadway flop, drop check-raising entirely
  claim: >-
    On Broadway-heavy flops the caller's check-raise frequency is already low, so when the c-bet is
    75% pot or larger it is reasonable to simplify to never check-raising. The case gets stronger if
    the raiser barrels the turn at a high rate after betting the flop big.
  why: >-
    High-card boards give the raiser the nut advantage and a large bet polarizes an already strong
    range, leaving the caller few hands that gain from raising rather than calling. When the solver
    frequency is a few percent, removing it costs almost nothing and buys execution accuracy. Against
    an opponent who fires the turn a lot after a big flop bet, calling is even better: you let them
    keep bluffing into your strong hands instead of raising and folding out the bluffs you want to
    keep around.
  common_mistake: >-
    Check-raising top pair on KQJ into a big bet "for protection", turning a comfortable call into a
    spot where only better hands continue.
  numbers:
    - "vs 75%+ pot c-bet on Broadway flops: check-raise ~0%"
  hook_ideas:
    - "Never check-raise this flop. Yes, never."
    - "Big bet on a Broadway board? Just call."
    - "The simplest flop defense rule you will ever learn."
  source_refs:
