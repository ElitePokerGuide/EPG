      lesson: rio-game-plan/023-building-flop-strategies
      chunk: rio-game-plan/023-building-flop-strategies#04
      stance: supports
      note: "Coach's sheet notes: A-low mid check-raise vs small, low vs big; all-low stays high vs big; two-Broadway low even vs 25%."
