- id: c-cash-6max-br3-bet-big-before-scare-cards-015
  format: cash-6max
  topic: value-betting
  concepts: [nuts, wet-board, scare-cards, pot-building, no-slowplay]
  level: beginner
  street: flop
  pot_type: srp
  position: any
  title: With the nuts on a wet board, bet near pot now before scare cards arrive
  claim: >-
    When you flop a very strong hand on a board with flush and straight draws, bet close to the
    full pot and keep betting. Slow-playing risks a turn or river card that kills your action,
    and against players who do not give you credit anyway there is nothing to disguise.
  why: >-
    Every draw-completing card either makes the opponent's hand or scares them off, and both
    outcomes reduce what you win. Getting the money in while your hand is clearly best and their
    draws still look alive maximizes the pot you play for. Micro-stakes players also call big
    bets with pairs and draws, so there is no benefit in betting small to keep them in. The
    rare exception for slow-playing is a hand like flopped quads where nothing can beat you
    and no card changes that.
  common_mistake: >-
    Betting a third of the pot with the nut straight on a two-flush board and watching the
    flush complete.
  numbers:
    - "Bet roughly pot-sized with the nuts on wet boards"
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/003-part3
      chunk: br79-ctm-6max/003-part3#05
      stance: supports
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/003-part3
      chunk: br79-ctm-6max/003-part3#02
      stance: supports
      note: Coach says he rarely slow-plays; flopped quads is the one exception.
  consensus_score: 0.5
  hook_ideas:
    - Slow-playing the nuts on a wet board costs you the stack.
    - Bet pot now. The next card might not let you.
    - The one hand you are allowed to slow-play. Quads.
