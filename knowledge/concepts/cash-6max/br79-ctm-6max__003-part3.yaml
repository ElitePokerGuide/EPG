- id: c-cash-6max-br3-tight-stats-no-credit-012
  format: cash-6max
  topic: hand-reading
  concepts: [hud, stats, credit, player-typing, small-samples]
  level: beginner
  position: any
  title: Normal-looking stats do not mean an opponent deserves credit
  claim: >-
    A player with reasonable VPIP and PFR can still make very bad plays, such as stacking off
    with a weak draw or a bare pair. Do not fold a strong hand simply because the HUD says the
    opponent is tight; judge their actual play in the hand.
  why: >-
    Preflop stats describe only one part of a player's game. Someone who plays 21% of hands
    may still have no idea how to play postflop, and at micro stakes that is common. Giving
    automatic credit to tight stats means folding winners to players who are not thinking at
    the level you assume. Read the action, the sizing and the board, and use the stats as a
    starting point rather than a verdict. A tight player who does one silly thing is probably a
    slight loser, not a reason to stay at the table, but also not a reason to fold.
  common_mistake: >-
    Folding top pair to a raise from a 21/17 player and being shown a gutshot.
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/003-part3
      chunk: br79-ctm-6max/003-part3#04
      stance: supports
  consensus_score: 0.5
  hook_ideas:
    - Tight stats, terrible play. It happens more than you think.
    - The HUD said reg. The hand said fish. Trust the hand.
    - Do not fold to a number on a screen.
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br3-skip-cbet-two-overs-wet-013
  format: cash-6max
  topic: cbet-strategy
  concepts: [c-bet, coordinated-board, overcards, give-up]
  level: beginner
  street: flop
  pot_type: srp
  position: any
  title: With just two overcards on a middling, coordinated flop, do not c-bet
  claim: >-
    When you hold a hand like A-Q on a flop such as 9-8-6 with draws everywhere, give up without
    putting a chip in. The opponent connects with too many hands and you have only two overcards
    with no backup.
  why: >-
    Boards full of middle cards hit the calling ranges of micro players hard: pairs, straight
    draws, two pairs and combination draws are all common. Your two overcards have about six
    outs and little fold equity, since this type of opponent calls with any piece. A c-bet
    here builds a pot you are usually losing and sets up awkward turn decisions. Skipping the
    bet entirely keeps the loss to the preflop raise.
  common_mistake: >-
    C-betting every flop as the preflop raiser and then facing a raise on a board you can never
    continue on.
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/003-part3
      chunk: br79-ctm-6max/003-part3#04
      stance: supports
  consensus_score: 0.5
  hook_ideas:
    - Ace-queen on nine-eight-six. Do not bet a penny.
    - The flop every c-bet rule forgets about.
    - Two overcards, wet board, no bet. Here is why.
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br3-stay-an-orbit-after-fish-busts-014
  format: cash-6max
  topic: table-selection
  concepts: [table-selection, rebuy, tilt, position]
  level: beginner
  position: any
  title: When the fish busts, give them an orbit to reload before leaving
  claim: >-
    After the weak player at your table loses their stack, do not leave instantly. Stay for about
    one orbit to see whether they rebuy. If they do, they are now likely tilted and you already
    have position on them; if they do not, go find another table.
  why: >-
    A busted recreational player who reloads is one of the best opponents available: they are
    frustrated, chasing losses and in the same seat where you already hold the positional edge.
    Leaving the moment they bust throws that away for the uncertainty of a new table. An orbit
    costs almost nothing in blinds and resolves the question. If the seat stays empty, the
    table has lost its reason and you move on.
  common_mistake: >-
    Quitting the table the second the fish is felted, then watching them rebuy against someone
    else.
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/003-part3
      chunk: br79-ctm-6max/003-part3#04
      stance: supports
