- id: c-cash-6max-br3-posting-utg-tell-016
  format: cash-6max
  topic: hand-reading
  concepts: [tells, posting, limping, player-typing]
  level: beginner
  street: preflop
  position: any
  title: Posting a blind out of turn, limping and odd buy-ins are all beginner tells
  claim: >-
    A player who posts a blind under the gun instead of waiting one hand for the big blind is
    volunteering to pay twice, which only an inexperienced player does. Add it to limps and odd
    buy-in amounts as a quick signal to tag them before they have shown a hand.
  why: >-
    Every one of these actions has a free alternative that any studied player would take: wait a
    hand, raise instead of limping, buy in for a round full stack. Choosing the costly option
    reveals that the player is not thinking about expected value at all. Spotting it saves you
    the dozens of hands a HUD needs and lets you widen your isolation and value-betting range
    against them from the first orbit.
  common_mistake: >-
    Ignoring everything that happens before the cards are dealt.
