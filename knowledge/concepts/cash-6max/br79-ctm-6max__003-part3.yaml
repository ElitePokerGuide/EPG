      lesson: br79-ctm-6max/003-part3
      chunk: br79-ctm-6max/003-part3#05
      stance: supports
  consensus_score: 0.5
  hook_ideas:
    - The fish busted. Do not leave yet.
    - A reloaded fish is a tilted fish. Stay one orbit.
    - Why the best opponent is the one who just lost a stack.
