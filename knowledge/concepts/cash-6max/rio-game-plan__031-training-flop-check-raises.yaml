- id: c-cash-6max-gp31-overfold-overraise-linked-008
  format: cash-6max
  topic: defending
  concepts: [small-c-bet, fold-frequency, check-raise]
  level: intermediate
  street: flop
  pot_type: srp
  position: bb
  title: Fixing a low check-raise frequency usually fixes an overfold at the same time
  claim: A big blind who raises too little against small c-bets is usually folding too much in the same spot. Drilling the raise decision tends to repair both stats because the hands you learn to raise are the ones you were folding.
  why: Against a quarter-pot bet, the price is so good that very little of your range should fold. Players who are too passive feel they cannot call with weak draws and backdoors, and they do not raise them either, so those hands become folds. Once you start raising the marginal candidates, the folds that remain are the truly hopeless hands and your fold frequency drops toward the target.
  common_mistake: Working on fold-to-c-bet and check-raise as two separate leaks when they are one habit.
  numbers:
    - "Coach's fold vs small c-bet was about 5 percentage points too high"
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#01
      stance: supports
      note: Coach notes a side benefit of drilling raises versus the small size is also reducing his too-high folds.
  consensus_score: 0.5
  hook_ideas:
    - "Two leaks, one fix."
    - "Fold too much vs small bets? Start raising."
    - "The hands you fold should have been raises."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp31-wrong-suit-is-not-a-float-009
  format: cash-6max
  topic: defending
  concepts: [backdoor-draws, floating, suit-interaction]
  level: intermediate
  street: flop
  pot_type: srp
  position: any
  title: A backdoor flush draw in the wrong suit does not make a hand a float
  claim: When you consider peeling a flop bet or check-raise with a weak hand, your suit needs to match the board. Two suited cards in a suit that is not on the flop add almost nothing and do not turn a fold into a call.
  why: Floats and light continues are justified by the ways a hand can improve on the turn. A backdoor flush draw that shares a suit with the board gives you extra turn cards to continue on and bluff with. If your suit is absent from the flop, you need two perfect cards just to get to a draw, so the hand plays essentially as offsuit. In drills, this was the most common way the coach found himself calling too light.
  common_mistake: Treating any suited hand as a candidate to continue, regardless of which suits are on the board.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#02
      stance: supports
      note: "\"Diamonds usually aren't good on two-spade boards\" repeated twice as the error pattern."
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#03
      stance: supports
      note: Coach knows a float without the matching suit is too loose and uses the trainer to confirm.
  consensus_score: 0.5
  hook_ideas:
    - "Suited doesn't mean you can float."
    - "Your backdoor draw needs the right suit."
    - "One suit check that saves you a bad call."
