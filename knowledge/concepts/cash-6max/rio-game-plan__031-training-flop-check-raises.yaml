- id: c-cash-6max-gp31-fix-earlier-street-first-001
  format: cash-6max
  topic: study-methods
  concepts: [leak-fixing, check-raise, training-priority]
  level: intermediate
  street: flop
  pot_type: srp
  position: any
  title: Plug the flop leak before worrying about the turns and rivers it creates
  claim: When your stats show you check-raise or defend too little on the flop, raise that frequency first. Do not hold back because you are unsure how you will handle the new turn and river spots that follow.
  why: The flop decision comes up far more often than any branch after it, so that is where opponents are taking the most from you. Playing it more aggressively will land you in unfamiliar later-street spots and you will make some mistakes there, but those are smaller and rarer than the one you are already making every orbit. Work from the earliest street forward. Later nodes can get their own drills once you actually reach them in volume.
  common_mistake: Keeping a passive flop strategy because the aggressive version feels uncomfortable on later streets.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#01
      stance: supports
      note: Coach's own leaks were low flop c-bet, high fold to check-raise, low BB check-raise; insists on fixing the frequent node first. HU context.
  consensus_score: 0.5
  hook_ideas:
    - "Scared to check-raise more? That fear is the leak."
    - "Fix the flop first. The river can wait."
    - "Most NL10 players fix leaks in the wrong order."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp31-train-most-frequent-spots-002
  format: cash-6max
  topic: study-methods
  concepts: [training-priority, c-bet, routine]
  level: intermediate
  street: flop
  pot_type: srp
  position: ip
  title: Give the most frequent spots the most drilling time, even when they feel basic
  claim: Rank your training drills by how often the spot occurs. The in-position flop c-bet decision in a single-raised pot deserves a permanent place in your routine; a rare branch like facing a check-raise after a 75% c-bet gets a few minutes at most.
  why: Edge is frequency times EV gain. A fundamental spot you see every session, even with a small per-hand improvement, outweighs a flashy rare node where you might be badly off. Frequency leaks are also slow to move, so they need repeated sessions over months rather than one study block. Treat the common spots as the core of a recurring routine and let everything else be secondary.
  common_mistake: Spending study time on exotic deep-tree spots because they are interesting, while the everyday c-bet decision stays unexamined.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#01
      stance: supports
      note: Coach keeps IP flop c-bet drill in his regular routine for months; facing check-raise after bet 75% gets low priority.
  consensus_score: 0.5
  hook_ideas:
    - "The boring spot is the one making you money."
    - "Study time should follow frequency, not curiosity."
    - "You drill rivers. The flop is where you lose."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp31-force-the-action-you-lack-003
  format: cash-6max
  topic: study-methods
  concepts: [trainer-drills, overcorrection, check-raise]
  level: intermediate
  street: flop
  pot_type: srp
  position: bb
  title: When drilling a frequency leak, force the missing action on every plausible hand
  claim: If you know you check-raise too little, take the raise with every hand that looks like a candidate during the drill and let the trainer tell you when it was wrong. Keep leaning that way until the feedback starts marking you as too aggressive.
  why: "Your instinct is already biased toward the passive option, so playing \"what feels right\" in the drill just reproduces the leak. Deliberately overshooting exposes the hand classes you have been missing and recalibrates your sense of what qualifies. The same logic applies in reverse: someone who raises too much should call or fold every mixed hand. The goal is to overcorrect until mistakes appear on the other side, then settle in the middle."
  common_mistake: Playing the drill to get a high score, which only confirms habits instead of changing them.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#01
      stance: supports
      note: "\"Push the raising frequency with hands that seem reasonable\"; aim to err aggressive until feedback flips."
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#02
      stance: supports
      note: Long-term goal stated as overcorrecting into the aggressive direction.
  consensus_score: 0.5
  hook_ideas:
    - "Train to be wrong on purpose. Here's why it works."
    - "Your gut says call. Raise anyway, then check the answer."
    - "Overcorrect first. Fine-tune later."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp31-neutral-ev-raises-not-blunders-004
  format: cash-6max
  topic: study-methods
  concepts: [ev-mistakes, trainer-drills, mindset]
  level: intermediate
  street: flop
  pot_type: srp
  position: bb
  title: The goal of a check-raise drill is finding zero-EV raises, not avoiding blunders
  claim: In a frequency drill, a small negative EV mark on a raise that the solver mixes is a good result. You are hunting for the indifferent raises you never take in game, so avoiding every red mark means you are still too passive.
  why: Many flop check-raises are near-indifferent between calling and raising. If you never raise those hands, your frequency collapses and opponents can c-bet small with impunity. A trainer that flags a tiny EV loss on a hand that raises 50-60% of the time is confirming that the hand belongs in your raising range some of the time. Fixating on a clean score shifts your attention from the frequency problem you came to solve.
  common_mistake: Treating every highlighted mistake as equal, then retreating to the safe passive play after the first red mark.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#01
      stance: supports
      note: Coach repeats that blunder avoidance is not the point; sole focus is locating missed neutral-EV raises.
  consensus_score: 0.5
  hook_ideas:
    - "A red mark in the trainer can be good news."
    - "Zero-EV raises are the ones you keep missing."
    - "Stop chasing a perfect trainer score."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp31-check-raise-more-vs-small-cbet-005
  format: cash-6max
  topic: check-raising
  concepts: [small-c-bet, bb-defense, frequency]
  level: intermediate
  street: flop
  pot_type: srp
  position: bb
  title: Most of your missing check-raises live in the spot facing a small c-bet
  claim: When you need to raise your flop check-raise frequency from the big blind, look at the node facing a roughly quarter-pot c-bet. That is where solvers raise most and where passive players leave the most on the table. Against a large c-bet, the gap is much smaller.
  why: A small c-bet is made with a wide, weak range and offers you a cheap raise that puts real pressure on the in-position player. Solvers respond with far more check-raises there than against a big bet, which is already polarized and expensive to attack. If your overall check-raise stat is low, the deficit is almost certainly concentrated against the small size, so that is where drilling pays off fastest.
  common_mistake: Defending against a 25% bet mostly by calling, letting the bettor realize equity cheaply with the whole range.
  numbers:
    - "Drill focus: facing ~25% pot c-bet; low priority facing ~150% pot"
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#01
      stance: supports
      note: Coach starts with facing bet 25 because that is where most additional check-raises come from.
  consensus_score: 0.5
  hook_ideas:
    - "They bet a quarter pot. You call. That's the leak."
    - "Small c-bets are an invitation. Accept it."
    - "Where are your missing check-raises hiding? One spot."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp31-small-raise-paired-monotone-006
  format: cash-6max
  topic: check-raising
  concepts: [raise-sizing, paired-boards, monotone]
  level: advanced
  street: flop
  pot_type: srp
  position: bb
  title: A small check-raise size shows up mainly on high paired and monotone flops
  claim: If you add a small check-raise size to your flop strategy, use it on higher paired boards and monotone boards. On most other textures, stick to your standard raise size.
  why: On paired and monotone flops, both players' ranges contain many hands that are either very strong or almost hopeless, and equities move less from turn to river. A small raise lets you attack a small c-bet cheaply with a wide range without inflating the pot on a texture where your strong hands are already hard to get paid. On more dynamic boards, the larger raise does more work denying equity and charging draws.
  common_mistake: Using one check-raise size everywhere, which gives up the cheap pressure option on static textures.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#02
      stance: supports
      note: Coach identifies higher paired and monotone boards as where the small raise is most common in his sims.
  consensus_score: 0.5
  hook_ideas:
    - "A tiny check-raise on monotone flops. Here's why it works."
    - "Paired board, small bet, small raise."
    - "Not every check-raise needs to be big."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp31-double-broadway-low-not-zero-007
  format: cash-6max
  topic: check-raising
  concepts: [broadway-boards, frequency, board-texture]
  level: intermediate
  street: flop
  pot_type: srp
  position: bb
  title: Low check-raise boards are not zero check-raise boards
  claim: Two-Broadway flops are among the lowest check-raise textures for the big blind, even against a small c-bet. Low still means a few percent, not never. If you currently raise zero there, add a handful of raises with your strongest hands and best draws.
  why: On boards with two high cards, the opener has the range and nut advantage, so the caller mostly plays defensively. But a strategy that never raises is too predictable and lets the bettor realize equity with weak holdings at no risk. A low single-digit raise frequency keeps the bettor honest while still respecting the texture. Knowing the baseline is low is useful; rounding it to zero is a leak.
  common_mistake: Writing off entire board classes as "never raise" and giving the in-position player a free pass there.
  numbers:
    - "Coach's own check-raise on double-Broadway: often 0%, target roughly 5%"
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#01
      stance: supports
      note: Coach notes double-Broadway as a low check-raise board but says his zero should be about five percent.
  consensus_score: 0.5
  hook_ideas:
    - "'Never check-raise high boards' is costing you money."
    - "Low frequency is not zero frequency."
    - "KQ4 flop. Villain bets small. Do you ever raise?"
