- id: c-cash-6max-gp31-defend-vs-check-raise-not-3bet-010
  format: cash-6max
  topic: defending
  concepts: [facing-check-raise, floats, weak-pairs]
  level: intermediate
  street: flop
  pot_type: srp
  position: ip
  title: Facing a flop check-raise, defending enough matters far more than finding 3-bets
  claim: After c-betting and getting check-raised in a single-raised pot, focus on continuing with enough draws, marginal floats and weak pairs. Flop 3-bets are a minor part of the strategy and can mostly be ignored while you fix overfolding.
  why: The check-raiser's range is wide and includes many bluffs, so the in-position player must call with hands that feel uncomfortable. Players coming from tighter formats or full-ring games tend to carry over a folding reflex and give up hands that are clear continues against a wide raising range. Re-raising the flop adds little EV in comparison and is easy to overdo. Spend the training time on the call-or-fold line and only note when a 3-bet would have been clearly better.
  common_mistake: Folding weak pairs and backdoor draws to a flop check-raise because they "can't be good", which lets the raiser bluff profitably.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#02
      stance: supports
      note: HU context; coach found he was significantly too tight versus check-raises and de-prioritizes flop 3-betting.
  consensus_score: 0.5
  hook_ideas:
    - "You c-bet, they raise, you fold. That's the leak."
    - "Weak pair facing a check-raise? Calling is often right."
    - "Forget flop 3-bets. Fix your folds first."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp31-low-accuracy-sims-trust-frequency-011
  format: cash-6max
  topic: tools-software
  concepts: [solver-accuracy, trainer-drills, ev-noise]
  level: advanced
  street: multi-street
  pot_type: srp
  position: any
  title: In low-accuracy sims, trust the frequencies and ignore small EV gaps deep in the tree
  claim: When a solver was run at low accuracy to extract frequencies quickly, treat tiny EV differences on later nodes as noise. A pure action can still show a non-zero EV loss, and the noise grows with every bet, raise and call that precedes the decision.
  why: Each node down the tree is solved against a slightly imprecise strategy on the previous node, so the errors compound. A spot reached by a small bet, a raise and a call might be solved with very few combos and an EV figure that is off by more than the gap between options. Frequencies are more robust than exact EVs in these conditions. If a decision shows a meaningful EV difference, check whether it is a genuine mistake or an artifact before changing your play.
  common_mistake: Rebuilding a strategy around a half-blind EV difference reported by a sim that was never meant to be precise at that depth.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#02
      stance: supports
      note: Coach explains layers of inaccuracy compounding and chooses to focus on frequency of the play.
  consensus_score: 0.5
  hook_ideas:
    - "Your solver is lying about that EV. A little."
    - "Deep-tree EV numbers are mostly noise."
    - "Trust the frequency, not the decimal."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp31-verbalize-before-answer-012
  format: cash-6max
  topic: study-methods
  concepts: [calibration, trainer-drills, self-talk]
  level: intermediate
  street: multi-street
  pot_type: srp
  position: any
  title: Say how confident you are before the trainer reveals the answer
  claim: Before each decision in a drill, state out loud whether you think it is clear, close, or a stretch. Then compare with the solution. A "clearly too loose" that turns out fine, or a "close" that turns out pure, is the feedback that moves your game.
  why: Drills are not about the score; they are about calibrating your internal read of a spot to the solution. If you only look at right or wrong, you miss the information in how sure you were. Verbalizing forces you to commit to a judgment, which makes it obvious afterward when your confidence was misplaced in either direction. It also helps you notice systematic patterns, like always feeling that correct calls are too loose.
  common_mistake: Looking at the answer and thinking "yes, I knew that", when you had not actually decided.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#03
      stance: supports
      note: Coach narrates "loose but not crazy", "clear fold" etc. and explains it calibrates his view to the solutions.
  consensus_score: 0.5
  hook_ideas:
    - "Talk to your solver. Out loud. Seriously."
    - "Right answer, wrong confidence. Still a mistake."
    - "The drill habit that actually changes how you play."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-gp31-study-both-sides-of-node-013
  format: cash-6max
  topic: study-methods
  concepts: [trainer-drills, range-awareness, opponent-range]
  level: intermediate
  street: flop
  pot_type: srp
  position: any
  title: Watch the trainer's showdown hands to learn the opponent's side of the node
  claim: When a trainer deals the opponent's holding from the solver's own range, pay attention to those showdowns. They show you what a correct check-raising or betting range looks like in that spot, so you learn both sides of the decision at once.
  why: Knowing your own action is only half of the spot. Seeing which hands the solver check-raises, floats or gives up with builds an accurate picture of the range you are facing, which is what makes your calls and folds feel justified rather than forced. It also helps you spot which hand classes you are missing from your own aggressive ranges. Since the showdowns are solver-driven rather than random, they are a reliable sample of correct play.
  common_mistake: Clicking through the opponent's revealed hands without noting what they say about the raising range.
  source_refs:
    - school: rio
      course: The Game Plan
      lesson: rio-game-plan/031-training-flop-check-raises
      chunk: rio-game-plan/031-training-flop-check-raises#03
      stance: supports
      note: Coach points out villain showdowns are pulled from the sim, so he studies both sides simultaneously.
  consensus_score: 0.5
  hook_ideas:
    - "Your opponent's cards in the trainer are a free lesson."
    - "Study both seats at once. Here's how."
    - "What does a correct check-raising range look like? Watch."
  status: draft
