- id: c-cash-6max-cc03-red-line-trap-012
  format: cash-6max
  topic: mental-game
  concepts:
  - red-line
  - results-orientation
  - frequencies
  - discipline
  level: beginner
  street: multi-street
  title: Never bet to fix your red line or check to feel less spewy
  claim: Do not adjust your aggression in general. Fix the specific spot. Betting more "to be more aggressive"
    or checking more "to be less spewy" are both ways of avoiding the real question, which is whether
    this bet beats this check.
  why: A falling non-showdown line usually means you are missing mandatory bluffs, and that diagnosis
    is often correct. The wrong cure is to start betting randomly, because any fold equity will lift the
    red line while the showdown line drops by more, so the total graph gets worse. Labels like "too nitty"
    or "too aggro" operate at the level of whole frequencies and let you dodge engaging with the hand
    in front of you. Every decision is a comparison of two EVs in one spot, and no global adjustment can
    replace that.
  common_mistake: Firing a river bet with a hand that has decent showdown value because the graph looked
    passive, then losing more at showdown than the bluffs gain.
  hook_ideas:
  - Chasing a pretty red line costs you the green one.
  - '''I need to be more aggressive'' is not a plan.'
  - Your red line is a symptom. Don't treat the symptom.
  source_refs:
