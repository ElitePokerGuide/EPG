- id: c-cash-6max-cc03-dry-board-ace-high-calls-020
  format: cash-6max
  topic: exploits
  concepts:
  - dry-texture
  - thin-value
  - ace-high-calls
  - over-bluffing
  - landing-equity
  level: intermediate
  street: turn
  pot_type: srp
  position: ip
  title: On very dry boards opponents must call ace-high, so value bet thinner and bluff more
  claim: When a board is so dry that almost nothing connects, the defender is supposed to keep calling
    unpaired overcards, ace-high and backdoors. That makes medium and even small pairs strong value bets
    on the turn (pocket sevens can land around 70% equity after being called), and it makes every air
    hand a fine bet against humans, who do not call ace-high nearly enough.
  why: 'Finishing equity depends on what the opponent continues with. On a wet texture his continuing
    range is full of pairs and draws, so middle pair with a gutshot is an underdog once called. On a bone-dry
    paired or king-high rag board his continuing range is mostly unpaired hands, so a low pair dominates
    it. The same fact works in reverse for bluffing: because theory asks him to call with hands like ace-nine,
    a human who folds those is over-folding, and betting your whole air range at a 3/4 size becomes highly
    profitable. Hands as low as pocket deuces can even show a slim value-plus-denial bet in theory here,
    which illustrates how far the dry-board effect goes, though that is an edge case rather than a rule.'
  common_mistake: Checking back middle or low pairs on a blank turn because "I only beat ace-high", when
    ace-high is exactly what he is calling with.
  numbers:
  - 'example dry turn, 75% pot bet: pocket sevens ~72% landing equity, ace-six ~70%, pocket nines ~78%,
    pocket jacks ~80%'
  - 'ace-queen and ace-ten high: check'
  hook_ideas:
  - On this board he has to call ace-high. Punish it.
  - Pocket sevens, 72% equity after he calls. Bet.
  - 'Dry board, blank turn: every air hand is a bet.'
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#10
    stance: supports
    note: Homework review; sevens land ~72% because villain must call unmade hands on a board that is
      almost impossible to hit.
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#11
    stance: supports
    note: Landing equities for 77/A6/99/JJ; deuces anomaly; "against a human I would bet any two here".
  consensus_score: 0.5
  status: needs-review
  created: '2026-10-04'
  review_note: Edge case; strip solver-config-specific numbers before publishing.
- id: c-cash-6max-cc03-calibrate-equity-guesses-021
  format: cash-6max
  topic: study-methods
  concepts:
  - equity-estimation
  - calibration
  - drills
  - solver-study
  level: beginner
  street: multi-street
  title: Guess the equity before you look it up, every time
  claim: To get good at estimating equity after a bet is called, commit to a number before opening the
    solver or equity calculator, then check and recalibrate. Repeating guess-check-adjust trains the intuition;
    reading the answer first trains nothing.
  why: 'Equity estimation is a motor skill like throwing a ball into a bucket: you improve through feedback
    on your own attempts, not by studying the physics. Players who write down a guess and then see they
    were ten points low learn why (for example, they forgot that the opponent must call many unpaired
    hands on a dry board). Doing it with a study group, where one person sets a texture and action sequence
    and the others guess the landing equity, makes it social and sticks better. Trying to memorise solver
    outputs without this step does not transfer to the table.'
  common_mistake: Opening the solver, nodding at the numbers, and never testing whether you could have
    produced them yourself.
  hook_ideas:
  - 'Study tip: guess first, then look. Always.'
  - You can't learn to throw by reading about physics.
  - Memorising solver outputs doesn't work. This does.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
