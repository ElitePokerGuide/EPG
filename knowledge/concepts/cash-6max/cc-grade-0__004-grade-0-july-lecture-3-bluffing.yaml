- id: c-cash-6max-cc03-never-fold-extreme-advantage-011
  format: cash-6max
  topic: defending
  concepts:
  - range-advantage
  - donk-bet
  - folding
  - frequency
  level: intermediate
  street: flop
  pot_type: srp
  position: ip
  title: When your range dwarfs his, do not fold any hand to a small bet
  claim: When your range is massively stronger than your opponent's and he makes a small bet into you,
    fold nothing. Even your worst hands are entitled to a big share of the pot against a range that feeble.
    Fold frequency depends on favourability, not just on bet size.
  why: 'If your range were only aces and his only seven-deuce, you would never fold to a shove, and even
    a small frequency would be absurd; a horrible play does not become fine by doing it rarely. The same
    logic applies on boards like K-K-7 rainbow when the big blind leads 25% pot into the preflop raiser
    from early position: the raiser''s range is so much stronger that every hand in it continues. Pot
    odds give the baseline fold frequency for symmetric ranges, but range inequality pushes it towards
    zero in your favour and towards over-folding when you are the one being smashed.'
  common_mistake: Mechanically folding the bottom of your range to a tiny lead because "I have to fold
    something", regardless of how weak his range is.
  numbers:
  - 'vs a 25% pot donk on K-K-7 as the early-position raiser: fold 0%'
  hook_ideas:
  - Sometimes the correct fold frequency is exactly zero.
  - A horrible play done rarely is still a horrible play.
  - He donks into your monster range. Fold nothing.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#05
    stance: supports
    note: Aces vs 72 thought experiment; UTG never folds to a 25% donk on KK7.
  consensus_score: 0.5
  status: draft
