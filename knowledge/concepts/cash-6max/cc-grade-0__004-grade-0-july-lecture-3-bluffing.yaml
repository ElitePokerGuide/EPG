- id: c-cash-6max-cc03-delayed-cbet-never-check-down-016
  format: cash-6max
  topic: turn-play
  concepts:
  - delayed-cbet
  - fold-equity
  - range-advantage
  - bluff-timing
  level: intermediate
  street: turn
  pot_type: srp
  position: ip
  title: After checking back the flop, bluff the turn or the river, but never show down air
  claim: A delayed c-bet is more bluff-friendly than a double barrel because the opponent never had to
    call a bet and his range is still full of air. Betting the turn with air or waiting to bet the river
    when checked to are close in EV. What is a serious mistake is checking all the way down with a hand
    that cannot win at showdown while your range retains the advantage.
  why: 'The out-of-position caller folds well above the pot-odds baseline here: against a 33% bet, symmetric
    ranges would fold about a quarter, but the actual fold rate in a solver example was around 42%, and
    on the river he folds even more. That is why both timings work: betting now harvests fold equity while
    he still has junk; waiting lets him realise a little equity but saves money against his strong hands
    and sets up a bigger river fold rate. A small size suits the turn because your checked-back range
    has fewer monsters. The pure error is doing neither and losing the pot with queen-high on a board
    where he is folding more than enough to make almost any bet profitable.'
  common_mistake: Checking the flop, checking the turn, then checking the river with queen-high "because
    I never showed strength".
  numbers:
  - 'neutral break-even vs a 33% pot bet: 25% folds'
  - 'example delayed c-bet spot: opponent folds ~42% to 33% pot'
  hook_ideas:
  - Checked back the flop? You can still bluff. You must.
  - Queen-high, check, check, check. The quietest way to lose.
  - He folds 42% to a third pot. Why are you checking?
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#07
    stance: supports
    note: Q7 delayed c-bet CO vs BB; villain hasn't filtered range; 25% neutral vs 42% actual folds.
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#08
    stance: supports
    note: Bet turn or river, both fine; checking down queen-high is the big mistake; small size because
      range is capped.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-river-must-bluff-checked-down-017
  format: cash-6max
  topic: river-play
  concepts:
  - mandatory-bluff
  - range-advantage
  - checked-down
  - representation
  level: intermediate
  street: river
  pot_type: srp
  position: ip
  title: When the hand checks through to the river and you kept the range advantage, bluff your air
  claim: If you raised preflop against a blind caller and both players checked every street, your range
    is still stronger than his on the river. With a hand that cannot win at showdown you must bet, because
    there is no later street to delay to and checking with nothing equals folding. "I can't represent
    anything after checking twice" is a myth.
  why: In equilibrium the raiser's checking ranges are protected with plenty of showdown value, so checking
    does not turn his range into junk; both ranges weaken a little and the gap carries through. The opponent
    therefore has to fold a lot to a river bet, and real opponents with similar ranges tend to fold even
    more than the maths requires. A solver example with queen-high after three checks showed a pure bet
    to a 3/4-pot size, with the opponent folding far above the 43% break-even. Since a no-showdown-value
    check is worth zero, any bet that gets those folds beats it by the entire profit of the bet.
  common_mistake: Checking down eight-high after check-check-check and calling it "the honest line", when
    it is simply surrendering a pot your range owns.
  numbers:
  - 75% pot river bluff breaks even at ~43% folds; favourable checked-down rivers fold well above this
  hook_ideas:
  - '''I checked twice, I can''t rep anything.'' Wrong.'
  - Check, check, check, show down eight-high. Never again.
  - On the river, checking air is just folding.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#10
    stance: supports
    note: Must-bluff type 1 (retained preflop advantage after checks); double delayed c-bet Q6 pure bet
      example.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-river-busted-draw-after-checkback-018
  format: cash-6max
  topic: river-play
  concepts:
  - mandatory-bluff
  - busted-draw
  - range-condensing
  - give-up
  level: intermediate
  street: river
  pot_type: srp
  position: oop
  title: 'Called the flop, he checked back the turn, you missed: bet the river almost always'
  claim: When you call a flop c-bet out of position, the in-position player checks the turn, and you reach
    the river with a busted draw, bluff. Your flop call purged the air from your range while his turn
    check often means he is giving up with his flop bluffs, so your fold equity is far above the break-even
    point and checking is worth nothing.
  why: 'Calling a bet condenses a range: the junk folds and what remains is stronger on average. The flop
    bettor, by contrast, often bets a wide or polarised range and then checks the turn with its weak part.
    On the river that leaves you with the range advantage and him with plenty of hands that fold to one
    bet. Blocker details barely matter in this spot; a missed gutshot and a missed flush draw should both
    bet. Because a no-showdown-value check and a fold are identical on the river, every fold you collect
    is pure profit over checking.'
  common_mistake: Checking a missed flush draw to the in-position player "in case he bets", when he will
    mostly check back and win with ace-high or a weak pair.
  example_hand:
    positions: BTN vs BB
    hero: 9h8h
    board: Kh 6h 2c 3s Qd
    action: 'BTN opens, BB calls. BB checks, BTN bets 33%, BB calls. Turn: check, check. River: BB to
      act.'
    decision: Check or bet with the missed flush draw?
    answer: Bet. BB's flop call removed his air, BTN's turn check is often a give-up, and checking wins
      nothing.
  hook_ideas:
  - He checked back the turn. That's your green light.
  - Missed your flush? Good. Now bet the river.
  - Blockers don't matter here. Betting does.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#10
    stance: supports
    note: Must-bluff type 2; calling condenses range ("cleansing"); busted draw bluffs regardless of blockers.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-flop-range-bet-dont-trap-019
  format: cash-6max
  topic: cbet-strategy
  concepts:
  - range-bet
  - mandatory-bluff
  - slow-play
  - equity-denial
  level: intermediate
  street: flop
  pot_type: 3bet-pot
  position: oop
  title: With a massive flop range advantage, bet your air now instead of hoping he bets
  claim: On flops that overwhelmingly favour you, such as a paired king-high board as the 3-bettor from
    the blinds against the button, bluff immediately with your whole range. Checking to trap fails because
    the player with the weak range almost always checks back, and delaying lets him realise equity you
    could have denied.
  why: You hold all the kings and the big pairs; he mostly missed. If you check, a competent opponent,
    and even a weak one who senses the board is bad for him, will rarely bet into you, so the check-raise
    you were planning never happens. Meanwhile his jack-ten gets a free card and will not fold once a
    jack arrives. In one solver example the button folded about 53% to a third-pot bet, roughly double
    the 25% that pot odds alone would suggest, because he understands how badly his range is doing. Checking
    here is only a small error since you can bluff later, but it is still an error, and the betting should
    be done by the player with the strong range.
  common_mistake: Checking a dry king-high paired flop in a 3-bet pot to "induce", then watching the opponent
    check back and catch up.
  numbers:
  - 'example: button folds ~53% to a 33% pot c-bet on K-K-x vs the blinds'' 3-bet range (neutral baseline
    25%)'
  - checking instead loses ~1% of the pot in equilibrium
  hook_ideas:
  - Trapping on K-K-5 only traps yourself.
  - He folds 53% to a third pot. Bet everything.
  - When your range is the bear, you throw the first swipe.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#10
    stance: supports
    note: SB 3-bet vs BTN on KK5; bear analogy; range bet, opponent folds 53% to b33; also K turn double
      barrel can be mandatory.
  consensus_score: 0.5
  status: draft
