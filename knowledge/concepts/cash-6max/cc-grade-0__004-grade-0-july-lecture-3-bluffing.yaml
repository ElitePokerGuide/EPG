- id: c-cash-6max-cc03-equity-folded-spectrum-001
  format: cash-6max
  topic: fundamentals
  concepts:
  - value
  - denial
  - bluffing
  - equity-folded
  - bet-purpose
  level: beginner
  street: multi-street
  title: Classify every bet by how much equity the folded hands had
  claim: Judge what a bet is doing by the average equity of the hands your opponent folds, not by whether
    you "had the best hand". Near 0% folded equity means a value bet, 15-30% means value plus denial,
    around 50% is a bluff-denial hybrid, and 75-100% is a pure bluff.
  why: Whether you were technically ahead is a poor label because it makes 50% a magic number. What matters
    is how much of the pot the folded hands would have won at showdown. When a flush draw bets and makes
    ace-high fold on the flop, the opponent surrendered roughly half the pot, so there is a real bluffing
    component even though the draw may have been the favourite. Fold equity (how often he folds) and equity
    folded (what he gave up when he did) are different quantities, and the second one tells you why the
    bet made money.
  common_mistake: Calling any bet with the current best hand a "value bet" and any bet with the worst
    hand a "bluff", ignoring how much the folded hands would have won.
  numbers:
  - '~0% equity folded: value bet'
  - '~15-30% equity folded: value/denial'
  - '~50% equity folded: bluff-denial'
  - '75-100% equity folded: pure bluff'
  hook_ideas:
  - Your 'value bet' might actually be a bluff.
  - Stop asking who had the best hand. Ask what folded.
  - Four kinds of bet, one scale. Here it is.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#01
    stance: supports
    note: Coach draws a spectrum of average equity folded from value through denial to pure bluff.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-why-bluffs-beat-denial-002
  format: cash-6max
  topic: bluffing
  concepts:
  - bluffing
  - denial
  - fold-equity
  - ev
  level: beginner
  street: multi-street
  title: A pure bluff flips "usually losing" into "always winning"; denial only adds a sliver
  claim: Bluffing, like value, can justify a bet by itself. Denial cannot. When you bluff, each fold turns
    a hand that would lose most of the time into a won pot; when you bet for protection, most of the pot
    was already yours and a fold only adds a small extra share.
  why: 'A denial bet asks a hand with 15-20% equity to fold, so the gain is at most that slice. A pure
    bluff asks a hand with 90%+ equity to fold, so the gain is close to the whole pot. That is why the
    downside of bluffing (you lose nearly every time you are called) is worth accepting: the upside is
    enormous when your range lets you make the opponent fold more often than the break-even frequency.
    Semi-bluffs feel nicer because they sometimes win when called, but that does not make pure bluffs
    wrong; you should still bluff with no equity at some frequency on the flop and turn.'
  common_mistake: Treating protection as the main reason to bet while never putting in a bet whose only
    purpose is to make better hands fold.
  hook_ideas:
  - Protection bets gain crumbs. Bluffs gain the whole pot.
  - Usually losing, always winning. That gap is why you bluff.
  - Semi-bluffs feel safer. They are not more correct.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#02
    stance: supports
    note: Bluffing and value are the two self-sufficient reasons to bet; denial is a bonus.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-protection-is-a-modifier-003
  format: cash-6max
  topic: value-betting
  concepts:
  - protection
  - denial
  - finishing-equity
  - vulnerable-pairs
  level: intermediate
  street: turn
  pot_type: srp
  title: Treat protection as a tiebreaker, never as the reason you bet
  claim: Decide first whether a bet is value or a bluff. Only after that should denial nudge a close decision.
    "This pair needs protection" should never on its own produce a bet, because a hand that truly needed
    protection would show a clear EV gap between betting and checking.
  why: On a dry turn with a range of medium pairs, the solver often mixes jacks, nines and sevens at similar
    frequencies. The lower pairs gain more from denial because more of the opponent's hands are live against
    them, but they also get called by more better hands, so their finishing equity is lower. The two effects
    cancel, which is why all of them are optional bets. The bigger pairs still bet a little more often,
    because value is a far stronger reason than protection. If denial is the only thing driving you, you
    are solving the problem in the wrong order.
  common_mistake: Betting a vulnerable low pair "because it needs protection" while checking a stronger
    pair that would be the better value bet.
  hook_ideas:
  - '''My pair needs protection'' is not a reason to bet.'
  - 'Jacks, nines, sevens: same bet frequency. Here''s why.'
  - Protection is a tiebreaker. Value is the reason.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#01
    stance: supports
    note: Homework review; bigger pairs bet more because value matters more than denial.
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#10
    stance: supports
    note: Jacks/nines/sevens all indifferent; "need" protection is the dangerous word.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-underbluffing-biggest-leak-004
  format: cash-6max
  topic: bluffing
  concepts:
  - under-bluffing
  - leaks
  - aggression
  - micro-stakes
  level: beginner
  street: multi-street
  title: At the micros, missing a required bluff costs more than any calling error
  claim: Facing a bet limits your options, so calling mistakes tend to be small. When you have the free
    choice to bet or check, the errors are far bigger, and the most frequent large blunder at low stakes
    is failing to bluff in spots that demand it. If you genuinely cannot work out a spot, lean towards
    betting.
  why: Most low-stakes players have learned not to stack off with weak hands, but they have not learned
    to win the pots their range is entitled to. When your range is much stronger than your opponent's
    and the hand reaches the river, the opponent has to fold more often than the break-even point, and
    checking throws away a pot that was yours to take. Bluffing in bad spots does happen, but it is the
    rarer and usually smaller error. That asymmetry is why the default when unsure should be aggression,
    not caution.
  common_mistake: Checking down queen-high or eight-high after a check-check-check sequence and feeling
    virtuous for "not spewing".
  hook_ideas:
  - The most expensive mistake at NL10 is a bet you never made.
  - Calling errors are small. Betting errors are huge.
  - Not sure whether to bluff? That's usually a bluff.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#01
    stance: supports
    note: Opening claim of the lecture; "if not sure, probably just bluff".
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#05
    stance: supports
    note: Red-line digression; players are too passive in mandatory bluff spots.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-ask-what-folds-005
  format: cash-6max
  topic: hand-reading
  concepts:
  - bet-purpose
  - fold-targets
  - range-thinking
  - denial
  level: beginner
  street: flop
  pot_type: srp
  title: Define a bet by naming the hands that fold to it, not by how the board hits a range
  claim: '"This board connects with his range" tells you nothing about what your bet does. To understand
    a bet, name one hand you are bluffing (a better hand that folds) and one hand you are denying equity
    to (a worse hand with live outs that folds). If you cannot name either, question the bet.'
  why: A bet only changes the outcome against hands that fold, so that is the set you must think about.
    A 3/4-pot c-bet with ace-king on Q-T-3 rainbow folds out small pocket pairs (a bluff, since they are
    ahead) and also folds out junk like 6-5 with a backdoor draw and two live cards (denial). Hands like
    K-J that call or raise are not being denied anything; they may even outplay you later. And a hand
    you beat today, such as K-9, might bluff you off the pot on a later street, so being ahead of it now
    does not make the bet pure value. Thinking in terms of which hands fold keeps you honest about why
    the chips go in.
  common_mistake: Justifying a bet with "I want to fold out X" where X is a small slice of the range,
    or with "the board hits him" where that says nothing about what folds.
  example_hand:
    positions: UTG vs BB
    hero: AhKd
    board: Qs Tc 3h
    action: UTG opens, BB calls. BB checks, UTG bets 75% pot.
    decision: What is this bet doing?
    answer: 'Bluff-denial: it folds out small pairs that are ahead (bluff) and junk with live cards (denial).
      Too little equity when called to be value.'
  hook_ideas:
  - '''The board hits his range'' is a meaningless sentence.'
  - Name the hand that folds. Then you understand your bet.
  - 'Ace-king on Q-T-3: value bet or bluff? Neither.'
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#02
    stance: supports
    note: Exercise hand 1; coach rejects "this could hit BB's range" as irrelevant.
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#03
    stance: supports
    note: Names 22 as the bluff target and 65 as the denial target; KJ is not denied.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-finishing-equity-threshold-006
  format: cash-6max
  topic: value-betting
  concepts:
  - finishing-equity
  - thin-value
  - range-filtering
  - texture
  level: intermediate
  street: turn
  pot_type: srp
  title: Judge value bets by equity after the call; flop action moves that number
  claim: Judge a value bet by your equity against the hands that continue, not against the whole range
    before you bet. You want about 50-55% after the call. A pair plus a draw on a wet board after a big
    flop bet often lands near 40% and should check; a small pair on a dry board after the flop checked
    through can bet a third pot and still be comfortably ahead.
  why: A big flop bet filters your opponent's range hard, so by the turn he holds mostly hands that beat
    middle pair plus a gutshot; another big bet is too thin. When the flop was checked through on a texture
    he rarely connects with, his range is full of unpaired hands, so a small turn bet with a low pair
    gets called by worse and denies equity to all the live overcards. Two small sources of equity (a pair
    and a draw) added together do not automatically reach the value threshold. Checking is also entitled
    to a big share of the pot, so "I beat some hands" is not enough.
  common_mistake: Seeing that you are a favourite before betting and concluding it is a value bet, without
    asking what you are up against once he calls.
  numbers:
  - 'target finishing equity for a value bet: ~50-55%'
  - 'middle pair + gutshot after a 75% flop c-bet is called: ~39-40% finishing equity, check'
  hook_ideas:
  - You were the favourite. You bet. Now you're the underdog.
  - 'Pair plus draw on the turn: value bet or spew?'
  - 'One number decides your thin value bet: equity after the call.'
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#03
    stance: supports
    note: Exercise hand 2 (T9 with pair+gutter) is a bad bet, ~39% finishing equity.
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#04
    stance: supports
    note: Contrast with hand 4 (53 after check-check, 33% bet) which is value/denial.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-profitable-but-wrong-007
  format: cash-6max
  topic: fundamentals
  concepts:
  - ev-comparison
  - showdown-value
  - breakeven
  - checking-ev
  level: beginner
  street: river
  pot_type: srp
  title: A profitable bluff is still a blunder when checking makes more
  claim: Never evaluate a bluff by whether it beats the break-even fold frequency. Weigh what a bet earns
    against what a check earns, because a check is not worth zero; a fold is. With real showdown value,
    a bet that makes money can still cost you a large chunk of the pot.
  why: 'Take a river where the pot has been checked down and you hold king-high with a strong range on
    an ace-high paired board. Betting 3/4 pot needs about 43% folds to break even and the opponent folds
    far more than that, so the bet is profitable. But checking wins the pot very often, so the check is
    worth even more. In one such solver spot, checking was worth about 47% of the pot while a small bet
    earned 42% and a 4x-pot overbet still showed +27% of the pot: profitable, and still a mistake. Choosing
    a thousand when you were offered two thousand is not a good decision just because you ended up richer.'
  common_mistake: Saying "he folds more than 43% so this bet is good" and never asking what the hand would
    have earned by checking.
  numbers:
  - 75% pot bet breaks even at ~43% folds (3 into 7)
  - 33% pot bet breaks even at 25% folds (1 into 4)
  - 'example river: check ~47% pot EV vs bet ~42% (small) or ~27% (4x pot)'
  example_hand:
    positions: CO vs BB
    hero: KhJd
    board: Ac 4s 4d 8h 2c
    action: CO opens, BB calls. Checks through on flop and turn. BB checks river.
    decision: Bet 75% pot or check?
    answer: Check. The bet is profitable against the fold frequency, but king-high wins at showdown so
      often that checking earns clearly more.
  hook_ideas:
  - This bet makes money. It's still a huge mistake.
  - Which poker action is worth zero? Not checking.
  - '''He folds more than 43%'' is not a reason to bet.'
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#04
    stance: supports
    note: Coach frames this as "profitable but wrong" with a box-one-vs-box-two analogy.
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#05
    stance: supports
    note: A44 checked-down river with KJ; 4x pot EV +27% vs check 47%; folding is the zero action.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-three-bluffing-worlds-008
  format: cash-6max
  topic: bluffing
  concepts:
  - showdown-value
  - range-favorability
  - mandatory-bluff
  - optional-bluff
  level: intermediate
  street: multi-street
  title: Every bluff spot is forbidden, optional or mandatory; two factors decide which
  claim: 'Sort bluffing decisions into three buckets: cannot bluff (checking is better), optional (bet
    and check are about equal), and must bluff (checking loses a lot). Two inputs decide the bucket: how
    much showdown value your hand has, and how favourable the range-versus-range situation is for you.'
  why: High showdown value raises the value of checking, so bluffing has a higher bar to clear. A favourable
    range situation raises your real fold equity above what the pot odds alone suggest, so bluffing clears
    the bar more easily. Most spots in the middle of the hand are optional because the aggressor has a
    modest range edge that is roughly offset by the caller's filtered range. Must-bluff spots cluster
    on the river when you still hold the range advantage and there is no later street to bluff. Cannot-bluff
    spots require either too much showdown value or a badly unfavourable world, and there are fewer of
    them than beginners think. When quizzed, "optional" is the safe guess.
  common_mistake: Treating bluffing as a binary "is this a bluff spot" instead of asking how big the gap
    between betting and checking is.
  hook_ideas:
  - Can't bluff, can bluff, must bluff. Which one is this?
  - Two questions decide every bluff. Most players ask neither.
  - Most bluffs don't matter. A few are mandatory.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#04
    stance: supports
    note: Introduces the three situations and the two factors (SDV, world favourability).
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#05
    stance: supports
    note: Most bluffs are optional; "optional" is the safe multiple-choice answer.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-range-vs-nut-advantage-009
  format: cash-6max
  topic: board-textures
  concepts:
  - range-advantage
  - nut-advantage
  - sizing
  - favorability
  level: intermediate
  street: turn
  pot_type: srp
  title: Nut advantage sets your bet size; range advantage decides whether you bet at all
  claim: Having more nutted combos than your opponent does not mean you are in a favourable spot. Nut
    advantage controls sizing (bigger when you have it). Range advantage, meaning whose whole range has
    more equity, controls whether bluffing is allowed. You can hold the nut advantage and still be in
    a world where bluffing is a blunder.
  why: On an ace-high paired board after the flop checks through, the big blind has more trips than the
    in-position raiser. But trips are rare; the rest of his range is stuffed with eight-high and ten-high
    air, while the raiser's checking range keeps plenty of pairs and ace-x because it checks optional
    value hands rather than only junk. So the raiser retains the range advantage from preflop. If the
    big blind leads with air because "I have more fours", the raiser simply does not fold enough and the
    lead loses money. Judging favourability means looking at both complete ranges, not the top sliver.
  common_mistake: Saying "I have the range advantage here" when what you actually have is more combos
    of the nuts.
  hook_ideas:
  - More nuts than him? You still can't bluff here.
  - Range advantage and nut advantage are not the same thing.
  - '''I rep the trips'' is not a strategy.'
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#05
    stance: supports
    note: A44 turn probe; BB has nut advantage, CO has range advantage; "nut advantage controls sizing,
      range advantage controls what we do".
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-turn-probe-unfavorable-010
  format: cash-6max
  topic: turn-play
  concepts:
  - probe-bet
  - unfavorable-world
  - nut-potential
  - implied-odds
  level: intermediate
  street: turn
  pot_type: srp
  position: oop
  title: Probe the turn with air only when you have a draw to a nutted hand
  claim: After the in-position raiser checks back the flop, the out-of-position caller is usually in an
    unfavourable range situation on the turn. Bluff-probing with pure air is then worse than folding would
    be. Lead only with hands that can make a very strong hand by the river, such as flush draws and gutshots,
    or with real value.
  why: 'The raiser''s checking range stays stronger than the caller''s range, and he has position, so
    he defends a little more than the pot odds require. Pure air cannot recover when called: even hitting
    a pair on the river rarely wins and never earns another bet. A draw changes the maths because the
    times you get called and then hit, you win not just the current pot but an extra river bet, and those
    implied odds can lift the lead from losing to acceptable. In a solver example, nine-high overbetting
    the turn here was worth about -3% of the pot while checking kept +3.6%. The exception is low, connected
    turns that smash the caller''s range, where leading becomes close to a range bet.'
  common_mistake: Leading the turn with nothing after a check-back because "he showed weakness", then
    paying off when he calls.
  numbers:
  - 'example: nine-high overbet probe ~-3% pot EV vs check ~+3.6%'
  hook_ideas:
  - He checked back. That doesn't mean he's weak.
  - Betting here is worse than open-folding your hand.
  - Probe the turn with a draw or don't probe at all.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#05
    stance: supports
    note: Turn probe with 96 is a "categorical blunder"; attack only with nutted redraws; bet EV negative,
      check 3.6%.
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#06
    stance: nuances
    note: Exception named - probing a 7-6-5-4 type board is close to a range bet for BB.
  consensus_score: 0.5
