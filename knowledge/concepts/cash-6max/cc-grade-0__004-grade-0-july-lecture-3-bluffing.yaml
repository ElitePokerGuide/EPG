- id: c-cash-6max-cc03-no-comfort-blanket-013
  format: cash-6max
  topic: bluffing
  concepts:
  - pure-air
  - double-barrel
  - comfort-blanket
  - range-construction
  level: intermediate
  street: turn
  pot_type: srp
  position: ip
  title: You do not need a draw to barrel the turn when your range is doing fine
  claim: In position with a normal range on a dry runout, betting the turn with pure air after your c-bet
    is called is fine and often optional in theory, and better than fine against opponents who fold too
    much. Requiring a draw, backdoor or overcard as a "get-out clause" before bluffing means your betting
    range is far too strong.
  why: Your value hands sit at the top of your range and your semi-bluffs just below them. If you only
    barrel those, you bet an unbalanced, top-heavy range and give up the pot with everything else. A hand
    like queen-high on K-7-3-8 is entitled to only a few percent of the pot whichever way it is played,
    so betting it costs nothing relative to checking while adding the bluffs your range needs. Fold equity
    comes from the range-versus-range situation, not from your own card quality. The exception is a runout
    that hammers your range; then even air with no outs must check, unless it has nut potential.
  common_mistake: Checking back pure air on the turn with "nothing to rep" and only barrelling when holding
    some equity, making bluffs easy to spot and too rare.
  example_hand:
    positions: BTN vs BB
    hero: QhJc
    board: Kd 7s 3c 8h
    action: 'BTN opens, BB calls. BB checks, BTN c-bets, BB calls. Turn: BB checks.'
    decision: Barrel with queen-high and no draw?
    answer: Yes, at some frequency. Range is in a fine spot, fold equity is normal, and checking is worth
      almost nothing with this hand.
  hook_ideas:
  - Bluffing with nothing on the turn is normal. Here's why.
  - Only bluff with draws? Your range is far too strong.
  - Queen-high, no draw, dry turn. Bet it.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#04
    stance: supports
    note: Q6 turn barrel with no equity is fine; don't look for a get-out clause.
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#06
    stance: supports
    note: K73 8 turn with QJ - "who cares, bluff"; comfort blanket fallacy.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-compare-actions-not-hands-014
  format: cash-6max
  topic: bluffing
  concepts:
  - ev-comparison
  - comfort-blanket
  - bluff-selection
  - showdown-value
  level: intermediate
  street: turn
  pot_type: srp
  title: 'A better hand is not a better bluff: compare bet vs check for the hand you hold'
  claim: Whether to bluff is the difference between the EV of betting and the EV of checking with your
    actual hand. A flush draw is worth more than queen-high, but if both have bet EV equal to check EV,
    both are equally optional bluffs. "I'd rather bluff with a draw" compares hands, not actions, and
    is irrelevant.
  why: In a double-barrel spot the solver may bet a flush draw and an unpaired queen-high at similar frequencies.
    The draw is entitled to roughly 30% of the pot whatever it does; the queen-high to about 5% whatever
    it does. Neither gains anything by betting over checking, which is exactly what makes them optional.
    Players bet the draw far more often than the air because bluffing with equity feels less troubling,
    but a feeling about the hand is not evidence about the action. You are choosing between the two options
    available with these cards, not wishing for different cards.
  common_mistake: Checking the turn with air because "we have better bluffs in our range", which is a
    statement about which hands you would prefer, not about which action is higher EV.
  numbers:
  - 'example: flush draw ~31% pot EV, queen-high ~5% pot EV, both indifferent between bet and check'
  hook_ideas:
  - You'd rather have a flush draw. You don't. Now decide.
  - '''We have better bluffs'' is an emotion, not an argument.'
  - Both hands bluff the same amount. One just feels nicer.
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#07
    stance: supports
    note: J9ss vs QT double barrel; 31% vs 5% EV, both mixes; coach's "eureka moment".
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#08
    stance: supports
    note: Slide titled compare the EV of your actions, not your hand to one you don't hold; sandwich/restaurant
      analogies.
  consensus_score: 0.5
  status: draft
  created: '2026-10-04'
- id: c-cash-6max-cc03-optional-bluffs-dont-agonize-015
  format: cash-6max
  topic: bluffing
  concepts:
  - optional-bluff
  - neutral-spot
  - results-orientation
  - double-barrel
  level: intermediate
  street: multi-street
  pot_type: srp
  title: Most bluffs are optional; in a neutral spot, bet or check and never regret the result
  claim: 'C-betting the turn after a called flop bet, delayed c-bets, flop bets with a slight range edge
    and most triple barrels are optional bluffs: betting and checking are close in EV. Pick one, and if
    you bet and get called, do not conclude the bet was wrong.'
  why: Once the opponent has called a flop bet his range has condensed, so neither side holds a large
    range edge on the turn; that near-neutrality is exactly what makes bluffs optional. If betting air
    were clearly winning or clearly losing, someone would be playing badly and it would not be equilibrium.
    In these spots a bad hand is entitled to a small share of the pot by either route; bluffing earns
    that share through fold equity rather than by improving. Without a specific read that the opponent
    over- or under-folds, the choice barely matters, so there is nothing to agonise over and nothing to
    learn from one call.
  common_mistake: Barrelling, getting called, and deciding "he obviously had it, I should never bluff
    there" after a single outcome.
  hook_ideas:
  - Most bluffs don't matter. Stop agonising over them.
  - He called your bluff. That proves nothing.
  - 'Bet or check: when both are fine, just pick one.'
  source_refs:
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#06
    stance: supports
    note: List of optional spots; QT double barrel is neutral; "don't bet and then call yourself an idiot".
  - school: cc
    course: Carrot Poker School Grade 0
    lesson: cc-grade-0/004-grade-0-july-lecture-3-bluffing
    chunk: cc-grade-0/004-grade-0-july-lecture-3-bluffing#07
    stance: supports
    note: Bluffing EV is miserable but so is checking; hand entitled to ~5% either way.
  consensus_score: 0.5
