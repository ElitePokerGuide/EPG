- id: c-cash-6max-cc07-broadway-turn-on-low-board-008
  format: cash-6max
  topic: board-textures
  concepts: [turn-card, overcard, favorable-world, barrel-frequency, fold-equity]
  level: intermediate
  street: turn
  pot_type: srp
  position: btn
  title: A ten-to-king turn on a low board is the c-bettor's best barrel card
  claim: >-
    After c-betting a low or middling flop and being called, a turn ten, jack, queen or king
    is close to the most favourable world you can get. Bet around 70% of the time, value bet
    thin and bluff almost anything.
  why: >-
    Those cards belong to you for two reasons. Preflop the big blind 3-bet many of their
    strong broadway hands, so you hold more of them. On the flop, king-high or queen-high was
    pure air for both players, which means you bet it often as a bluff and they folded it
    almost always. The card also keeps your overpairs on top. The result is a range that
    pairs the turn far more often than theirs, with a large nut advantage preserved. In such
    a world the EV of your range can approach two-thirds of the pot and you can barrel almost
    as often as a range bet, something that almost never happens elsewhere in a single-raised
    pot. The ace is the notable exception to this pattern because ace-high often calls small
    flop bets.
  common_mistake: >-
    Slowing down on a king turn because "it's a scare card for both of us", when it is really
    a scare card almost only for the caller.
  numbers:
    - "King turn on a J-high board, BTN vs BB after flop bet-call: bet ~70%, BTN EV ~67% pot"
    - "BB folds ~43% to the 75% barrel there (roughly breakeven for a bluff)"
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#05
      stance: supports
      note: "King turn is insanely good for button: EV 67%, bet 70%, BB folds 43%."
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#08
      stance: supports
      note: "T, J, Q, K turns on lowish boards are very positive transactions for the c-bettor."
  consensus_score: 0.5
  hook_ideas:
    - "The best turn card to barrel is not the ace."
    - "Bet 70% of the time on this turn. Yes, really."
    - "Why a king turn is a monopoly for the preflop raiser."
