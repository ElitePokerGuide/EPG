      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#07
      stance: supports
      note: "A63 6 turn SB vs BB - bet 20%, EV 47.46%, everything checkable; low flush is a mix."
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#08
      stance: supports
      note: "Tiger/antelope - betting all flushes is a pool leak that stronger regs punish."
  consensus_score: 0.5
  hook_ideas:
    - "Checking the nuts out of position is not a slow-play. It's correct."
    - "You don't have to bet your flush. Here's the proof."
    - "Out of position on a bad turn? Bet 20%, not 60%."
