- id: c-cash-6max-cc07-single-size-turn-barrel-001
  format: cash-6max
  topic: bet-sizing
  concepts: [turn-barrel, simplification, single-sizing, ev-loss]
  level: beginner
  street: turn
  pot_type: srp
  position: ip
  title: Barrel the turn with one size (~75% pot) while you learn
  claim: >-
    Until your fundamentals are solid, double-barrel the turn with a single size of roughly
    three-quarters pot instead of mixing several sizes. Limiting yourself to one size costs
    close to nothing as long as you still choose the right hands and frequency.
  why: >-
    A solver given three turn sizes will often spread its bets across them, or settle on an
    overbet. That looks intimidating, but the EV gap between a 75% bet and a 150% bet with the
    same hands is tiny, usually within solver noise. What really costs money is betting the
    wrong hands, checking your whole range, or folding draws: those are big EV leaks. Sizing
    choice between two sensible options is not. One familiar size lets you learn where the
    bottom of your value range sits and which bluffs are allowed, which is far more valuable at
    this stage than a complex sizing tree. Add overbets later, once you have stopped making the
    large mistakes.
  common_mistake: >-
    Copying a solver's overbet-heavy turn strategy without understanding it, then misplacing
    value and bluff thresholds and losing far more than the sizing ever gained.
  numbers:
    - "Turn barrel size: ~75% pot as the single default"
    - "Restricting a solver from a 150% to a 75% turn size changed EV by a fraction of a percent of pot (noise)"
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#01
      stance: supports
      note: "Coach sets B75-only turn barrel as the course simplification; no measurable EV loss vs multi-size sim."
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#02
      stance: supports
      note: "Coach personally overbets but says beginners should master one familiar size first."
  consensus_score: 0.5
  hook_ideas:
    - "You do not need three turn sizes. One is enough."
    - "The solver overbets here. You can still bet 75%. Here's why."
    - "Most turn sizing worries are noise. This isn't."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-solver-sizing-is-not-a-verdict-002
  format: cash-6max
  topic: study-methods
  concepts: [solver-interpretation, ev-comparison, pseudo-equilibrium, sizing]
  level: intermediate
  street: multi-street
  title: A solver picking one size does not mean your other size is wrong
  claim: >-
    When a solver output shows a single sizing used at full frequency, do not conclude that a
    different sizing is a mistake. Compare the EVs of the two options; if they are within a
    fraction of a percent of the pot, both are fine.
  why: >-
    Any solver output is an approximation built from the limited sizes you gave it and the time
    you let it run. Stop it a minute later and it may flip from one size to another, because the
    two are nearly equal and it simply picks whichever is microscopically ahead at that moment.
    It never flips between a terrible option and a good one, so a hard switch between sizes is
    itself a sign that they were close. Treat the solver's colours as a hint and the EV numbers
    as the evidence. Forcing it to use a different size and seeing EV barely move proves the
    simplification is safe; forcing it to check its whole range or fold draws, by contrast,
    shows large losses.
  common_mistake: >-
    Seeing an all-overbet turn node and panicking that your 75% bet has been losing money all
    along, instead of checking how much EV the two sizes actually differ by.
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#02
      stance: supports
      note: "Coach explains pseudo-equilibria, solver run-time noise, and 'compare the EV, not the colours'."
  consensus_score: 0.5
  hook_ideas:
    - "The solver overbets 100% here. That proves less than you think."
    - "Stop reading solver colours. Read the EV."
    - "'The solver only uses one size' is a trap."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-range-advantage-vs-favorability-003
  format: cash-6max
  topic: fundamentals
  concepts: [range-advantage, favorability, equity-vs-ev, nut-advantage, polarization]
  level: intermediate
  street: turn
  pot_type: srp
  position: any
  title: Range advantage is about equity; favorability is about EV
  claim: >-
    Having a range advantage means your range has more equity than theirs. A favorable world
    means your range has more EV, counting position, nut share and future streets. On most
    turn barrel spots the flop caller holds the equity edge while the bettor holds the EV edge.
  why: >-
    Equity only measures who wins at showdown if all money went in now. EV also captures who
    gets paid, who gets folds and who controls the pot. After a flop bet and call, the caller
    has discarded their junk, so their average hand is stronger and their equity is often above
    50%. The bettor, however, kept almost all the nutted hands and far more bluffs, so their
    range is polarized. Polarized ranges earn more than their equity suggests because the nuts
    are entitled to well over 100% of the current pot once future bets count, and the bluffs
    still collect fold equity. So a condensed range can hold 55% equity and still be the one
    with 42% of the pot in EV. To be in an unfavorable world while holding the range advantage,
    you must be the condensed range facing a polarized one.
  common_mistake: >-
    Saying "this turn is bad for me, they have the equity now" and shutting down, when your
    nut advantage and position still make the spot profitable to barrel.
  numbers:
    - "A nutted overpair on a favorable turn is worth roughly 150-200% of the current pot in EV"
    - "Typical blank-turn barrel spot: bettor ~57-58% pot EV while caller has the equity edge"
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#01
      stance: supports
      note: "Coach distinguishes range advantage (equity) from favorability (EV) with army analogy."
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#03
      stance: supports
      note: "Condensed range with equity edge but EV disadvantage; nutted hands worth 150-200% pot in EV."
  consensus_score: 0.5
  hook_ideas:
    - "They have more equity. You have more money. Both are true."
    - "'Range advantage' and 'good spot' are not the same thing."
    - "How can 55% equity be a losing spot?"
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-flop-call-condenses-turn-barrels-selective-004
  format: cash-6max
  topic: turn-play
  concepts: [turn-barrel, condensed-range, double-barrel-frequency, range-bet]
  level: intermediate
  street: turn
  pot_type: srp
  position: ip
  title: Calling the flop strengthens their range, so turn barrels are rarely range bets
  claim: >-
    When the flop caller folds their weakest hands, their remaining range gets stronger on
    average, and on the turn they usually hold the equity edge. So after a flop c-bet is
    called, barrel the turn selectively, around 40-60% of the time on a blank, rather than
    betting your whole range.
  why: >-
    Betting the flop filters your opponent for you: their air leaves, their pairs and draws
    stay. A range built only from hands that passed a strength test is condensed, and
    condensed is not weak, it is simply short on nutted hands. Their equity jumps, yours
    stays flat or drops slightly even though your nut share remains high. Range-betting a turn
    into that stronger range hands them profitable calls and raises. The exceptions are rare
    cases where the turn card hugely favours you, like a king arriving on a low board in a
    3-bet pot where overpairs dominate. Otherwise expect to bet roughly half the time, more in
    favourable worlds and sometimes as little as 20-30% when the turn is bad for you.
  common_mistake: >-
    Treating "they called my c-bet" as weakness and firing the turn with everything, which
    pays off a range that just removed all its trash.
  numbers:
    - "Blank-turn barrel frequency after flop bet-call: ~40-60% on average"
    - "In bad turn worlds the frequency can fall to ~20-30%"
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#02
      stance: supports
      note: "Timeline figure - BB equity shoots up after calling; turn betting ranges nearly always selective, 40-60%."
  consensus_score: 0.5
  hook_ideas:
    - "They called your flop bet. Their range just got stronger."
    - "Range-betting the turn is almost never right. Here's the one exception."
    - "The 50% rule for turn barrels."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-polarized-betting-concentrates-nuts-005
  format: cash-6max
  topic: fundamentals
  concepts: [nut-advantage, polarization, concentration, range-construction]
  level: intermediate
  street: flop
  pot_type: srp
  position: ip
  title: Betting a polarized flop range raises your nut share, not your equity
  claim: >-
    When you bet the flop with your strongest hands and your bluffs while checking the middle,
    your betting range's equity barely rises but its share of nutted hands jumps. Ranges work
    by concentration and dilution, not just by combo counts.
  why: >-
    Think of a bucket of mixed balls: remove the mediocre ones and the chance of drawing a
    premium one goes up, even though you added nothing. Checking back medium pairs and
    weak ace-highs removes the filler from your betting range; the sets and overpairs that
    were always betting now make up a larger fraction. Because you also bet plenty of air,
    overall equity moves only slightly. This is why a c-bettor who bets 40% of the time can
    still arrive on the turn with a large nut advantage while trailing in equity. The caller,
    by contrast, checks every hand first, so nothing about their range changes until they
    call and shed their junk.
  common_mistake: >-
    Measuring your range only by how many strong combos you hold, and not by how concentrated
    they are after your line removes the medium hands.
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#02
      stance: supports
      note: "Blue/red balls analogy; betting is polarizing and polarizing increases nut prevalence."
  consensus_score: 0.5
  hook_ideas:
    - "Betting less often can make your range scarier."
    - "Your nut advantage comes from what you check, not what you bet."
    - "Ranges are concentrations, not combo counts."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-bricks-belong-to-the-bettor-006
  format: cash-6max
  topic: board-textures
  concepts: [turn-card, brick, range-interaction, polarization]
  level: intermediate
  street: turn
  pot_type: srp
  position: ip
  title: A low "brick" turn usually hits the flop bettor, not the caller
  claim: >-
    After a flop bet and call, a low unconnected turn card such as an 8 on a J-6-3 board is
    not a true blank. The bettor holds far more of that card, because low-card hands were bet
    as bluffs on the flop while the caller folded them.
  why: >-
    The flop bettor's range is polarized, so weak holdings with an 8 in them, like Q8 or 85
    suited, were near the front of the queue to bluff, not the back. The caller, meanwhile,
    needed something to continue with on J-6-3, and random 8-x was exactly what they threw
    away. So a card that looks dead actually pairs the bettor's air with some regularity and
    keeps their nut advantage intact. It does not flip the range advantage, because the
    condensed caller still has more equity on average, but it makes the turn a slightly better
    transaction for the bettor and nudges the barrel frequency upward. Only cards like a deuce
    that neither range interacts with are closer to real bricks.
  common_mistake: >-
    Labelling every low turn a "brick" and playing it identically, missing that your range,
    not theirs, is the one that connects with it.
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#02
      stance: supports
      note: "8 of clubs turn on J63; who has more 8x? Button, because 8x are bluffs on the flop and BB folds them."
  consensus_score: 0.5
  hook_ideas:
    - "That 'brick' turn is your card, not theirs."
    - "Why an 8 on J-6-3 helps the bettor."
    - "Bluffing the flop with junk pays off on 'blank' turns."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-favorability-is-the-whole-world-007
  format: cash-6max
  topic: turn-play
  concepts: [favorability, turn-card, action-sequence, position, holistic-evaluation]
  level: beginner
  street: turn
  pot_type: srp
  position: any
  title: Judge the turn world, not the turn card
  claim: >-
    How favourable a turn spot is depends on five things together: the preflop ranges, the
    flop, the flop action, position, and the turn card. The fourth card is just one of five
    inputs and only a quarter of the board.
  why: >-
    Players often say "the queen is good for him" and then act as though the first three
    cards disappeared. They did not. The same queen on the same flop can be a strong barrel
    card after a small bet and call in position, and a mediocre one out of position after a
    large bet. Position alone shifts EV by several percent of the pot in every spot, so a
    card that creates a neutral world for the in-position bettor can create an unfavourable
    one for an out-of-position bettor with identical ranges. Sorting spots into favourable,
    neutral and unfavourable is the skill to practise, and it is impossible if you only look
    at the fourth card.
  common_mistake: >-
    Deciding whether to barrel based purely on whether the turn card "looks good" for the
    preflop raiser.
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#02
      stance: supports
      note: "Turn card is 25% of the board; favorability is a function of preflop ranges, flop, flop action, turn card."
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#04
      stance: supports
      note: "Same bad card is neutral IP, unfavorable OOP; position is a constant EV tax."
  consensus_score: 0.5
  hook_ideas:
