- id: c-cash-6max-cc07-positional-slow-play-rule-016
  format: cash-6max
  topic: turn-play
  concepts: [protected-checking-range, slow-play, ip-vs-oop, urgency, check-raise]
  level: intermediate
  street: turn
  pot_type: srp
  position: any
  title: Positional slow-play rule - IP check strong-not-nutted hands, OOP check anything
  claim: >-
    In position on the turn, your checking range should contain some strong but not nutted
    hands (a good top pair, a weak flush) while the true nuts almost always bet. Out of
    position, keep the checking range fully uncapped: every hand, including the nuts,
    checks at some frequency.
  why: >-
    The driver is urgency, meaning how much money a hand still needs to get in before the
    river and how much time it has. In position the nuts own too much of the pot to let a
    street go by, so they must bet; a strong-ish hand gains from checking because it loses
    less when behind, lets weaker hands bluff the river and keeps hands in that would have
    folded. Out of position the opponent still has the option to bet when you check, so
    checking a monster does not lose a street; it often gains one via a check-raise. The one
    discipline is that when you do check a big hand OOP and they bet small, raise rather than
    call, because calling and checking again lets time run out. None of this is exploitative
    guesswork: the equilibrium strategy checks these hands too.
  common_mistake: >-
    Assuming "I'm in position, I always bet my strong hands" and "I'm out of position, I
    must bet before they check behind", which produces face-up checking ranges in both seats.
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#09
      stance: supports
      note: "Positional slow playing rule; OOP no mandatory value bets; check-raise deuces vs small bet, don't check-call."
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#06
      stance: supports
      note: "Solver checks K5-type top pair IP sometimes; KQ must bet because urgency is too high."
  consensus_score: 0.5
  hook_ideas:
    - "In position, check your good hands. Out of position, check anything."
    - "The nuts don't always need to bet the turn."
    - "One rule for slow-playing that depends only on your seat."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-i-bet-for-value-is-a-bad-thought-017
  format: cash-6max
  topic: value-betting
  concepts: [thought-process, weak-flush, blockers, relative-hand-strength, checking-range]
  level: intermediate
  street: turn
  pot_type: srp
  position: ip
  title: "\"I bet for value\" is an incomplete thought; a weak flush on the turn is often a check"
  claim: >-
    Deciding to bet because a hand is "a flush" or "strong" skips the real question: is
    checking also viable? On a flush-completing turn in position, a low flush is frequently a
    pure check, while only the near-nut flushes must bet.
  why: >-
    Three things argue for checking a low flush. First, blockers: holding two of the suit
    removes many of the drawing hands that would call your bet, so you are betting into a
    range that continues less. Second, relative strength: several higher flushes beat you,
    and checking gets you closer to showdown while losing less against them. Third, you
    unblock their air; hands that called the flop with overcards will often bluff the river
    after you check, paying you money that a turn bet would have folded out. A king-high or
    nut flush is different because it cannot be behind and owns too large a share of the pot
    to wait. Thinking "strong hand, bet" ignores all of this and makes your range easy to
    read for anyone paying attention.
  common_mistake: >-
    Betting every flush on the turn because it feels like a strong hand, then wondering why
    the river never produces bluffs when you check.
  example_hand:
    positions: BTN vs BB
    hero: 8c7c
    board: Qc9c4d 2c
    action: "BTN opens, BB calls. Flop: BTN bets 33%, BB calls. Turn: a third club, BB checks."
    decision: Bet the flush or check back?
    answer: >-
      Checking is at least as good and often better. Your two clubs block the draws that
      would call, you lose to every bigger flush, and checking lets BB bluff the river with
      the overcards they floated with. Only the top flushes here have to bet.
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#09
      stance: supports
      note: "Stream hand - 87cc flush IP is 100% check; Q7cc optional; K6cc mandatory. 'I bet for value' is a bad thought process."
  consensus_score: 0.5
  hook_ideas:
    - "You made a flush. Checking it might be the only correct play."
    - "'I bet for value' is costing you money."
    - "Why the small flush should sometimes stay quiet on the turn."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-draw-ladder-world-first-018
  format: cash-6max
  topic: bluffing
  concepts: [semi-bluff, draw-quality, favorability, bluff-eligibility, turn-barrel]
  level: beginner
  street: turn
  pot_type: srp
  position: any
  title: Rank the world first, then your draw - five tiers of unmade hands on the turn
  claim: >-
    Sort your unmade turn hands into premium draws, decent draws, marginal draws, semi-trash
    and utter trash. Premium draws may bet in any world; each weaker tier needs a more
    favourable world before it is allowed to bluff. Judge the world before you judge the hand.
  why: >-
    A flush draw or open-ended straight draw has enough equity to bail itself out, so it can
    barrel even when your range is suffering. A decent draw, such as a good gutshot or two
    live overcards, bets almost always but may sit out in a horrible world. A marginal draw,
    like a weak gutshot or one overcard with a backdoor, needs at least a neutral world.
    Semi-trash, a lone overcard or a flush blocker, needs a favourable one, and complete air
    with no outs and poor blockers can bet only in the very best worlds. The important habit
    is the order: players who start from "my hand is weak, I won't bluff" under-bluff
    favourable turns badly, where even air should bet sometimes. This ladder is about what
    can bet, not what must bet, and applies to the turn specifically.
  common_mistake: >-
    Starting from the hand ("only a gutshot, not good enough") instead of the world, so you
    never bluff enough when the turn is great for your range.
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#11
      stance: supports
      note: "Five categories of unmade hands vs world quality chart; 'think about the world first, then the draw'."
  consensus_score: 0.5
  hook_ideas:
