- id: c-cash-6max-cc07-thin-value-when-they-cannot-have-the-card-012
  format: cash-6max
  topic: value-betting
  concepts: [thin-value, favorable-world, second-pair, value-drives-bluffs]
  level: intermediate
  street: turn
  pot_type: srp
  position: ip
  title: In a favourable turn world, second pair is a value bet and value drives the bluffs
  claim: >-
    When the turn card is one the caller almost never holds, your value range widens
    dramatically: a hand that is now second pair can still bet for value, and because you are
    value betting so often, your draws and even your air may bet alongside.
  why: >-
    Value betting is about being ahead of the hands that call, not about absolute strength.
    If the turn king is nearly absent from the caller's range, your jack-high top pair from
    the flop is still ahead of most continuing hands, so it bets. A wide value range needs
    bluffs to balance it, which is why hands like Q-T with a draw bet very often, and why even
    low offsuit junk can bet: the fold equity is high enough that betting and checking are
    equal. Note the order of causation. Value hands drive the aggression; the bluffs simply
    tag along because the strategy wants a high frequency. Betting trash is not better than
    checking it, it is merely allowed. Even here the very middle of your range, like a weak
    pocket pair under the board, still has to check.
  common_mistake: >-
    Checking second pair on a king turn because "it's only second pair now", ignoring that
    the king barely exists in the caller's range.
  example_hand:
    positions: BTN vs BB
    hero: JcTc
    board: Js6d3h Kd
    action: "BTN opens, BB calls. Flop: BTN bets 33%, BB calls. Turn: king, BB checks."
    decision: Is this a check-back or a value bet?
    answer: >-
      A value bet is fine. BB folded almost all king-high on the flop and 3-bet much of it
      preflop, so the king rarely helps them. Your pair of jacks is still ahead of most hands
      that call, and the world is favourable enough to bet around 75% pot.
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#05
      stance: supports
      note: "JT value bets on the K turn; T7 and A5 bluffs are 0 EV vs check; value hands 'pull the strings'."
  consensus_score: 0.5
  hook_ideas:
    - "Second pair. King turn. Bet for value. Here's why."
    - "Your bluffs aren't the reason you're betting. Your value is."
    - "'Only second pair' is the wrong way to think about this."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-fold-equity-reacts-to-your-betting-range-013
  format: cash-6max
  topic: bluffing
  concepts: [fold-equity, breakeven, bluff-selection, betting-range, neutral-world]
  level: intermediate
  street: turn
  pot_type: srp
  position: any
  title: Their fold frequency is a reaction to what you bet, so trash bluffs lose in neutral spots
  claim: >-
    A 75% pot bet needs roughly 43% folds to break even as a pure bluff. In neutral or
    unfavourable turn worlds the caller folds less than that against a well-built range, so
    bluffing with no draw and no blockers loses money compared with checking.
  why: >-
    Fold equity is not a property of the spot; it is a response to your betting range. The
    caller folds a given amount because your bets are selective. If you start firing random
    junk, the solver, or an observant opponent, calls more and your fold equity drops further.
    So the 40% fold rate you see in a neutral world is the best case for a disciplined range,
    and already below the breakeven for air. Hands with a flush draw or overcards still have
    equity to fall back on, so they can bet; a hand with nothing cannot. In practice humans
    fold even less on connecting turns than theory suggests, which makes the restraint more
    valuable, not less.
  common_mistake: >-
    Reading a 40% fold stat and thinking "they fold a lot", then bluffing every air hand into
    it until the stat stops being true.
  numbers:
    - "75% pot bluff breakeven: ~43% folds (42.7%)"
    - "Neutral turn world after bet-call: caller folds ~40%; unfavourable: lower still"
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#06
      stance: supports
      note: "B75 requires 42.7% folds; BB folds 40.63% on the 4s turn, so T8hh bluff loses vs check."
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#07
      stance: supports
      note: "Fold equity is a reaction to our betting range, not to our whole range."
  consensus_score: 0.5
  hook_ideas:
    - "One number decides whether your turn bluff works: 43%."
    - "They don't fold 'a lot'. They fold to a disciplined range."
    - "Why your bluffing stat lies to you."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-worst-bluff-blocks-their-folds-014
  format: cash-6max
  topic: blockers
  concepts: [blocker-selection, bluff-candidates, folding-range, continuing-range, neutral-world]
  level: intermediate
  street: turn
  pot_type: srp
  position: ip
  title: The worst turn bluff blocks their folds and unblocks their calls
  claim: >-
    In a neutral or unfavourable turn world, pick bluffs that interfere with hands that
    continue and leave their folding hands intact. A hand with no draw, no overcard, no
    flush-suit blocker and cards that only hit their weak pairs is the worst possible bluff.
  why: >-
    Imagine a jack-high board with two flush draws on the turn and you hold 9-7 offsuit with
    neither suit. You cannot improve to beat a jack. You hold no card of either flush suit,
    so every draw that would raise or call you is fully live in their range. And your nine
    and seven are exactly the cards in their hands that would fold, like 9-9 under the jack
    or A-9 high; you want them to hold those, and you are making it less likely. Compare a
    hand like K-8 with one flush card: it blocks some continuing draws and has an overcard to
    hit, so although still "trash", it is a far more acceptable bluff. In a very favourable
    world none of this matters, but when fold equity is tight, blocker quality is what
    separates allowed bluffs from losing ones.
  common_mistake: >-
    Choosing turn bluffs by how "bad" the hand looks ("I have nothing, so I might as well
    bluff") instead of by what the cards block.
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#06
      stance: supports
      note: "K8 with 8s/Kd is semi-trash with blockers; 97hh is the worst bluff - no redraw, unblocks draws, blocks folds."
  consensus_score: 0.5
  hook_ideas:
    - "'I have nothing, so I'll bluff' is backwards."
    - "The worst bluff in poker looks exactly like this."
    - "Your bluff should block calls, not folds."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-oop-unfavorable-check-heavy-015
  format: cash-6max
  topic: turn-play
  concepts: [oop, unfavorable-world, checking-range, slow-play, protected-range]
  level: intermediate
  street: turn
  pot_type: srp
  position: oop
  title: Out of position on a bad turn, check most of your range, including the nuts
  claim: >-
    When you c-bet out of position and the turn connects with the caller's range, bet only
    around 20% of the time. There are no mandatory value bets: even your strongest hands can
    check at some frequency, because the in-position player will bet often when checked to.
  why: >-
    Being out of position is a constant tax on your EV, and a turn that favours the condensed
    caller pushes the world into unfavourable territory. Their range will raise more and fold
    less, so medium-strong hands like top pair with a weak kicker fall below the value line
    and air can never bet. Checking a monster here costs little: there is a whole river left,
    the opponent bets frequently into a check, and you can check-raise. The occasional missed
    bet when they check behind is recovered by the raises you get in and the bluffs you
    induce. A low flush with about 75-80% equity is a genuine mix between betting and
    checking, not a forced bet. Only strong exploitative reads, such as an opponent who never
    bets when checked to, should swing you back toward betting.
  common_mistake: >-
    Betting every flush and every strong hand out of position because it feels like missing
    value otherwise, leaving a checking range that stronger regulars attack.
  numbers:
    - "Unfavourable OOP turn world: bet ~20%, EV around 47% of pot"
    - "Weak flush OOP (~75-80% equity): roughly indifferent between bet and check"
  source_refs:
    - school: cc
