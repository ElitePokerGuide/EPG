- id: c-cash-6max-cc07-range-check-horrible-flops-ip-020
  format: cash-6max
  topic: cbet-strategy
  concepts: [range-check, bad-flops, low-frequency-cbet, initiative-myth, donk-bet]
  level: intermediate
  street: flop
  pot_type: srp
  position: ip
  title: On terrible flops in position, range check rather than c-betting 20% of the time
  claim: >-
    When a flop is so bad for the preflop raiser that the equilibrium c-bet frequency drops to
    about 20% at a small size, simplify to checking your entire range in position. The caller
    will lead the turn often, so your strong hands still get paid.
  why: >-
    A 20% c-bet strategy is nearly impossible to execute: you would need a randomizer for
    every hand class and gain almost nothing for the effort. On flops like low connected
    monotone boards, even your overpairs hold only around 62-65% equity against the caller's
    range, behind more often and less far ahead when in front, so they do not want to build a
    big pot yet. If the flop is that bad for you it is correspondingly good for the caller,
    who in theory wants to lead the turn at a high frequency, so your sets and straights
    make money by letting them bet. Remember that initiative is not a reason to bet: betting
    with a range disadvantage is the same whether you raised preflop or not. What matters is
    which ranges arrived at the flop.
  common_mistake: >-
    Feeling obliged to c-bet "something" because you were the raiser, and firing a tiny
    fraction of the time with a strategy you cannot actually apply.
  numbers:
    - "Overpair on a very bad flop texture: ~62-65% equity vs the caller's range"
    - "If the equilibrium c-bet frequency is ~20%, simplify to a range check in position"
  source_refs:
    - school: cc
