- id: c-cash-6max-cc07-ace-turn-fallacy-009
  format: cash-6max
  topic: board-textures
  concepts: [ace-turn, turn-card, sticking-around, range-interaction, fallacy]
  level: intermediate
  street: turn
  pot_type: srp
  position: ip
  title: The ace turn is often the worst overcard for the c-bettor on a dry board
  claim: >-
    After a small c-bet on a dry low flop is called, an ace turn is usually the least
    favourable high card for the bettor, not the best. Ace-high hands had every reason to
    call the flop, so the caller connects with the ace and leapfrogs your overpairs.
  why: >-
    On a bone-dry flop like 7-5-2 rainbow, ace-high is comfortably good enough to call a
    one-third pot bet, so the big blind arrives on the turn with lots of A-x. When the ace
    lands, their cheap A6 or A9 suddenly beats your kings, queens and jacks, which were unique
    to your range. Your nut advantage shrinks sharply. By contrast a queen, or a true brick
    like a three, keeps your overpairs on top and gives them nothing. The ace becomes good for
    the raiser only when the caller could not keep ace-high: on wet flops like 9-8-6 where
    A-J offsuit folds, when you opened from early position and hold a bigger share of aces,
    or when you used a larger flop size that pushed ace-high out.
  common_mistake: >-
    Firing every ace turn as a "scare card" because you are the preflop raiser, when the
    caller holds more aces than you after calling a small bet on a dry board.
  example_hand:
    positions: SB vs BB
    hero: KhKs
    board: 7d5c2s Ah
    action: "SB opens, BB calls. Flop: SB bets 33%, BB calls. Turn: ace."
    decision: Is the ace a good barrel card for the preflop raiser here?
    answer: >-
      Not especially. BB kept most ace-high hands against the small bet, so the ace improves
      their range more than yours and demotes your overpairs. The world stays slightly
      favourable because of your remaining strong hands, but it is the lowest-EV turn of the
      thirteen ranks, so barrel more carefully than on a queen or a brick.
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#08
      stance: supports
      note: "'Ace turn fallacy' - ace is the lowest-EV turn for SB on a dry flop; queen is best; exceptions listed."
  consensus_score: 0.5
  hook_ideas:
    - "The ace turn is a scare card. For you."
    - "'Ace turn, I'm the raiser, I bet' is costing you money."
    - "Why the ace is the worst high card to barrel here."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-flush-turn-favors-flop-caller-010
  format: cash-6max
  topic: board-textures
  concepts: [flush-turn, condensed-range, sticking-around, suited-hands, oop]
  level: intermediate
  street: turn
  pot_type: srp
  position: oop
  title: Flush-completing turns favour the flop caller, especially against an OOP bettor
  claim: >-
    When the turn completes a flush after a flop bet and call, the caller gains more than the
    bettor. Out of position this usually makes the world unfavourable for the bettor; in
    position it is closer to neutral.
  why: >-
    The caller's range has passed a strength test: to continue on a two-tone flop they needed
    a pair, a draw or a backdoor, and suited hands with the flush suit were a big part of that.
    The bettor needed no such reason, since a flop bet can be made with any two cards, so
    their range is thinner in flush combos. Preflop also matters: the big blind defends more
    suited hands and fewer big offsuit pairs. When the third suit arrives, a cluster of the
    caller's hands jumps ahead of the bettor's overpairs, two pairs and sets, which lose EV
    on this runout. Add the EV tax of being out of position and the bettor should check at a
    high frequency and protect that checking range. In position, nut advantage and positional
    control keep the spot roughly even instead.
  common_mistake: >-
    Treating the flush turn as "scary for both" and barrelling anyway, when the caller is far
    more likely to hold the flush and will raise.
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#03
      stance: supports
      note: "K98 8h turn, SB vs BB - unfavorable for SB; BB had a reason to stick around; IP it would be neutral."
  consensus_score: 0.5
  hook_ideas:
    - "The flush came in. Whose card is it? Not yours."
    - "They had to earn their place in this pot. You didn't."
    - "The flop caller owns the flush turn. Here's why."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-cc07-favorability-sets-your-thresholds-011
  format: cash-6max
  topic: turn-play
  concepts: [favorability, barrel-frequency, value-threshold, bluff-selection, checking-range]
  level: intermediate
  street: turn
  pot_type: srp
  position: any
  title: Favourability sets how strict your turn value and bluff thresholds are
  claim: >-
    Classify the turn world first, then set your standards. Favourable: bet 60%+ of the time,
    value bet thin and bluff almost any hand. Neutral: bet around 35-40%, raise the value bar
    and pick bluffs by blockers and draws. Unfavourable: bet around 20%, only strong value and
    premium draws, and protect your checking range.
  why: >-
    Your opponent's folding frequency is a reaction to your betting range. In a favourable
    world their range is weak enough that even trash gets enough folds to be indifferent with
    checking, and marginal hands like second pair become value bets because the top of their
    range is missing. In a neutral world they fold a little less than the bet size requires,
    so an air bluff is already a loser and only hands with equity or good blockers may bet.
    In an unfavourable world they are condensed around hands that connect, they will raise
    more, and your medium-strong hands drop below the value line entirely. The same hand can
    be a mandatory bet in one world and a mandatory check in another; the hand did not change,
    the world did.
  common_mistake: >-
    Using one fixed turn barrel frequency regardless of how the card, position and action
    sequence changed each range.
  numbers:
    - "Favourable world: barrel ~60%+; neutral: ~35-40%; unfavourable: ~20%"
    - "Neutral-world example: BB folds ~40.6% vs ~42.7% needed for a 75% pot bluff to break even"
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#04
      stance: supports
      note: "Favorability sets standards; favorable 60%+, neutral ~40%, unfavorable mostly check."
    - school: cc
