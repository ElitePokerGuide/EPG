- id: c-cash-6max-cc07-rng-only-when-indifferent-019
  format: cash-6max
  topic: study-methods
  concepts: [randomization, rng, mixed-strategy, exploitation, indifference]
  level: intermediate
  street: multi-street
  title: Use a randomizer only for spots you know are a true mix
  claim: >-
    Randomize between bet and check only when you are confident the two actions have the same
    EV. If a hand is a clear check, a high RNG roll does not make betting right. And when you
    have a read, skip the randomizer and take the exploitative line.
  why: >-
    Mixing exists because some hands are genuinely indifferent in equilibrium, and a
    randomizer is the least stressful way to execute that without leaking patterns. The danger
    for developing players is using it before they know which spots are indifferent: rolling a
    94 and betting a hand that loses significant EV when bet turns a tool into a blunder
    generator. So learn the thresholds first, randomize second. Also remember that
    equilibrium mixing is only the default. Against a station you simply value bet; against
    someone who overbluffs when checked to you simply check. Live, randomizing is rarely
    needed at all because reads are so plentiful. A HUD-based RNG is far more pleasant than
    opening a web page every hand.
  common_mistake: >-
    Treating "the solver mixes here" as permission to let a random number choose, even in
    spots where one option is clearly better for the specific hand or opponent.
  source_refs:
    - school: cc
      course: Carrot Poker School Grade 0
      lesson: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-
      chunk: cc-grade-0/008-grade-0-july-lecture-7-turn-barrel-opportunities-simplified-#10
      stance: supports
      note: "Don't RNG anything until you know it's indifferent; exploits override mixing; live rarely needs RNG."
  consensus_score: 0.5
  hook_ideas:
    - "Your randomizer is making you worse. Here's when."
    - "Rolling a 94 does not make a bad bet good."
    - "Mix only when it's actually a mix."
