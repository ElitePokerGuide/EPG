- id: c-cash-6max-br8-stack-off-queens-vs-near-maniac-with-history-013
  format: cash-6max
  topic: preflop-ranges
  concepts: [queens, 4-bet-pots, loose-aggressive, history, stacking-off]
  level: beginner
  street: preflop
  pot_type: 4bet-pot
  position: any
  title: "Get queens in preflop against a near-maniac, especially right after you 3-bet them"
  claim: >-
    Against a player with stats close to 47/37 who 4-bets you, shove queens. Their range
    is wide and aggressive, and if you 3-bet them an orbit or two earlier they are even
    more likely to be playing back light. Do not let a full-ring habit of slowing down
    with queens cost you a stack against this player type.
  why: >-
    Queens are a borderline hand against a tight 4-bettor, but the decision is entirely
    opponent-dependent. A loose-aggressive player 4-bets with far more than aces and
    kings, and recent history makes them more stubborn still. Against that range queens
    are a big favourite and the third-best starting hand, so the stack-off is clear. If
    they happen to have one of the two hands that beat you, that is variance, not a
    mistake.
  common_mistake: >-
    Flat-calling or folding queens to a 4-bet from a 47/37 because "queens are tricky",
    applying a full-ring rule to a maniac.
  numbers:
