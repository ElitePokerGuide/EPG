- id: c-cash-6max-br8-target-stats-for-beginners-at-6max-014
  format: cash-6max
  topic: preflop-ranges
  concepts: [vpip-pfr-targets, 3-bet-frequency, beginner-ranges, table-count]
  level: beginner
  street: preflop
  position: any
  title: "A beginner at 6-max should aim near 21/18 with a 4-5% 3-bet, tighter than the coach"
  claim: >-
    Stats like 28/23 with an 8% 3-bet come from an experienced player on only four
    tables who can spot extra spots. A beginner or novice should play tighter, around
    21/18, with a 3-bet around 4-5%, and loosen up only as marginal spots become
    comfortable. Playing fewer tables justifies a few more hands because you can give
    each decision more attention.
  why: >-
    Loose stats are only profitable when every extra hand is played well postflop, and
    that takes experience. A tighter range keeps a newer player out of the marginal
    situations where most money is lost, while still capturing the core edge of
    isolating weak players and value betting. The number of tables matters because
    attention is the resource that converts a marginal hand into a profitable one; on
    many tables the same hand is a leak.
  common_mistake: >-
    Copying a coach's loose session stats hand for hand while playing eight tables and
    without the postflop experience to back it up.
  numbers:
    - "beginner target ~21/18 at 6-max"
    - "3-bet around 4-5% rather than ~8%"
    - "coach's 28/23 with ~8% 3-bet came from four tables and video play"
  source_refs:
