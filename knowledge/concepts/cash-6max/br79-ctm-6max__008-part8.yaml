      chunk: br79-ctm-6max/008-part8#05
      stance: supports
      note: "'I would advise more something like a 21/18'; 3-bet 'maybe four or five' not eight; plays looser on four tables."
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/008-part8
