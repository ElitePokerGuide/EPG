- id: c-cash-6max-br8-river-call-vs-passive-player-check-aggression-015
  format: cash-6max
  topic: river-play
  concepts: [river-calls, aggression-factor, passive-players, bluff-catching]
  level: beginner
  street: river
  pot_type: srp
  position: any
  title: "Before calling a river bet from a passive player, ask whether they are capable of bluffing"
  claim: >-
    Facing a river bet with a medium hand, first ask whether this opponent ever bluffs.
    Against a passive player with a very low aggression factor, lean towards folding:
    they have a real hand almost every time they bet. Against a player who has shown
    aggression, the call is fine. A weak-looking line of your own invites the odd stab
    and pushes a close spot back towards a call.
  why: >-
    Bluff-catching only profits when the opponent's betting range contains bluffs.
    Passive players bet when they have it and check when they do not, so their river
    bets are value-heavy and your medium hand is usually beaten. A low aggression factor
    is the stat that captures this, though it needs a large sample to trust. Your own
    line is the other input: a passive line from you invites the occasional bluff, which
    pushes a borderline spot back towards a call.
  common_mistake: >-
    Calling every river bet with second pair "because he could have anything", against a
    player who has never been seen to bluff.
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/008-part8
      chunk: br79-ctm-6max/008-part8#04
      stance: supports
      note: "'Is he capable of bluffing?'; low AF makes the river call closer to a fold; his own line makes it a call."
  consensus_score: 0.5
  hook_ideas:
    - "Can this player bluff? Answer before you call."
    - "A low aggression factor should make you fold more rivers."
    - "The one question that decides most river calls."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br8-cbet-less-often-out-of-position-016
  format: cash-6max
  topic: cbet-strategy
  concepts: [cbet-frequency, out-of-position, in-position, middling-boards]
  level: beginner
  street: flop
  pot_type: srp
  position: oop
  title: "The flops you skip c-betting should mostly be the ones where you are out of position"
  claim: >-
    Against a player who rarely folds, a middling flop with a gutshot is a check out of
    position, but the same flop is a c-bet in position. Most of the time you decline to
    c-bet, it should be because you are out of position; in position, keep betting at a
    very high frequency.
  why: >-
    Out of position a c-bet that gets called leaves you first to act on the turn with no
    information and no free card, so a bluff on a bad texture compounds across streets.
    In position the same bet is cheaper: if called, you can check the turn, see a free
    river, or decide with their action in front of you. Position changes the cost of
    being wrong, so it should change how often you fire on marginal flops.
  common_mistake: >-
    Using the same c-bet frequency in and out of position, which means bluffing too much
    from the blinds and too little from the button.
  source_refs:
    - school: br79
      course: Crushing the Micros 6-max
      lesson: br79-ctm-6max/008-part8
      chunk: br79-ctm-6max/008-part8#04
      stance: supports
      note: "Checks a middling flop OOP vs a non-folder; 'if I was in position I probably would have c-bet'; non-c-bets are mostly OOP."
  consensus_score: 0.5
  hook_ideas:
    - "Same flop, same hand. Bet in position, check out of position."
    - "Where you sit should change how often you c-bet."
    - "Most of your flop checks belong out of position."
  status: draft
  created: "2026-10-04"

- id: c-cash-6max-br8-bet-near-pot-every-street-with-a-monster-vs-fish-017
  format: cash-6max
  topic: value-betting
  concepts: [monster-hands, value-sizing, three-streets, weak-players]
  level: beginner
  street: multi-street
  pot_type: srp
  position: any
  title: "With a monster against a weak player, bet close to pot on all three streets"
  claim: >-
    When you hold a full house or similar lock against a loose passive player, the
    default line is to bet near pot on the flop, turn and river. Against a very bad
    player you can size even larger. They call with any piece, so small bets only leave
    money behind.
  why: >-
    Weak players do not fold a king on a paired board or a flush draw on the turn, and
    they rarely raise, so there is no reason to disguise your hand or keep the pot
    small. Three near-pot bets get the most money in by the river against a range that
    calls each one. The temptation to bet small to keep them in is misplaced: they are
    staying in anyway, and the only question is how much they pay.
  common_mistake: >-
    Betting a third of the pot with a full house to avoid scaring off a player who
    would have called pot.
  numbers:
    - "bet close to pot on every street with a monster vs a weak player"
  source_refs:
